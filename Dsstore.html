<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Store - Eletrônicos & Acessórios</title>
    <!-- Font Awesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-principal: #0f172a;
            --bg-card: #1e293b;
            --cor-primaria: #00f2fe;
            --cor-secundaria: #4facfe;
            --texto-claro: #f8fafc;
            --texto-mutado: #94a3b8;
            --sucesso: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-claro);
            overflow-x: hidden;
        }

        /* Header & Navegação */
        header {
            background-color: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            max-width: 1300px;
            margin: 0 auto;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--cor-primaria), var(--cor-secundaria));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Barra de Busca */
        .search-container {
            flex: 1;
            max-width: 500px;
            min-width: 200px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background-color: var(--bg-principal);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            padding-right: 40px;
            border-radius: 30px;
            color: white;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--cor-primaria);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--texto-mutado);
        }

        .cart-icon-container {
            position: relative;
            cursor: pointer;
            font-size: 1.4rem;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--cor-primaria);
            color: #000;
            font-size: 0.75rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Categorias Estilo Bolinha */
        .categories-section {
            margin-top: 90px;
            padding: 20px 5% 10px 5%;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .categories-carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 10px 5px;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .categories-carousel::-webkit-scrollbar {
            display: none;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            min-width: 85px;
            transition: transform 0.2s;
        }

        .category-item:hover { transform: scale(1.05); }

        .category-sphere {
            width: 65px;
            height: 65px;
            background: var(--bg-card);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 1.5rem;
            color: var(--texto-claro);
            transition: all 0.3s;
        }

        .category-item.active .category-sphere {
            border-color: var(--cor-primaria);
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), transparent);
            color: var(--cor-primaria);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .category-item span {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--texto-mutado);
        }

        .category-item.active span {
            color: var(--cor-primaria);
            font-weight: 600;
        }

        /* Vitrine de Produtos */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 5% 40px 5%;
        }

        .section-title {
            font-size: 1.6rem;
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 50px;
            height: 3px;
            background: var(--cor-primaria);
        }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .product-card:hover {
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.1);
        }

        /* Slide / Carrossel interno do Card */
        .product-slider-wrapper {
            width: 100%;
            height: 220px;
            position: relative;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .product-slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }

        .product-slide-item {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-slide-item img, .product-slide-item video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Setas do Slide na Vitrine */
        .slide-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.7);
            color: var(--cor-primaria);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            z-index: 10;
            transition: background 0.3s;
        }

        .slide-arrow:hover { background: rgba(0, 242, 254, 0.3); color: #000; }
        .arrow-left { left: 8px; }
        .arrow-right { right: 8px; }

        .product-category {
            font-size: 0.8rem;
            color: var(--cor-primaria);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 10px;
            height: 50px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--texto-claro);
            margin-bottom: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            margin-bottom: 8px;
        }

        .btn-cart {
            background-color: transparent;
            border: 1px solid var(--cor-primaria);
            color: var(--cor-primaria);
        }

        .btn-cart:hover { background-color: var(--cor-primaria); color: #000; }

        .btn-info {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--texto-mutado);
        }
        .btn-info:hover { border-color: var(--texto-claro); color: var(--texto-claro); }

        .btn-buy { background: linear-gradient(45deg, var(--cor-primaria), var(--cor-secundaria)); color: #000; }
        .btn-buy:hover { opacity: 0.9; }

        /* Janela Flutuante / Modal de Detalhes */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 850px;
            border-radius: 20px;
            padding: 30px;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--texto-mutado);
            z-index: 10;
        }

        .media-display { display: flex; flex-direction: column; gap: 15px; }

        .main-media-container {
            width: 100%;
            height: 300px;
            background-color: var(--bg-principal);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-media-container img, .main-media-container video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .thumb-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumb {
            width: 60px;
            height: 60px;
            background-color: var(--bg-principal);
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .thumb.active { border-color: var(--cor-primaria); }
        .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .thumb i { font-size: 1.2rem; color: var(--cor-primaria); }

        /* Lateral Carrinho */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -450px;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: var(--bg-card);
            z-index: 1500;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .cart-items-list { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .cart-item { display: flex; gap: 15px; background-color: var(--bg-principal); padding: 10px; border-radius: 10px; align-items: center; }
        .cart-item-img { width: 60px; height: 60px; object-fit: contain; background: #fff; border-radius: 5px; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-size: 0.9rem; font-weight: 500; }
        .cart-item-price { color: var(--cor-primaria); font-weight: 600; font-size: 0.95rem; }
        .cart-item-qty { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .qty-btn { background: none; border: 1px solid var(--texto-mutado); color: var(--texto-claro); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }
        .remove-item { color: #ef4444; cursor: pointer; margin-left: 10px; }

        .cart-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); background-color: rgba(15, 23, 42, 0.6); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .summary-total { font-size: 1.2rem; font-weight: 700; color: var(--cor-primaria); border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 10px; margin-top: 10px; }
        
        .checkout-form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; max-height: 200px; overflow-y: auto; padding-right: 5px; }
        .form-group { display: flex; gap: 10px; }
        .checkout-form input { background-color: var(--bg-principal); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; color: white; font-size: 0.85rem; width: 100%; }
        .checkout-form input:focus { outline: 1px solid var(--cor-primaria); }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background-color: var(--sucesso); color: white; padding: 12px 25px; border-radius: 30px; font-weight: 500; z-index: 3000; transition: transform 0.3s ease; box-shadow: 0 5px 15px rgba(34, 197, 94, 0.4); }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; justify-content: space-between; }
            .search-container { order: 3; max-width: 100%; min-width: 100%; margin-top: 5px;}
            .categories-section { margin-top: 140px; }
            .modal-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Toast Informativo -->
    <div class="toast" id="toast">Item adicionado ao carrinho! 🛒</div>

    <!-- Header -->
    <header>
        <div class="navbar">
            <div class="logo"><i class="fa-solid fa-bolt"></i> DS Store</div>
            
            <div class="search-container">
                <input type="text" id="campo-busca" placeholder="Buscar produto..." oninput="executarFiltros()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="cart-icon-container" onclick="toggleCarrinho(true)">
                <i class="fa-solid fa-bag-shopping"></i>
                <div class="cart-count" id="cart-count">0</div>
            </div>
        </div>
    </header>

    <!-- Menu de Categorias Bolinha -->
    <section class="categories-section">
        <div class="categories-carousel">
            <div class="category-item active" onclick="selecionarCategoria('todos', this)">
                <div class="category-sphere"><i class="fa-solid fa-border-all"></i></div><span>Todos</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('acessorios', this)">
                <div class="category-sphere"><i class="fa-solid fa-plug"></i></div><span>Acessórios</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('fone', this)">
                <div class="category-sphere"><i class="fa-solid fa-headset"></i></div><span>Fones</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('capinha', this)">
                <div class="category-sphere"><i class="fa-solid fa-mobile-screen-button"></i></div><span>Capinhas</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('pelicula', this)">
                <div class="category-sphere"><i class="fa-solid fa-shield-halved"></i></div><span>Películas</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('carregador', this)">
                <div class="category-sphere"><i class="fa-solid fa-battery-three-quarters"></i></div><span>Carregador</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('gamer', this)">
                <div class="category-sphere"><i class="fa-solid fa-gamepad"></i></div><span>Gamer</span>
            </div>
            <div class="category-item" onclick="selecionarCategoria('informatica', this)">
                <div class="category-sphere"><i class="fa-solid fa-laptop"></i></div><span>Informática</span>
            </div>
        </div>
    </section>

    <!-- Vitrine Principal -->
    <main class="container">
        <h2 class="section-title" id="titulo-vitrine">Todos os Produtos</h2>
        <div class="grid-produtos" id="vitrine-produtos">
            <!-- Injetado dinamicamente -->
        </div>
    </main>

    <!-- Página Flutuante / Modal Detalhes -->
    <div class="modal" id="modal-produto" onclick="fecharModalFora(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="fecharModal()"><i class="fa-solid fa-xmark"></i></span>
            
            <div class="media-display">
                <div class="main-media-container" id="container-midia-principal"></div>
                <div class="thumb-container" id="container-thumbs"></div>
            </div>

            <div style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <span class="product-category" id="modal-categoria">Categoria</span>
                    <h2 id="modal-titulo" style="margin-bottom: 15px;">Nome do Produto</h2>
                    <div class="product-price" id="modal-preco">R$ 0,00</div>
                    <p id="modal-descricao" style="color: var(--texto-mutado); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5;"></p>
                </div>
                <div>
                    <button class="btn-action btn-cart" id="modal-btn-carrinho"><i class="fa-solid fa-cart-plus"></i> Adicionar ao Carrinho</button>
                    <button class="btn-action btn-buy" id="modal-btn-comprar">Comprar Agora</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Carrinho Lateral -->
    <div class="cart-sidebar" id="carrinho-lateral">
        <div class="cart-header">
            <h3>Seu Carrinho</h3>
            <span style="cursor:pointer; font-size: 1.3rem;" onclick="toggleCarrinho(false)"><i class="fa-solid fa-xmark"></i></span>
        </div>

        <div class="cart-items-list" id="lista-itens-carrinho"></div>

        <div class="cart-footer">
            <div class="summary-row"><span>Subtotal:</span><span id="subtotal-val">R$ 0,00</span></div>
            <div class="summary-row"><span>Desconto:</span><span id="desconto-val" style="color: var(--sucesso)">- R$ 0,00</span></div>
            <div class="summary-row summary-total"><span>Total:</span><span id="total-val">R$ 0,00</span></div>

            <form class="checkout-form" id="form-checkout" onsubmit="event.preventDefault();">
                <input type="text" id="checkout-nome" placeholder="Nome Completo *" required>
                <div class="form-group">
                    <input type="text" id="checkout-cep" placeholder="CEP *" required>
                    <input type="text" id="checkout-cupom" placeholder="Cupom" oninput="aplicarCupom()">
                </div>
                <input type="text" id="checkout-endereco" placeholder="Endereço (Rua, Av.) *" required>
                <div class="form-group">
                    <input type="text" id="checkout-bairro" placeholder="Bairro *" required>
                    <input type="text" id="checkout-numero" placeholder="Nº *" required>
                </div>
            </form>

            <button class="btn-action btn-buy" style="margin-top: 15px; margin-bottom: 0;" onclick="finalizarPedido()"><i class="fa-brands fa-whatsapp"></i> Finalizar no WhatsApp</button>
        </div>
    </div>

    <!-- Scripts e Lógicas de Funcionamento -->
    <script>
        const TELEFONE_WHATSAPP = "558199152441"; 

        // Banco de dados com múltiplos slides (Imagens e Vídeo) cadastrados por produto
        const PRODUTOS = [
            {
                id: 1,
                titulo: "Headphone Bluetooth JBL Tune 720BT",
                categoria: "fone",
                preco: 349.90,
                descricao: "Experimente graves profundos Pure Bass com isolamento acústico de ponta. Até 44 hours de bateria recarregável em alto desempenho.",
                midias: [
                    { tipo: 'img', url: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80' },
                    { tipo: 'img', url: 'https://images.unsplash.com/photo-1484704849700-f032a568e944?w=500&q=80' },
                    { tipo: 'video', url: 'https://www.w3schools.com/html/mov_bbb.mp4' }
                ]
            },
            {
                id: 2,
                titulo: "Capinha SafeGrip Impact Pro - iPhone 15 Pro Max",
                categoria: "capinha",
                preco: 79.90,
                descricao: "Proteção de nível militar contra quedas de até 3 metros. Design ultra fino compatível com carregamento MagSafe.",
                midias: [
                    { tipo: 'img', url: 'https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=500&q=80' },
                    { tipo: 'img', url: 'https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=500&q=80' }
                ]
            },
            {
                id: 5,
                titulo: "Controle Sem Fio PS5 DualSense - Midnight Black",
                categoria: "gamer",
                preco: 450.00,
                descricao: "Descubra uma experiência de jogos mais profunda e imersiva com o inovador controle do PS5, apresentando feedback tátil e gatilhos dinâmicos.",
                midias: [
                    { tipo: 'img', url: 'https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=500&q=80' },
                    { tipo: 'img', url: 'https://images.unsplash.com/photo-1592840496694-26d035b52b48?w=500&q=80' }
                ]
            }
        ];

        let carrinho = [];
        let categoriaSelecionada = "todos";
        let descontoPorcentagem = 0;
        let indicesSlides = {}; 

        // INICIALIZAÇÃO: Carrega dados salvos do LocalStorage se existirem
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("ds_store_cart")) {
                try {
                    carrinho = JSON.parse(localStorage.getItem("ds_store_cart"));
                } catch (e) {
                    carrinho = [];
                }
            }
            renderizarProdutos(PRODUTOS);
            atualizarCarrinhoDOM();
        });

        function salvarLocalStorage() {
            localStorage.setItem("ds_store_cart", JSON.stringify(carrinho));
        }

        function executarFiltros() {
            pausarTodosOsVideos(); 
            const termoBusca = document.getElementById("campo-busca").value.toLowerCase().trim();
            const produtosFiltrados = PRODUTOS.filter(produto => {
                const correspondeCategoria = (categoriaSelecionada === "todos" || produto.categoria === categoriaSelecionada);
                const correspondeBusca = produto.titulo.toLowerCase().includes(termoBusca) || produto.descricao.toLowerCase().includes(termoBusca);
                return correspondeCategoria && correspondeBusca;
            });
            renderizarProdutos(produtosFiltrados);
        }

        function renderizarProdutos(lista) {
            const grid = document.getElementById("vitrine-produtos");
            if(lista.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--texto-mutado);">Nenhum produto encontrado.</div>`;
                return;
            }

            grid.innerHTML = lista.map(p => {
                if (indicesSlides[p.id] === undefined) indicesSlides[p.id] = 0;

                // Sem 'autoplay' nativo aqui para prevenir bugs visuais na digitação da busca
                const slidesHtml = p.midias.map(midia => `
                    <div class="product-slide-item">
                        ${midia.tipo === 'img' ? `<img src="${midia.url}" alt="${p.titulo}">` : `<video src="${midia.url}" muted loop playsinline></video>`}
                    </div>
                `).join('');

                const mostrarSetas = p.midias.length > 1 ? '' : 'display:none;';

                return `
                    <div class="product-card" id="card-${p.id}">
                        <div>
                            <div class="product-slider-wrapper">
                                <button class="slide-arrow arrow-left" style="${mostrarSetas}" onclick="mudarSlide(${p.id}, -1); event.stopPropagation();">❮</button>
                                <div class="product-slides" id="slides-${p.id}">
                                    ${slidesHtml}
                                </div>
                                <button class="slide-arrow arrow-right" style="${mostrarSetas}" onclick="mudarSlide(${p.id}, 1); event.stopPropagation();">❯</button>
                            </div>
                            <div class="product-category">${p.categoria}</div>
                            <div class="product-title">${p.titulo}</div>
                        </div>
                        <div>
                            <div class="product-price">R$ ${p.preco.toFixed(2).replace('.',',')}</div>
                            <button class="btn-action btn-info" onclick="abrirModal(${p.id})"><i class="fa-solid fa-circle-info"></i> Saber Mais / Detalhes</button>
                            <button class="btn-action btn-cart" onclick="adicionarAoCarrinho(${p.id}, false)"><i class="fa-solid fa-cart-plus"></i> Carrinho</button>
                            <button class="btn-action btn-buy" onclick="adicionarAoCarrinho(${p.id}, true)">Comprar</button>
                        </div>
                    </div>
                `;
            }).join('');

            lista.forEach(p => moverSlideDOM(p.id));
        }

        function gerenciarVideosDoCard(id) {
            const containerSlides = document.getElementById(`slides-${id}`);
            if (!containerSlides) return;
            
            const videos = containerSlides.querySelectorAll('video');
            videos.forEach(video => {
                video.pause();
                video.currentTime = 0;
            });

            const slideAtual = containerSlides.children[indicesSlides[id]];
            if (slideAtual) {
                const videoAtual = slideAtual.querySelector('video');
                if (videoAtual) {
                    videoAtual.play().catch(e => console.log("Aguardando interação preliminar"));
                }
            }
        }

        function pausarTodosOsVideos() {
            document.querySelectorAll('video').forEach(video => {
                video.pause();
                video.currentTime = 0;
            });
        }

        function mudarSlide(id, direcao) {
            const produto = PRODUTOS.find(p => p.id === id);
            if (!produto) return;

            indicesSlides[id] += direcao;

            if (indicesSlides[id] >= produto.midias.length) indicesSlides[id] = 0;
            if (indicesSlides[id] < 0) indicesSlides[id] = produto.midias.length - 1;

            moverSlideDOM(id);
            gerenciarVideosDoCard(id); 
        }

        function moverSlideDOM(id) {
            const containerSlides = document.getElementById(`slides-${id}`);
            if (containerSlides) {
                const deslocamento = indicesSlides[id] * 100;
                containerSlides.style.transform = `translateX(-${deslocamento}%)`;
            }
        }

        function selecionarCategoria(cat, elemento) {
            document.querySelectorAll('.category-item').forEach(item => item.classList.remove('active'));
            elemento.classList.add('active');
            categoriaSelecionada = cat;
            document.getElementById("titulo-vitrine").innerText = cat === "todos" ? "Todos os Produtos" : cat.toUpperCase();
            executarFiltros();
        }

        function dispararToast(mensagem) {
            const toast = document.getElementById("toast");
            if(mensagem) toast.innerText = message = mensagem;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        function toggleCarrinho(abrir) {
            const lateral = document.getElementById("carrinho-lateral");
            if(abrir) {
                pausarTodosOsVideos(); 
                lateral.classList.add("open");
            } else {
                lateral.classList.remove("open");
            }
        }

        function adicionarAoCarrinho(id, comprarDireto) {
            const produto = PRODUTOS.find(p => p.id === id);
            const itemExistente = carrinho.find(item => item.id === id);

            if(itemExistente) {
                itemExistente.quantidade++;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }

            atualizarCarrinhoDOM();
            salvarLocalStorage(); 
            
            if(comprarDireto) {
                fecharModal();
                toggleCarrinho(true);
            } else {
                dispararToast("Item adicionado ao carrinho! 🛒");
            }
        }

        function alterarQuantidade(id, delta) {
            const item = carrinho.find(i => i.id === id);
            if(item) {
                item.quantidade += delta;
                if(item.quantidade <= 0) {
                    carrinho = carrinho.filter(i => i.id !== id);
                }
                atualizarCarrinhoDOM();
                salvarLocalStorage(); 
            }
        }

        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(i => i.id !== id);
            atualizarCarrinhoDOM();
            salvarLocalStorage(); 
        }

        function atualizarCarrinhoDOM() {
            const totalItens = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
            document.getElementById("cart-count").innerText = totalItens;

            const lista = document.getElementById("lista-itens-carrinho");
            if(carrinho.length === 0) {
                lista.innerHTML = `<p style="text-align:center; color: var(--texto-mutado); margin-top: 40px;">Seu carrinho está vazio.</p>`;
            } else {
                lista.innerHTML = carrinho.map(item => `
                    <div class="cart-item">
                        <img src="${item.midias[0].url}" class="cart-item-img">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.titulo}</div>
                            <div class="cart-item-price">R$ ${(item.preco * item.quantidade).toFixed(2).replace('.',',')}</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="alterarQuantidade(${item.id}, -1)">-</button>
                                <span>${item.quantidade}</span>
                                <button class="qty-btn" onclick="alterarQuantidade(${item.id}, 1)">+</button>
                                <i class="fa-regular fa-trash-can remove-item" onclick="removerDoCarrinho(${item.id})"></i>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            const subtotal = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            const valorDesconto = subtotal * descontoPorcentagem;
            const total = subtotal - valorDesconto;

            document.getElementById("subtotal-val").innerText = `R$ ${subtotal.toFixed(2).replace('.',',')}`;
            document.getElementById("desconto-val").innerText = `- R$ ${valorDesconto.toFixed(2).replace('.',',')}`;
            document.getElementById("total-val").innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
        }

        function aplicarCupom() {
            const valorCupom = document.getElementById("checkout-cupom").value.toUpperCase().trim();
            descontoPorcentagem = valorCupom === "DS10" ? 0.10 : 0;
            atualizarCarrinhoDOM();
        }

        function abrirModal(id) {
            pausarTodosOsVideos(); 
            const produto = PRODUTOS.find(p => p.id === id);
            if(!produto) return;

            document.getElementById("modal-categoria").innerText = produto.categoria;
            document.getElementById("modal-titulo").innerText = produto.titulo;
            document.getElementById("modal-preco").innerText = `R$ ${produto.preco.toFixed(2).replace('.',',')}`;
            document.getElementById("modal-descricao").innerText = produto.descricao;

            document.getElementById("modal-btn-carrinho").onclick = () => adicionarAoCarrinho(produto.id, false);
            document.getElementById("modal-btn-comprar").onclick = () => adicionarAoCarrinho(produto.id, true);

            renderizarMidiasModal(produto.midias);
            document.getElementById("modal-produto").style.display = "flex";
        }

        function fecharModal() {
            document.getElementById("modal-produto").style.display = "none";
            document.getElementById("container-midia-principal").innerHTML = ""; 
        }

        function fecharModalFora(e) {
            if(e.target.id === "modal-produto") fecharModal();
        }

        function renderizarMidiasModal(midias) {
            const thumbsContainer = document.getElementById("container-thumbs");

            alterarMidiaDestaque(midias[0]);

            thumbsContainer.innerHTML = midias.map((midia, index) => `
                <div class="thumb ${index === 0 ? 'active' : ''}" onclick="setThumbAtiva(this); alterarMidiaDestaque(${JSON.stringify(midia)})">
                    ${midia.tipo === 'img' ? `<img src="${midia.url}">` : `<i class="fa-solid fa-circle-play"></i>`}
                </div>
            `).join('');
        }

        function alterarMidiaDestaque(midia) {
            const principal = document.getElementById("container-midia-principal");
            if(midia.tipo === 'img') {
                principal.innerHTML = `<img src="${midia.url}" alt="Produto">`;
            } else if(midia.tipo === 'video') {
                principal.innerHTML = `<video src="${midia.url}" controls autoplay muted playsinline></video>`;
            }
        }

        function setThumbAtiva(elemento) {
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            elemento.classList.add('active');
        }

        function finalizarPedido() {
            if(carrinho.length === 0) {
                dispararToast("Seu carrinho está vazio!");
                return;
            }

            const nome = document.getElementById("checkout-nome").value;
            const cep = document.getElementById("checkout-cep").value;
            const endereco = document.getElementById("checkout-endereco").value;
            const bairro = document.getElementById("checkout-bairro").value;
            const numero = document.getElementById("checkout-numero").value;
            const cupom = document.getElementById("checkout-cupom").value;

            if(!nome || !cep || !endereco || !bairro || !numero) {
                dispararToast("Preencha todos os campos obrigatórios (*)");
                return;
            }

            let mensagem = `🚀 *NOVO PEDIDO - DS STORE* \n\n`;
            mensagem += `👤 *Cliente:* ${nome}\n`;
            mensagem += `📍 *Entrega:* ${endereco}, Nº ${numero}\n`;
            mensagem += `🏢 *Bairro:* ${bairro} | *CEP:* ${cep}\n`;
            if(cupom) mensagem += `🎟️ *Cupom:* ${cupom.toUpperCase()}\n`;
            mensagem += `\n-----------------------------\n📦 *ITENS:* \n\n`;

            carrinho.forEach(item => {
                mensagem += `▪️ ${item.quantidade}x ${item.titulo}\n`;
                mensagem += `   _Valor: R$ ${(item.preco * item.quantidade).toFixed(2).replace('.',',')}_\n\n`;
            });

            const subtotal = carrinho.reduce((acc, item) => acc + (item.preco * item.quantidade), 0);
            const valorDesconto = subtotal * descontoPorcentagem;
            const total = subtotal - valorDesconto;

            mensagem += `-----------------------------\n`;
            mensagem += `💵 *Subtotal:* R$ ${subtotal.toFixed(2).replace('.',',')}\n`;
            if(valorDesconto > 0) mensagem += `🔻 *Desconto:* R$ ${valorDesconto.toFixed(2).replace('.',',')}\n`;
            mensagem += `💰 *TOTAL DO PEDIDO:* R$ ${total.toFixed(2).replace('.',',')}`;

            const urlFinal = `https://api.whatsapp.com/send?phone=${TELEFONE_WHATSAPP}&text=${encodeURIComponent(mensagem)}`;
            window.open(urlFinal, '_blank');
        }
    </script>
</body>
</html>
