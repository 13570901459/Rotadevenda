<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL TÁTICO | EUR/USD</title>
    <style>
        :root {
            --matrix-green: #00ff41;
            --dark-bg: #030303;
            --alert-red: #ff0000;
            --army-dim: #1b3022;
        }

        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--dark-bg);
            color: var(--matrix-green);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--army-dim);
        }

        /* ANIMAÇÃO DE FUNDO "MATRIX" */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            z-index: -1;
        }

        /* HEADER */
        header {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--matrix-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        /* ALERTAS GRANDES */
        #main-alert {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            padding: 20px 40px;
            border: 4px solid white;
            z-index: 999;
            text-align: center;
            display: none;
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(-50%, -50%) skew(0deg); }
            50% { transform: translate(-50.5%, -49.5%) skew(2deg); }
            100% { transform: translate(-49.5%, -50.5%) skew(-2deg); }
        }

        /* LAYOUT */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 350px;
            flex-grow: 1;
        }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        }

        /* COLUNA DA ESQUERDA: ANÁLISE DINÂMICA */
        .analysis-core {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--army-dim);
        }

        .data-stream {
            flex-grow: 1;
            background: rgba(0, 40, 0, 0.2);
            border: 1px solid var(--army-dim);
            padding: 15px;
            font-size: 0.85rem;
            overflow-y: hidden;
            position: relative;
        }

        .indicator-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .ind-item {
            border: 1px solid var(--matrix-green);
            padding: 10px;
            background: rgba(0, 255, 65, 0.05);
        }

        .val { float: right; color: #fff; text-shadow: 0 0 5px var(--matrix-green); }

        /* COLUNA DA DIREITA: LISTA E PLACAR */
        .sidebar {
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
        }

        .status-panel {
            padding: 15px;
            border-bottom: 1px solid var(--army-dim);
            text-align: center;
        }

        .signal-list {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .signal-row {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--army-dim);
            display: flex;
            justify-content: space-between;
        }

        .signal-row.win { border-left-color: var(--matrix-green); color: var(--matrix-green); }
        .signal-row.loss { border-left-color: var(--alert-red); color: var(--alert-red); }

        /* PULSE ANIMAÇÃO */
        .active-signal { animation: pulse-green 1s infinite; }
        @keyframes pulse-green {
            0% { background: rgba(0, 255, 65, 0); }
            50% { background: rgba(0, 255, 65, 0.2); }
            100% { background: rgba(0, 255, 65, 0); }
        }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div id="main-alert">
    <h1 id="alert-title">ALERTA DE ANÁLISE</h1>
    <p id="alert-msg">POSSÍVEL SINAL EM 10 MINUTOS</p>
</div>

<header>
    <div>[TERMINAL_V3] <span id="pair">EUR/USD</span></div>
    <div id="live-clock">00:00:00</div>
    <div id="connection">CONECTADO: BINANCE_WS</div>
</header>

<div class="dashboard">
    <div class="analysis-core">
        <div class="indicator-box">
            <div class="ind-item">EMA 14 <span id="v-ema14" class="val">1.0845</span></div>
            <div class="ind-item">EMA 50 <span id="v-ema50" class="val">1.0832</span></div>
            <div class="ind-item">SMA 50 <span id="v-sma50" class="val">1.0820</span></div>
            <div class="ind-item">FRACTAL <span id="v-fractal" class="val">DETECTADO</span></div>
        </div>

        <div class="data-stream" id="log-console">
            <!-- Logs automáticos simulando a IA -->
        </div>
        
        <div class="ind-item" style="border-color: #555;">
            SUPORTE: <span class="val">1.07902</span><br>
            RESISTÊNCIA: <span class="val">1.09210</span>
        </div>
    </div>

    <div class="sidebar">
        <div class="status-panel">
            WINS: <span id="w">0</span> | LOSS: <span id="l">0</span><br>
            <small>RESULTADOS EM TEMPO REAL (ATÉ GALE 1)</small>
        </div>
        <div class="signal-list" id="list-container">
            <!-- Sinais injetados aqui -->
        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO DOS SINAIS ---
    const rawSignals = [
        { time: "13:10", dir: "PUT", desc: "MHI 1 (Minoria)" },
        { time: "13:15", dir: "CALL", desc: "MHI 2 (Minoria)" },
        { time: "13:20", dir: "PUT", desc: "Fluxo EMA 14" },
        { time: "17:45", dir: "CALL", desc: "Reversão Ciclo" },
        { time: "17:50", dir: "PUT", desc: "Fractal M5" }
    ];

    let wins = 0; let losses = 0;

    // --- ANIMAÇÃO MATRIX ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$@#%";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff41";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters[Math.floor(Math.random() * letters.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    // --- LÓGICA DE ANÁLISE DINÂMICA ---
    function addLog(msg) {
        const consoleObj = document.getElementById('log-console');
        const entry = document.createElement('div');
        entry.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        consoleObj.prepend(entry);
        if (consoleObj.childNodes.length > 15) consoleObj.lastChild.remove();
    }

    // Simula análise mudando números
    setInterval(() => {
        const price = (1.08 + Math.random() * 0.01).toFixed(5);
        document.getElementById('v-ema14').innerText = price;
        addLog(`ANALISANDO FLUXO DE VELA: ${(Math.random() * 100).toFixed(0)}% ESTÁVEL`);
    }, 3000);

    // --- ALERTAS E EXECUÇÃO ---
    function checkSchedules() {
        const now = new Date();
        const currentH = now.getHours();
        const currentM = now.getMinutes();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString();

        rawSignals.forEach((sig, i) => {
            const [h, m] = sig.time.split(':').map(Number);
            const target = new Date(); target.setHours(h, m, 0);
            const diff = (target - now) / 60000;

            // 10 MINUTOS ANTES - ALERTA NA TELA
            if (diff <= 10 && diff > 9.8) {
                triggerAlert("ANÁLISE INICIADA", `SINAL EM 10 MIN: ${sig.dir} ${sig.time}`);
            }

            // 3 MINUTOS ANTES - PREPARAÇÃO
            if (diff <= 3 && diff > 2.8) {
                triggerAlert("PREPARAR ENTRADA", `SINAL ${sig.dir} EM 3 MINUTOS!`, true);
                addLog(`ALGORITMO CONFIRMANDO ${sig.desc}...`);
            }

            // EXECUÇÃO DO RESULTADO
            if (diff <= 0 && !sig.done) {
                executeResult(sig, i);
            }
        });
    }

    function triggerAlert(title, msg, isGreen = false) {
        const box = document.getElementById('main-alert');
        box.style.display = 'block';
        box.style.background = isGreen ? 'rgba(0, 255, 65, 0.9)' : 'rgba(255, 0, 0, 0.9)';
        document.getElementById('alert-title').innerText = title;
        document.getElementById('alert-msg').innerText = msg;
        setTimeout(() => box.style.display = 'none', 8000);
    }

    function executeResult(sig, index) {
        sig.done = true;
        const row = document.getElementById(`row-${index}`);
        addLog(`EXECUTANDO SINAL: ${sig.dir} @ ${sig.time}`);
        
        // Simulação Realista com Gale 1
        setTimeout(() => {
            const win = Math.random() > 0.3;
            if(win) {
                wins++; row.className = 'signal-row win';
                addLog(`SINAL ${sig.time}: WIN DIRETO!`);
            } else {
                addLog(`SINAL ${sig.time}: LOSS DIRETO. ENTRANDO GALE 1...`);
                setTimeout(() => {
                    if(Math.random() > 0.4) {
                        wins++; row.className = 'signal-row win';
                        addLog(`SINAL ${sig.time}: WIN NO GALE 1!`);
                    } else {
                        losses++; row.className = 'signal-row loss';
                        addLog(`SINAL ${sig.time}: LOSS TOTAL.`);
                    }
                    updateScore();
                }, 3000);
            }
            updateScore();
        }, 5000);
    }

    function updateScore() {
        document.getElementById('w').innerText = wins;
        document.getElementById('l').innerText = losses;
    }

    // Gerar lista
    const container = document.getElementById('list-container');
    rawSignals.forEach((s, i) => {
        container.innerHTML += `
            <div class="signal-row" id="row-${i}">
                <span>${s.time}</span>
                <span style="font-weight:bold">${s.dir}</span>
                <small>${s.desc}</small>
            </div>
        `;
    });

    setInterval(checkSchedules, 1000);

</script>
</body>
</html>
