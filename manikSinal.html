<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE GERENCIAMENTO HACKER - M1</title>
    <style>
        :root {
            --army-green: #4b5320;
            --dark-green: #0a0c05;
            --neon-green: #82f00a;
            --hacker-glow: 0 0 15px rgba(130, 240, 10, 0.4);
        }

        body {
            background-color: var(--dark-green);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Efeito de Scanline (Linhas de monitor antigo) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: rgba(20, 25, 10, 0.9);
            border: 1px solid var(--army-green);
            padding: 30px;
            box-shadow: var(--hacker-glow);
            border-radius: 2px;
            position: relative;
            z-index: 3;
        }

        h1 {
            text-align: center;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 0;
            border-bottom: 2px solid var(--army-green);
            padding-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border: 1px solid var(--army-green);
            border-left: 4px solid var(--neon-green);
        }

        .stat-label {
            font-size: 0.65rem;
            color: #6b7a2d;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 5px;
            color: var(--army-green);
        }

        input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--army-green);
            color: var(--neon-green);
            padding: 10px;
            box-sizing: border-box;
            outline: none;
            font-family: 'Courier New', monospace;
        }

        input:focus {
            border-color: var(--neon-green);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--army-green);
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }

        #log {
            margin-top: 20px;
            height: 120px;
            background: #000;
            border: 1px solid var(--army-green);
            padding: 10px;
            font-size: 0.75rem;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .blink {
            animation: blinker 1s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .footer-info {
            text-align: center;
            font-size: 0.6rem;
            margin-top: 15px;
            color: #3d441a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>PROTOCOL_M1_ROBOT</h1>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">BANCA ATUAL</div>
                <div class="stat-value" id="display-banca">R$ 50.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">RISCO (STOP)</div>
                <div class="stat-value" id="display-stop" style="color: #ff4444;">R$ 5.00</div>
            </div>
        </div>

        <div class="input-group">
            <label>VALOR DA BANCA (R$)</label>
            <input type="number" id="banca-input" value="50" step="0.01">
        </div>

        <div class="input-group">
            <label>PAYOUT DA CORRETORA (%)</label>
            <input type="number" id="payout-input" value="85">
        </div>

        <button class="btn" onclick="iniciarCalculo()">INICIAR PROTOCOLO</button>

        <div id="log">> AGUARDANDO COMANDO...</div>

        <div class="footer-info">
            SECURE CONNECTION ACTIVE // NO_MARTINGALE_MODE
        </div>
    </div>

    <script>
        function iniciarCalculo() {
            const banca = parseFloat(document.getElementById('banca-input').value);
            const payout = parseFloat(document.getElementById('payout-input').value) / 100;
            const log = document.getElementById('log');
            
            // Gerenciamento: 10% de Stop Loss
            const stopLoss = banca * 0.10;
            const entrada1 = stopLoss; // Entrada fixa no stop do dia
            const lucro1 = entrada1 * payout;
            const entrada2 = entrada1 + lucro1; // Mão de Soros
            const lucroFinal = lucro1 + (entrada2 * payout);

            // Atualiza UI
            document.getElementById('display-banca').innerText = `R$ ${banca.toFixed(2)}`;
            document.getElementById('display-stop').innerText = `R$ ${stopLoss.toFixed(2)}`;

            log.innerHTML = "> ACESSANDO MERCADO...<br>";
            
            setTimeout(() => {
                log.innerHTML += "> CALCULANDO PROBABILIDADES M1...<br>";
            }, 400);

            setTimeout(() => {
                log.innerHTML = `> <span style="color:white">EXECUTAR GERENCIAMENTO:</span>\n`;
                log.innerHTML += `> ENTRADA 01: <span style="color:var(--neon-green)">R$ ${entrada1.toFixed(2)}</span>\n`;
                log.innerHTML += `> SE WIN: PRÓXIMA R$ ${entrada2.toFixed(2)}\n`;
                log.innerHTML += `> SE LOSS: <span style="color:#ff4444">PARE IMEDIATAMENTE</span>\n`;
                log.innerHTML += `> ---------------------------\n`;
                log.innerHTML += `> META DO DIA: <span style="color:var(--neon-green)">+R$ ${lucroFinal.toFixed(2)}</span>\n`;
                log.innerHTML += `> <span class="blink">AGUARDANDO OPORTUNIDADE M1...</span>`;
            }, 1000);
        }
    </script>
</body>
</html>
