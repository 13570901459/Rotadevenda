<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL MILITAR | EUR/USD</title>
    <style>
        :root {
            --neon: #00ff41;
            --bg: #050505;
            --alert: #ff0000;
        }

        body {
            background-color: var(--bg);
            color: var(--neon);
            font-family: 'Courier New', monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* EFEITO MATRIX FUNDO */
        #canvas-matrix {
            position: fixed;
            top: 0; left: 0;
            z-index: -1;
            opacity: 0.15;
        }

        header {
            padding: 10px;
            border-bottom: 1px solid var(--neon);
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.8);
            font-size: 12px;
        }

        /* ÁREA DE STATUS */
        .main-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .radar {
            width: 200px;
            height: 200px;
            border: 2px solid var(--neon);
            border-radius: 50%;
            position: relative;
            animation: pulse 2s infinite;
        }

        .radar::after {
            content: '';
            position: absolute;
            width: 50%; height: 2px;
            background: var(--neon);
            top: 50%; left: 50%;
            transform-origin: left;
            animation: rotate 4s linear infinite;
        }

        /* NOTIFICAÇÃO 10 MIN (WINDOWS STYLE) */
        #notif-10 {
            position: fixed;
            top: 20px;
            right: -400px;
            width: 300px;
            background: #111;
            border-right: 5px solid var(--alert);
            padding: 15px;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            box-shadow: 0 0 20px rgba(0,0,0,1);
        }

        #notif-10.show { right: 20px; }

        /* SEQUESTRO DE TELA 3 MIN (LOCK-ON) */
        #lock-on {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 15px solid var(--neon);
        }

        #lock-on.put { border-color: var(--alert); }

        .lock-title { font-size: 20px; letter-spacing: 10px; margin-bottom: 30px; }
        .lock-time { font-size: 100px; font-weight: bold; line-height: 1; }
        .lock-dir { font-size: 60px; margin: 20px 0; border: 3px solid #fff; padding: 10px 50px; }
        .lock-desc { font-size: 18px; color: #888; }

        /* LOGS LATERAIS */
        #side-logs {
            position: absolute;
            left: 10px; bottom: 10px;
            font-size: 10px;
            width: 300px;
            max-height: 200px;
            overflow: hidden;
            opacity: 0.6;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0% { box-shadow: 0 0 5px var(--neon); } 50% { box-shadow: 0 0 20px var(--neon); } 100% { box-shadow: 0 0 5px var(--neon); } }

    </style>
</head>
<body>

<canvas id="canvas-matrix"></canvas>

<header>
    <div>STATUS: ANALISANDO FLUXO...</div>
    <div>EUR/USD</div>
    <div id="relogio">00:00:00</div>
</header>

<div class="main-view">
    <div class="radar"></div>
    <p style="margin-top: 20px; letter-spacing: 3px;">SCANNING EUR/USD MARKET...</p>
</div>

<div id="side-logs"></div>

<!-- Notificação 10 min -->
<div id="notif-10">
    <div style="color:var(--alert); font-weight:bold; font-size:12px;">⚠ OPORTUNIDADE DETECTADA</div>
    <div id="msg-10" style="font-size:14px; margin-top:5px;">Iniciando varredura para o sinal de 00:00</div>
</div>

<!-- Sequestro de Tela 3 min -->
<div id="lock-on">
    <div class="lock-title">TARGET LOCKED</div>
    <div class="lock-time" id="lk-time">00:00</div>
    <div class="lock-dir" id="lk-dir">Atenção!</div>
    <div class="lock-desc" id="lk-desc">ESTRATEGIA</div>
    <p class="blink" style="margin-top: 40px; color: var(--alert);">PREPARAR ENTRADA NA CORRETORA</p>
</div>

<script>
    // LISTA MANUAL
    const sinais = [
       { time: "08:25", dir: "PUT", desc: "MHI 1 (Minoria)" },
{ time: "08:30", dir: "CALL", desc: "Reversão de Suporte (Abertura NY)" },
{ time: "08:35", dir: "CALL", desc: "MHI 2 (Minoria)" },
{ time: "08:40", dir: "PUT", desc: "Fluxo (Abaixo da EMA 14)" },
{ time: "08:45", dir: "CALL", desc: "MHI 1 (Minoria)" },
{ time: "08:50", dir: "PUT", desc: "Ciclo de Probabilidade" },
{ time: "08:55", dir: "PUT", desc: "MHI 1 (Minoria)" },
{ time: "09:00", dir: "CALL", desc: "Virada de Hora (Impacto de NY)" }
    ];

    function log(msg) {
        const l = document.getElementById('side-logs');
        l.innerHTML = `<div>> [${new Date().toLocaleTimeString()}] ${msg}</div>` + l.innerHTML;
    }

    function engine() {
        const agora = new Date();
        document.getElementById('relogio').innerText = agora.toLocaleTimeString();
        
        sinais.forEach(s => {
            const [h, m] = s.time.split(':').map(Number);
            const alvo = new Date(); alvo.setHours(h, m, 0);
            const diff = (alvo - agora) / 60000;

            // 10 MINUTOS: ALERTA LATERAL
            if (diff <= 10 && diff > 9.9) {
                const n = document.getElementById('notif-10');
                document.getElementById('msg-10').innerText = `Sinal ${s.dir} detectado às ${s.time}`;
                n.classList.add('show');
                log(`VARREDURA (SCANNING) INICIADA PARA ${s.time}`);
                setTimeout(() => n.classList.remove('show'), 10000);
            }

            // 3 MINUTOS: SEQUESTRO DE TELA
            if (diff <= 3 && diff > 0) {
                const lock = document.getElementById('lock-on');
                lock.style.display = 'flex';
                lock.className = s.dir.toLowerCase() === 'put' ? 'put' : '';
                
                document.getElementById('lk-time').innerText = s.time;
                document.getElementById('lk-dir').innerText = s.dir;
                document.getElementById('lk-desc').innerText = s.desc;
            }

            // APÓS O SINAL: LIMPAR TELA
            if (diff < 0 && diff > -1) {
                document.getElementById('lock-on').style.display = 'none';
            }
        });
    }

    // MATRIX BG
    const canvas = document.getElementById('canvas-matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const columns = canvas.width / 20;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff41";
        ctx.font = "15px monospace";
        drops.forEach((y, i) => {
            const text = String.fromCharCode(Math.random() * 128);
            ctx.fillText(text, i * 20, y * 20);
            if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }

    setInterval(drawMatrix, 50);
    setInterval(engine, 1000);
    log("Terminal Inicializado. Modo Fantasma Ativado.");
</script>

</body>
</html>
