<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANTUM TACTICAL TERMINAL | V6.0</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #010101;
            --alert-red: #ff003c;
            --army-green: #1a2e1a;
            --interface-gold: #ffcc00;
        }

        * { box-sizing: border-box; font-family: 'Consolas', monospace; }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            border: 2px solid var(--army-green);
        }

        /* EFEITO DE SCANLINE HACKER */
        body::after {
            content: " ";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 1000;
        }

        header {
            display: flex; justify-content: space-between;
            padding: 10px 20px; background: #000;
            border-bottom: 1px solid var(--neon-green);
            font-size: 12px; letter-spacing: 2px;
        }

        /* GRID PRINCIPAL */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: calc(100vh - 45px);
        }

        /* PAINEL LATERAL */
        .sidebar {
            border-right: 1px solid var(--army-green);
            display: flex; flex-direction: column;
            background: rgba(0, 10, 0, 0.5);
        }

        .panel-title {
            background: var(--army-green);
            color: white; padding: 5px 10px;
            font-size: 11px; text-transform: uppercase;
        }

        #log-terminal {
            flex-grow: 1; padding: 10px;
            font-size: 10px; overflow-y: hidden;
            color: rgba(0, 255, 65, 0.7);
        }

        /* ÁREA CENTRAL DO RADAR */
        .viewport {
            position: relative;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        #radar-canvas {
            position: absolute; opacity: 0.2;
            width: 80%; height: 80%; z-index: -1;
        }

        /* NOTIFICAÇÃO 10 MIN (DISCRETA) */
        #notify-10 {
            position: absolute; top: 20px; right: -350px;
            width: 300px; background: rgba(0, 20, 0, 0.9);
            border: 1px solid var(--interface-gold);
            padding: 15px; transition: 0.5s;
            box-shadow: 0 0 15px var(--interface-gold);
        }

        /* OVERLAY 3 MIN (SEQUESTRO DE TELA) */
        #signal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 2000;
            border: 10px solid transparent;
        }

        #signal-overlay.active-put { display: flex; border-color: var(--alert-red); animation: pulse-red 1.5s infinite; }
        #signal-overlay.active-call { display: flex; border-color: var(--neon-green); animation: pulse-green 1.5s infinite; }

        .big-time { font-size: 120px; font-weight: bold; margin: 0; line-height: 1; }
        .big-dir { font-size: 80px; margin: 20px 0; border: 2px solid #fff; padding: 10px 40px; }
        .strategy-label { font-size: 20px; color: #888; text-transform: uppercase; }

        @keyframes pulse-red { 0% { box-shadow: inset 0 0 50px #ff0000; } 50% { box-shadow: inset 0 0 150px #ff0000; } 100% { box-shadow: inset 0 0 50px #ff0000; } }
        @keyframes pulse-green { 0% { box-shadow: inset 0 0 50px #00ff41; } 50% { box-shadow: inset 0 0 150px #00ff41; } 100% { box-shadow: inset 0 0 50px #00ff41; } }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<header>
    <div>STATUS: <span class="blink">SYSTEM_ONLINE</span></div>
    <div id="pair-header">ASSET: EUR/USD (OTC)</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-grid">
    <div class="sidebar">
        <div class="panel-title">Kernel Activity</div>
        <div id="log-terminal"></div>
        <div class="panel-title">Performance Monitor</div>
        <div style="padding:10px; font-size: 12px;">
            CPU_LOAD: 14% <br>
            LATENCY: 12ms <br>
            WINS: <span id="win-count" style="color:var(--neon-green)">0</span> | 
            LOSS: <span id="loss-count" style="color:var(--alert-red)">0</span>
        </div>
    </div>

    <div class="viewport">
        <canvas id="radar-canvas"></canvas>
        <div id="status-text" style="font-size: 18px; letter-spacing: 5px;">AGUARDANDO SEQUÊNCIA DE DADOS...</div>
        
        <!-- Notificação lateral 10 min -->
        <div id="notify-10">
            <div style="color:var(--interface-gold); font-size:10px; margin-bottom:5px;">[NOTIFICAÇÃO DE ANÁLISE]</div>
            <div id="notify-msg" style="font-size:13px;">ANÁLISE TRAVADA NO PAR EUR/USD. AGUARDE...</div>
        </div>
    </div>
</div>

<!-- O Sequestro de Tela (3 min antes) -->
<div id="signal-overlay">
    <div class="strategy-label" id="ov-desc">ESTRATÉGIA</div>
    <div class="big-time" id="ov-time">00:00</div>
    <div class="big-dir" id="ov-dir">CALL</div>
    <div class="strategy-label blink">ENTRADA IMINENTE - PREPARAR</div>
</div>

<script>
    // LISTA DE SINAIS MANUAL
    const signalList = [
        { time: "19:15", dir: "PUT", desc: "MHI 1 (Minoria)" },
        { time: "19:20", dir: "CALL", desc: "MHI 2 (Minoria)" },
        { time: "19:25", dir: "PUT", desc: "Fluxo (Abaixo da EMA 14)" },
        { time: "19:30", dir: "CALL", desc: "Virada de Ciclo (Algoritmo)" },
        { time: "19:35", dir: "PUT", desc: "MHI 1 (Minoria)" },
        { time: "19:40", dir: "CALL", desc: "Ciclo de Repetição" },
        { time: "19:45", dir: "PUT", desc: "Reversão de Topo" },
        { time: "19:50", dir: "CALL", desc: "MHI 2 (Minoria)" }
    ];

    let wins = 0; let losses = 0;

    function addLog(msg) {
        const terminal = document.getElementById('log-terminal');
        const entry = document.createElement('div');
        entry.innerHTML = `> [${new Date().toLocaleTimeString()}] ${msg}`;
        terminal.prepend(entry);
        if(terminal.childNodes.length > 25) terminal.lastChild.remove();
    }

    function updateTerminal() {
        const now = new Date();
        const curTimeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        document.getElementById('clock').innerText = now.toLocaleTimeString();

        signalList.forEach(sig => {
            const [h, m] = sig.time.split(':').map(Number);
            const target = new Date(); target.setHours(h, m, 0);
            const diffMs = target - now;
            const diffMin = diffMs / 60000;

            // 1. ALERTA 10 MINUTOS (Notificação lateral)
            if (diffMin <= 10 && diffMin > 9.8) {
                const note = document.getElementById('notify-10');
                note.style.right = '20px';
                document.getElementById('notify-msg').innerText = `Análise travada para ${sig.time}.`;
                addLog(`[ALERTA] Varredura iniciada para o sinal das ${sig.time}`);
                setTimeout(() => { note.style.right = '-350px'; }, 8000);
            }

            // 2. SEQUESTRO DE TELA 3 MINUTOS
            if (diffMin <= 3 && diffMin > 0) {
                const overlay = document.getElementById('signal-overlay');
                overlay.className = sig.dir === 'PUT' ? 'active-put' : 'active-call';
                
                document.getElementById('ov-time').innerText = sig.time;
                document.getElementById('ov-dir').innerText = sig.dir;
                document.getElementById('ov-desc').innerText = sig.desc;
                
                document.getElementById('status-text').innerText = `SINAL EM CURSO: ${sig.dir}`;
            } 
            
            // 3. FECHAR OVERLAY APÓS O SINAL
            if (diffMin < 0 && diffMin > -1) {
                document.getElementById('signal-overlay').className = '';
                if(!sig.processed) {
                    sig.processed = true;
                    // Simulação automática de resultado
                    const win = Math.random() > 0.3;
                    if(win) { wins++; addLog(`RESULTADO: WIN @ ${sig.time}`); }
                    else { losses++; addLog(`RESULTADO: LOSS @ ${sig.time}`); }
                    document.getElementById('win-count').innerText = wins;
                    document.getElementById('loss-count').innerText = losses;
                }
            }
        });
    }

    // Efeito Visual de Radar de fundo
    const canvas = document.getElementById('radar-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 600;
    let angle = 0;

    function drawRadar() {
        ctx.clearRect(0,0,600,600);
        ctx.strokeStyle = '#00ff41';
        ctx.beginPath(); ctx.arc(300,300,250,0,Math.PI*2); ctx.stroke();
        ctx.moveTo(300,300);
        ctx.lineTo(300 + Math.cos(angle)*250, 300 + Math.sin(angle)*250);
        ctx.stroke();
        angle += 0.05;
        requestAnimationFrame(drawRadar);
    }
    drawRadar();

    setInterval(updateTerminal, 1000);
    addLog("Terminal Quantum Inicializado...");
    addLog("Lista manual carregada com sucesso.");
</script>

</body>
</html>
