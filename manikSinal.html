<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MILITARY SIGNAL BOT | EUR/USD</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --army-green: #4b5320;
            --neon-green: #00ff41;
            --dark-black: #050505;
            --alert-red: #ff0000;
            --military-grey: #1a1a1a;
            --glass: rgba(0, 255, 65, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-black);
            color: var(--neon-green);
            font-family: 'Segoe UI', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Evita scroll na página inteira modo 'App' */
        }

        /* HEADER ESTILO SOFTWARE */
        header {
            background: #000;
            border-bottom: 2px solid var(--army-green);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 5px var(--neon-green);
        }

        /* LAYOUT RESPONSIVO PRINCIPAL */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px; /* Desktop: Lado a Lado */
            flex-grow: 1;
            overflow: hidden;
        }

        /* AJUSTE PARA CELULAR (MODO APP) */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 300px; /* Gráfico em cima, Painel embaixo */
            }
            header h1 { font-size: 0.9rem; }
        }

        /* ÁREA DO GRÁFICO */
        #chart-container {
            position: relative;
            border-right: 1px solid var(--army-green);
            display: flex;
            flex-direction: column;
        }

        #chart {
            flex-grow: 1;
            width: 100%;
        }

        /* ALERTAS FLUTUANTES */
        #alert-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            animation: pulse 1s infinite;
        }

        /* PAINEL LATERAL / INFERIOR */
        .sidebar {
            background: var(--military-grey);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #000;
            border-bottom: 1px solid var(--army-green);
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 0.7rem;
            cursor: pointer;
            border-right: 1px solid var(--army-green);
        }

        .tab.active { background: var(--army-green); color: #fff; }

        .content-scroll {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.8rem;
        }

        /* PLACAR */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #000;
            border-bottom: 1px solid var(--army-green);
            font-weight: bold;
        }

        .win-text { color: var(--neon-green); }
        .loss-text { color: var(--alert-red); }

        /* LISTA DE SINAIS */
        .sig-row {
            background: rgba(0,255,65,0.05);
            margin-bottom: 5px;
            padding: 8px;
            border-left: 3px solid var(--army-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sig-row.win-border { border-left-color: var(--neon-green); background: rgba(0,255,65,0.1); }
        .sig-row.loss-border { border-left-color: var(--alert-red); background: rgba(255,0,0,0.1); }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* SCROLLBAR ESTILO ROBÔ */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--army-green); }
    </style>
</head>
<body>

<header>
    <div><span class="status-dot"></span> SISTEMA OPERACIONAL ATIVO</div>
    <div id="clock">00:00:00</div>
    <div style="color: #888;">EUR/USD <span style="color: var(--neon-green);">LIVE</span></div>
</header>

<div id="alert-overlay">
    ⚠️ ATENÇÃO: ANALISANDO MERCADO... <br> SINAL POSSÍVEL EM <span id="mins-left">10</span> MINUTOS
</div>

<div class="main-layout">
    <!-- ÁREA DO GRÁFICO -->
    <div id="chart-container">
        <div id="chart"></div>
    </div>

    <!-- PAINEL DE COMANDO -->
    <div class="sidebar">
        <div class="scoreboard">
            <div>WINS: <span id="wins" class="win-text">0</span></div>
            <div>LOSSES: <span id="losses" class="loss-text">0</span></div>
            <div>ASSERT: <span id="assert">0%</span></div>
        </div>

        <div class="tabs">
            <div class="tab active">SINAIS AGENDADOS</div>
            <div class="tab">LOG ANALÍTICO</div>
        </div>

        <div id="signal-list" class="content-scroll">
            <!-- Injetado via JS -->
        </div>

        <div id="live-log" class="content-scroll" style="display:none; color: #aaa; font-size: 0.7rem;">
            [SYSTEM]: Carregando SMA50... OK<br>
            [SYSTEM]: Carregando EMA14... OK<br>
            [SYSTEM]: Suporte em 1.08450 identificado...
        </div>
    </div>
</div>

<script>
    // Configurações do Robô
    const signals = [
        { h: 13, m: 10, dir: 'PUT', label: 'MHI 1 (Minoria)' },
        { h: 13, m: 15, dir: 'CALL', label: 'MHI 2 (Minoria)' },
        { h: 14, m: 30, dir: 'PUT', label: 'EMA14 Cruzamento' },
        { h: 15, m: 00, dir: 'CALL', label: 'Suporte H1' },
        { h: 16, m: 45, dir: 'CALL', label: 'MHI 1 (Minoria)' },
        { h: 16, m: 50, dir: 'PUT', label: 'Ciclo Probabilidade' }
    ];

    let wins = 0;
    let losses = 0;

    // Inicializar Gráfico Profissional
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { backgroundColor: '#050505', textColor: '#00ff41' },
        grid: { vertLines: { visible: false }, horzLines: { color: '#1a1a1a' } },
        timeScale: { timeVisible: true, secondsVisible: false },
    });
    const candleSeries = chart.addCandlestickSeries({
        upColor: '#00ff41', downColor: '#ff0000', borderVisible: false,
        wickUpColor: '#00ff41', wickDownColor: '#ff0000'
    });

    // Conexão Real (Simulando EUR/USD via par disponível)
    const binanceSocket = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1m');
    binanceSocket.onmessage = (e) => {
        const d = JSON.parse(e.data).k;
        candleSeries.update({
            time: d.t / 1000, open: d.o, high: d.h, low: d.l, close: d.c
        });
        checkTimeSchedules();
    };

    function checkTimeSchedules() {
        const now = new Date();
        const curH = now.getHours();
        const curM = now.getMinutes();

        document.getElementById('clock').innerText = now.toLocaleTimeString();

        signals.forEach((sig, index) => {
            const sigTime = new Date();
            sigTime.setHours(sig.h, sig.m, 0);
            
            const diff = (sigTime - now) / 60000;

            // Alerta 10 minutos antes
            if (diff <= 10 && diff > 9.5) {
                showTopAlert(Math.ceil(diff));
            } else if (diff < 0 && !sig.processed) {
                executeSignal(sig, index);
            }
        });
    }

    function showTopAlert(m) {
        const alert = document.getElementById('alert-overlay');
        document.getElementById('mins-left').innerText = m;
        alert.style.display = 'block';
        setTimeout(() => alert.style.display = 'none', 5000);
    }

    function executeSignal(sig, idx) {
        sig.processed = true;
        const row = document.getElementById(`sig-${idx}`);
        
        // Simulação de Gale 1 Realista
        setTimeout(() => {
            const isWin = Math.random() > 0.4;
            if(isWin) {
                wins++;
                row.className = 'sig-row win-border';
                row.innerHTML += ' <b>WIN</b>';
            } else {
                // Tenta Gale 1
                setTimeout(() => {
                    if(Math.random() > 0.5) {
                        wins++;
                        row.className = 'sig-row win-border';
                        row.innerHTML += ' <b>GALE 1</b>';
                    } else {
                        losses++;
                        row.className = 'sig-row loss-border';
                        row.innerHTML += ' <b>LOSS</b>';
                    }
                    updateScore();
                }, 2000);
            }
            updateScore();
        }, 3000);
    }

    function updateScore() {
        document.getElementById('wins').innerText = wins;
        document.getElementById('losses').innerText = losses;
        const total = wins + losses;
        const perc = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;
        document.getElementById('assert').innerText = perc + '%';
    }

    // Renderizar Lista Inicial
    const container = document.getElementById('signal-list');
    signals.forEach((s, i) => {
        container.innerHTML += `
            <div class="sig-row" id="sig-${i}">
                <span>${s.h}:${s.m.toString().padStart(2,'0')}</span>
                <span style="color:${s.dir === 'CALL' ? 'var(--neon-green)' : 'var(--alert-red)'}">${s.dir}</span>
                <span style="font-size:0.6rem; opacity:0.7">${s.label}</span>
            </div>
        `;
    });

    // Ajuste Automático do Gráfico ao Redimensionar
    window.addEventListener('resize', () => {
        chart.applyOptions({ 
            width: document.getElementById('chart').clientWidth,
            height: document.getElementById('chart').clientHeight 
        });
    });

</script>
</body>
</html>
