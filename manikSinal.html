<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA TÁTICO INVISÍVEL | EUR/USD</title>
    <style>
        :root {
            --matrix-green: #00ff41;
            --dark-bg: #020202;
            --alert-red: #ff0000;
            --army-dim: #1b3022;
        }

        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: var(--dark-bg);
            color: var(--matrix-green);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            z-index: -1;
        }

        header {
            padding: 15px;
            background: #000;
            border-bottom: 2px solid var(--matrix-green);
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        /* CONTAINER CENTRAL DE ANÁLISE */
        .main-terminal {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .radar-box {
            width: 250px;
            height: 250px;
            border: 2px solid var(--matrix-green);
            border-radius: 50%;
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px var(--army-dim);
        }

        .radar-line {
            width: 50%;
            height: 2px;
            background: var(--matrix-green);
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: left;
            animation: radar-sweep 4s linear infinite;
        }

        @keyframes radar-sweep {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* NOTIFICAÇÃO 10 MINUTOS */
        #notification-10min {
            position: fixed;
            top: 20px;
            right: -400px;
            width: 300px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            padding: 15px;
            border-left: 5px solid #fff;
            transition: right 0.5s ease;
            z-index: 100;
        }

        /* CARD DE ENTRADA 3 MINUTOS */
        #entry-card {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 90%;
            max-width: 450px;
            background: rgba(0, 20, 0, 0.95);
            border: 3px solid var(--matrix-green);
            padding: 25px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 101;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.4);
        }

        #entry-card.active { transform: translateX(-50%) scale(1); }

        .btn-dir {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 15px;
            font-weight: bold;
            border: 1px solid #fff;
        }

        .put { background: var(--alert-red); color: white; }
        .call { background: var(--matrix-green); color: black; }

        /* LOG DE SISTEMA */
        #sys-logs {
            width: 100%;
            max-width: 600px;
            height: 150px;
            font-size: 0.7rem;
            color: #555;
            overflow: hidden;
            border-top: 1px solid var(--army-dim);
            padding-top: 10px;
        }

        .glitch-text { animation: flash 0.2s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<!-- Alerta Lateral (10 min) -->
<div id="notification-10min">
    <strong>[!] ALERTA TÁTICO</strong><br>
    Análise iniciada. Sinal detectado em 10 minutos.
</div>

<!-- Card de Sinal (3 min) -->
<div id="entry-card">
    <div style="font-size: 0.8rem; opacity: 0.7;">CONFIRMAÇÃO DE ENTRADA</div>
    <h2 id="card-pair">EUR/USD - M1</h2>
    <div id="card-info" style="font-size: 1.2rem; margin: 10px 0;"></div>
    <div id="card-btn" class="btn-dir">AGUARDANDO...</div>
    <div style="margin-top: 15px; font-size: 0.7rem;">ESTRATÉGIA: <span id="card-desc">---</span></div>
</div>

<header>
    <div>[CYBER_BOT_V4] STATUS: <span class="glitch-text" style="color:var(--matrix-green)">MONITORANDO</span></div>
    <div id="live-clock">00:00:00</div>
</header>

<div class="main-terminal">
    <div class="radar-box">
        <div class="radar-line"></div>
        <div style="z-index: 2; font-size: 0.8rem;">SCANNING...</div>
    </div>

    <div id="status-text">AGUARDANDO OPORTUNIDADE NO MERCADO...</div>
    
    <div id="sys-logs">
        <!-- Logs simulados -->
    </div>
</div>

<script>
    // --- LISTA DE SINAIS (OCULTA) ---
    const signals = [
        { time: "19:15", dir: "PUT", desc: "MHI 1 (Minoria)" },
{ time: "19:20", dir: "CALL", desc: "MHI 2 (Minoria)" },
{ time: "19:25", dir: "PUT", desc: "Fluxo (Abaixo da EMA 14)" },
{ time: "19:30", dir: "CALL", desc: "Virada de Ciclo (Algoritmo)" },
{ time: "19:35", dir: "PUT", desc: "MHI 1 (Minoria)" },
{ time: "19:40", dir: "CALL", desc: "Ciclo de Repetição" },
{ time: "19:45", dir: "PUT", desc: "Reversão de Topo" },
{ time: "19:50", dir: "CALL", desc: "MHI 2 (Minoria)" }
    ];

    // --- ANIMAÇÃO MATRIX ---
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/14)).fill(1);
    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
        drops.forEach((y, i) => {
            const text = String.fromCharCode(Math.random() * 128);
            ctx.fillText(text, i * 14, y * 14);
            if (y * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(drawMatrix, 50);

    // --- LÓGICA DE TEMPO E NOTIFICAÇÃO ---
    function update() {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString();

        signals.forEach(sig => {
            const [h, m] = sig.time.split(':').map(Number);
            const target = new Date(); target.setHours(h, m, 0);
            const diffMin = (target - now) / 60000;

            // 1. Notificação 10 min antes (Aparece e some após 10s)
            if (diffMin <= 10 && diffMin > 9.8) {
                const note = document.getElementById('notification-10min');
                note.style.right = '20px';
                addLog(`[!] Alerta: Sinal detectado em ${sig.time}`);
                setTimeout(() => { note.style.right = '-400px'; }, 10000);
            }

            // 2. Card de Entrada 3 min antes
            if (diffMin <= 3 && diffMin > 0) {
                const card = document.getElementById('entry-card');
                card.classList.add('active');
                document.getElementById('card-info').innerText = `${sig.dir} ÀS ${sig.time}`;
                document.getElementById('card-desc').innerText = sig.desc;
                const btn = document.getElementById('card-btn');
                btn.innerText = `ENTRAR AGORA: ${sig.dir}`;
                btn.className = `btn-dir ${sig.dir.toLowerCase()}`;
                
                document.getElementById('status-text').innerText = `ALVO LOCALIZADO: PREPARAR PARA ${sig.dir}`;
            } 
            
            // 3. Limpar após o horário do sinal
            if (diffMin < -1) {
                document.getElementById('entry-card').classList.remove('active');
                document.getElementById('status-text').innerText = "AGUARDANDO OPORTUNIDADE NO MERCADO...";
            }
        });
    }

    function addLog(msg) {
        const logBox = document.getElementById('sys-logs');
        logBox.innerHTML = `<div>> ${msg}</div>` + logBox.innerHTML;
    }

    // Simulação de atividade hacker
    setInterval(() => {
        const actions = ["Analisando Médias...", "Fractal verificado", "SMA50 Estável", "EUR/USD Fluxo OK"];
        addLog(actions[Math.floor(Math.random() * actions.length)]);
    }, 4000);

    setInterval(update, 1000);
</script>
</body>
</html>
