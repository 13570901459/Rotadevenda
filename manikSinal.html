<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE ANÁLISE HACK-TRADE v4.0</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-red: #ff3e3e;
            --bg-dark: #050505;
            --panel-bg: rgba(15, 15, 15, 0.95);
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* Layout Principal */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            grid-template-rows: 1fr 250px;
            height: 100vh;
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
        }

        /* Área do Gráfico */
        .chart-area {
            grid-column: 1;
            grid-row: 1;
            background: var(--panel-bg);
            border: 1px solid #222;
            position: relative;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* Sidebar de Estatísticas */
        .sidebar {
            grid-column: 2;
            grid-row: 1 / 3;
            background: var(--panel-bg);
            border: 1px solid #222;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Terminal de Log */
        .terminal {
            grid-column: 1;
            grid-row: 2;
            background: #000;
            border: 1px solid var(--neon-green);
            padding: 10px;
            font-size: 11px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.2);
        }

        /* Elementos Visuais Dinâmicos */
        .stat-box {
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
        }

        .value {
            font-size: 24px;
            display: block;
            margin-top: 5px;
            text-shadow: 0 0 5px var(--neon-green);
        }

        .header-info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            border-left: 3px solid var(--neon-green);
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: absolute;
            top: 0;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        .signal-alert {
            color: white;
            background: var(--neon-red);
            padding: 2px 5px;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="chart-area">
        <div class="header-info">
            ALGO_BOT_CONNECTED // ASSET: BTC/USDT // M1 ANALYSIS<br>
            <span id="live-price">65432.10</span> USD
        </div>
        <div class="scan-line"></div>
        <canvas id="tradingChart"></canvas>
    </div>

    <div class="terminal" id="log-output">
        <p>> INITIALIZING ROBOT ANALYSIS...</p>
    </div>

    <div class="sidebar">
        <div class="stat-box">
            LABEL: PROBABILIDADE WIN
            <span class="value" id="win-rate">87.5%</span>
        </div>
        <div class="stat-box">
            SMA(50) / EMA(14) DELTA
            <span class="value" id="delta-val">0.00042</span>
        </div>
        <div class="stat-box">
            FORÇA DO MERCADO
            <div id="power-bar" style="width: 100%; height: 10px; background: #222; margin-top: 5px;">
                <div id="power-fill" style="width: 70%; height: 100%; background: var(--neon-green);"></div>
            </div>
        </div>
        <div class="stat-box" style="color: #888; font-size: 10px;">
            SISTEMA HACKER ATIVO: <span id="cpu-load">12%</span> CPU LOAD<br>
            ENCRYPTION: AES-256<br>
            STATUS: ANALYZING CANDLE PATTERNS...
        </div>
        <div id="signal-display"></div>
    </div>
</div>

<script>
    const logContainer = document.getElementById('log-output');
    const canvas = document.getElementById('tradingChart');
    const ctx = canvas.getContext('2d');

    // Ajustar tamanho do canvas
    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Simulação de Logs Profissionais
    const logs = [
        "[INFO] Cruzamento de médias detectado: EMA(14) sobre SMA(50)",
        "[ALERTA] Volume spike em 0.05s - Possível manipulação baleia",
        "[ANALYSIS] RSI em 68.4 - Aproximando zona de exaustão",
        "[ROBOT] Calculando Fibonacci Retracement: Nível 0.618 atingido",
        "[SYSTEM] Ordem de compra simulada enviada para pool de liquidez",
        "[HACK] Bypass firewall Quotex/Binance... Dados recebidos",
        "[DATA] Candle Pattern: Engolfo de Alta confirmado",
        "[INFO] Latência de rede: 14ms - Estável"
    ];

    function addLog() {
        const p = document.createElement('p');
        p.style.margin = "2px 0";
        p.innerHTML = `> ${new Date().toLocaleTimeString()} ${logs[Math.floor(Math.random() * logs.length)]}`;
        logContainer.appendChild(p);
        if (logContainer.childNodes.length > 12) logContainer.removeChild(logContainer.firstChild);
    }

    // Gráfico de Velas (Candlesticks Animados)
    let candles = [];
    function generateCandles() {
        for(let i=0; i<50; i++) {
            candles.push({
                x: i * 20,
                h: Math.random() * 100 + 50,
                y: Math.random() * 150 + 100,
                type: Math.random() > 0.5 ? 'up' : 'down'
            });
        }
    }

    function drawChart() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#222';
        // Desenha grade
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        }

        // Desenha Velas
        candles.forEach((c, index) => {
            ctx.fillStyle = c.type === 'up' ? '#00ff41' : '#ff3e3e';
            ctx.fillRect(canvas.width - (index * 25), c.y, 15, c.h);
            // Pavio
            ctx.beginPath();
            ctx.moveTo(canvas.width - (index * 25) + 7.5, c.y - 10);
            ctx.lineTo(canvas.width - (index * 25) + 7.5, c.y + c.h + 10);
            ctx.stroke();
            
            // Movimentação das velas
            c.y += (Math.random() - 0.5) * 2;
        });

        requestAnimationFrame(drawChart);
    }

    // Atualização de Números Dinâmicos
    setInterval(() => {
        addLog();
        document.getElementById('live-price').innerText = (65000 + Math.random() * 500).toFixed(2);
        document.getElementById('win-rate').innerText = (85 + Math.random() * 10).toFixed(1) + "%";
        document.getElementById('cpu-load').innerText = Math.floor(Math.random() * 40 + 10) + "%";
        document.getElementById('power-fill').style.width = Math.random() * 100 + "%";
        
        // Alerta de Sinal Aleatório
        if(Math.random() > 0.9) {
            const side = Math.random() > 0.5 ? "CALL (COMPRA)" : "PUT (VENDA)";
            document.getElementById('signal-display').innerHTML = `<div class="signal-alert">SINAL DETECTADO: ${side}</div>`;
            setTimeout(() => document.getElementById('signal-display').innerHTML = "", 3000);
        }
    }, 1000);

    generateCandles();
    drawChart();
</script>

</body>
</html>
