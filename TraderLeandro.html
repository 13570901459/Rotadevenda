<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOT TRADING TERMINAL | v2.0</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --loss-red: #ff3131;
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--dark-bg); color: white; padding: 15px; }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--neon-green); padding-bottom: 10px; }
        .header h1 { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-size: 1.4rem; }

        .setup-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .setup-group label { display: block; font-size: 0.7rem; color: var(--neon-green); margin-bottom: 5px; }
        .setup-group input { 
            width: 100%; background: #000; border: 1px solid var(--neon-green); 
            color: white; padding: 8px; border-radius: 3px; 
        }

        .main-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }

        /* Módulo Sinais */
        .signals-module { background: var(--card-bg); padding: 15px; border: 1px solid var(--border); border-radius: 5px; }
        .signals-module h2 { font-size: 1rem; color: var(--neon-green); margin-bottom: 10px; border-bottom: 1px solid var(--border); }
        #signal-input { width: 100%; height: 100px; background: #000; color: var(--neon-green); border: 1px solid var(--border); padding: 10px; margin-bottom: 10px; }
        .signal-list { list-style: none; max-height: 300px; overflow-y: auto; }
        .signal-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #222; font-size: 0.8rem; }
        .btn-group { display: flex; gap: 5px; }
        .btn-s { padding: 3px 6px; cursor: pointer; border: none; border-radius: 2px; font-size: 0.7rem; }
        .btn-win { background: var(--neon-green); color: black; }
        .btn-gale { background: orange; color: black; }
        .btn-loss { background: var(--loss-red); color: white; }

        /* Tabela Gerenciamento */
        .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 5px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { background: #111; color: var(--neon-green); padding: 12px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }
        .check-btn { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 4px 8px; cursor: pointer; }
        .check-btn.ok { background: var(--neon-green); color: black; font-weight: bold; }

        @media (max-width: 850px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SISTEMA DE CAPITALIZAÇÃO HORTIMANIK v2.0</h1>
    </div>

    <div class="setup-bar">
        <div class="setup-group">
            <label>BANCA INICIAL (R$)</label>
            <input type="number" id="banca-in" value="50.00" onchange="init()">
        </div>
        <div class="setup-group">
            <label>META DIÁRIA (%)</label>
            <input type="number" id="meta-perc" value="13" onchange="init()">
        </div>
        <div class="setup-group">
            <label>PAYOUT MÉDIO (%)</label>
            <input type="number" id="payout-val" value="80" onchange="init()">
        </div>
    </div>

    <div class="main-grid">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>DIA</th>
                        <th>BANCA</th>
                        <th>META</th>
                        <th>VALOR ENTRADA*</th>
                        <th>DATA</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="finance-body"></tbody>
            </table>
            <p style="font-size: 0.6rem; padding: 10px; color: #888;">*Valor de entrada calculado para bater a meta com 1 Win (80% Payout).</p>
        </div>

        <div class="signals-module">
            <h2>LISTA DE SINAIS DO DIA</h2>
            <textarea id="signal-input" placeholder="Cole sua lista aqui... Ex: EURUSD;14:30;CALL"></textarea>
            <button onclick="processSignals()" class="btn-s btn-win" style="width: 100%; margin-bottom: 15px; padding: 8px;">CARREGAR LISTA</button>
            <ul id="signal-list" class="signal-list"></ul>
        </div>
    </div>

    <script>
        // Local Storage Management
        const storageKey = 'robot_trading_data_v2';
        let state = JSON.parse(localStorage.getItem(storageKey)) || { checks: {}, signals: [], dates: {} };

        function init() {
            const bancaIn = parseFloat(document.getElementById('banca-in').value);
            const metaPerc = parseFloat(document.getElementById('meta-perc').value) / 100;
            const payout = parseFloat(document.getElementById('payout-val').value) / 100;
            const tbody = document.getElementById('finance-body');
            
            tbody.innerHTML = '';
            let saldo = bancaIn;

            for (let i = 1; i <= 90; i++) {
                let valorMeta = saldo * metaPerc;
                // Cálculo da entrada: Valor da Meta / Payout
                let valorEntrada = valorMeta / payout;
                let isChecked = state.checks[i] || false;
                let dataValue = state.dates[i] || '';

                const tr = document.createElement('tr');
                if(isChecked) tr.style.background = 'rgba(0, 255, 65, 0.05)';

                tr.innerHTML = `
                    <td>#${i}</td>
                    <td>R$ ${saldo.toFixed(2)}</td>
                    <td style="color:var(--neon-green)">R$ ${valorMeta.toFixed(2)}</td>
                    <td style="color:cyan">R$ ${valorEntrada.toFixed(2)}</td>
                    <td><input type="date" value="${dataValue}" onchange="saveDate(${i}, this.value)" style="background:#000; border:1px solid #444; color:white; font-size:0.7rem;"></td>
                    <td>
                        <button class="check-btn ${isChecked ? 'ok' : ''}" onclick="toggleCheck(${i})">
                            ${isChecked ? 'CONCLUÍDO' : 'PENDENTE'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
                saldo += valorMeta;
            }
            saveState();
        }

        function toggleCheck(dia) {
            state.checks[dia] = !state.checks[dia];
            init();
        }

        function saveDate(dia, val) {
            state.dates[dia] = val;
            saveState();
        }

        function processSignals() {
            const text = document.getElementById('signal-input').value;
            const lines = text.split('\n');
            state.signals = lines.filter(l => l.trim() !== '').map(l => ({ text: l, result: null }));
            renderSignals();
        }

        function setSignalResult(index, res) {
            state.signals[index].result = res;
            renderSignals();
        }

        function renderSignals() {
            const list = document.getElementById('signal-list');
            list.innerHTML = '';
            state.signals.forEach((sig, i) => {
                const li = document.createElement('li');
                li.className = 'signal-item';
                let color = sig.result === 'WIN' ? 'var(--neon-green)' : sig.result === 'LOSS' ? 'var(--loss-red)' : 'white';
                
                li.innerHTML = `
                    <span style="color:${color}">${sig.text} [${sig.result || '?'}]</span>
                    <div class="btn-group">
                        <button class="btn-s btn-win" onclick="setSignalResult(${i}, 'WIN')">W</button>
                        <button class="btn-s btn-gale" onclick="setSignalResult(${i}, 'G1')">G1</button>
                        <button class="btn-s btn-loss" onclick="setSignalResult(${i}, 'LOSS')">L</button>
                    </div>
                `;
                list.appendChild(li);
            });
            saveState();
        }

        function saveState() {
            localStorage.setItem(storageKey, JSON.stringify(state));
        }

        // Carregar lista de sinais salva se houver
        window.onload = () => {
            init();
            renderSignals();
        };
    </script>
</body>
</html>
