<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <!-- Favicon -->
    <link rel="shortcut icon" href="sua-foto.png" type="image/x-icon">
  <title>Formulário | Consórcio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-center font-sans flex flex-col min-h-screen">

  <!-- 🔴 TOPO VERMELHO COM LOGO -->
  <header class="w-full bg-red-600">
    <div class="max-w-screen-lg mx-auto">
      <img src="" alt="" class="h-10 mx-auto object-contain" />
    </div>
  </header>

  <!-- ░░░ FORMULÁRIO ░░░ -->
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow">

    <!-- ✅ BOTÃO DE COMPARTILHAR WHATSAPP -->
    <button onclick="compartilharWhatsApp()" type="button"
      class="mb-4 w-full bg-[#25D366] hover:bg-[#1DA851] text-white font-bold py-3 rounded flex items-center justify-center gap-2">
      <!-- Ícone de compartilhar -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 24 24">
        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.01 3.01 0 000-1.4l7.02-4.11A3 3 0 0018 7.91 3 3 0 1015 5a3.01 3.01 0 00.04.52L8.02 9.63a3 3 0 100 4.73l7.02 4.11c-.03.16-.04.33-.04.5a3 3 0 103-2.89z"/>
      </svg>
      Compartilhar via WhatsApp
    </button>

    <h2 class="text-2xl font-bold mb-4 text-red-600">Formulário | Consórcio</h2>

    <form id="formulario">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">

        <!-- Nome -->
        <div>
          <label for="nome" class="block text-sm font-semibold mb-1">Nome completo*</label>
          <input type="text" id="nome" name="nome" class="border p-2 rounded w-full" placeholder="Nome completo" required>
        </div>
        <!-- Estado de Nascimento -->
        <div>
          <label for="Estado de Nascimento" class="block text-sm font-semibold mb-1">Estado de Nascimento*</label>
          <input type="text" id="Estado de Nascimento" name="Estado de Nascimento" class="border p-2 rounded w-full" placeholder="Nome compleEstado de Nascimento" required>
        </div>
        <!-- Nome da Mãe -->
        <div>
          <label for="Nome da Mãe" class="block text-sm font-semibold mb-1">Nome da Mãe*</label>
          <input type="text" id="Nome da Mãe" name="Nome da Mãe" class="border p-2 rounded w-full" placeholder="Nome da Mãe" required>
        </div>
        <!-- Nome da Pai -->
        <div>
          <label for="Nome da Pai" class="block text-sm font-semibold mb-1">Nome da Pai*</label>
          <input type="text" id="Nome da Pai" name="Nome da Pai" class="border p-2 rounded w-full" placeholder="Nome da Pai" required>
        </div>
        <!-- Nacionalidade -->
        <div>
          <label for="Nacionalidade" class="block text-sm font-semibold mb-1">Nacionalidade*</label>
          <select id="Nacionalidade" name="Nacionalidade" class="border p-2 rounded w-full" required>
            <option value="">Selecione</option>
            <option value="Brasileira">Brasileira</option>
            <option value="União Estável">Estrangeira</option>
        
          </select>
        </div>
 <!-- ESTADO CIVIL-->
        <div>
          <label for="Estado Civil" class="block text-sm font-semibold mb-1">Estado Civil*</label>
          <select id="Estado Civil" name="Estado Civil" class="border p-2 rounded w-full" required>
            <option value="">Selecione</option>
            <option value="Solteiro(a)">Solteiro(a)</option>
            <option value="União Estável">União Estável</option>
            <option value="Casado(a)">Casado(a)</option>
            <option value="Divorciado(a)">Divorciado(a)</option>
          </select>
        </div>
        <!-- CPF -->
        <div>
          <label for="cpf" class="block text-sm font-semibold mb-1">CPF*</label>
          <input type="text" id="cpf" name="cpf" class="border p-2 rounded w-full" placeholder="CPF" required>
        </div>

        <!-- Data de nascimento -->
        <div>
          <label for="nascimento" class="block text-sm font-semibold mb-1">Data de nascimento*</label>
          <input type="date" id="nascimento" name="nascimento" class="border p-2 rounded w-full" required>
        </div>
        
        <!-- Telefone -->
        <div>
          <label for="telefone" class="block text-sm font-semibold mb-1">Telefone para contato*</label>
          <input type="tel" id="telefone" name="telefone" class="border p-2 rounded w-full" placeholder="(DDD) 9XXXX‑XXXX" required>
        </div>

        <!-- Segundo contato -->
        <div>
          <label for="segundo_contato" class="block text-sm font-semibold mb-1">Segundo contato</label>
          <input type="tel" id="segundo_contato" name="segundo_contato" class="border p-2 rounded w-full" placeholder="(DDD) 9XXXX‑XXXX">
        </div>

        <!-- Dono do segundo contato -->
        <div>
          <label for="dono_segundo" class="block text-sm font-semibold mb-1">De quem é o segundo contato?</label>
          <input type="text" id="dono_segundo" name="dono_segundo" class="border p-2 rounded w-full" placeholder="Parente, amigo...">
        </div>

        <!-- E‑mail -->
        <div>
          <label for="email" class="block text-sm font-semibold mb-1">E-mail*</label>
          <input type="email" id="email" name="email" class="border p-2 rounded w-full" placeholder="email@exemplo.com" required>
        </div>

        <!-- Confirmação de e‑mail -->
        <div>
          <label for="email_confirm" class="block text-sm font-semibold mb-1">Confirmar e-mail*</label>
          <input type="email" id="email_confirm" class="border p-2 rounded w-full" placeholder="Repita o e‑mail" required>
        </div>

        <!-- Tipo de documento -->
        <div>
          <label for="tipo_documento" class="block text-sm font-semibold mb-1">Tipo de documento*</label>
          <select id="tipo_documento" name="tipo_documento" class="border p-2 rounded w-full" required>
            <option value="">Selecione</option>
            <option value="RG">RG</option>
            <option value="CNH">CNH</option>
          </select>
        </div>

        <!-- Número do documento -->
        <div>
          <label for="Número do documento" class="block text-sm font-semibold mb-1">Número do documento*</label>
          <input type="text" id="Número do documento" name="Número do documento" class="border p-2 rounded w-full" placeholder="12345678‑X" required>
        </div>

        <!-- Órgão expedidor -->
        <div>
          <label for="Órgão expedidor" class="block text-sm font-semibold mb-1">Órgão expedidor</label>
          <input type="text" id="Órgão expedidor" name="Órgão expedidor" class="border p-2 rounded w-full" placeholder="SSP, DETRAN...">
        </div>

        <!-- Data de emissão -->
        <div>
          <label for="Data de emissão" class="block text-sm font-semibold mb-1">Data de emissão</label>
          <input type="date" id="Data de emissão" name="Data de emissão" class="border p-2 rounded w-full">
        </div>

        <!-- Renda Mensal -->
        <div>
          <label for="Renda Mensal" class="block text-sm font-semibold mb-1">Renda Mensal</label>
          <input type="text" id="Renda Mensal" name="Renda Mensal" class="border p-2 rounded w-full" placeholder="R$">
        </div>

        <!-- Profissão -->
        <div>
          <label for="Profissão" class="block text-sm font-semibold mb-1">Profissão?</label>
          <input type="text" id="Profissão" name="Profissão" class="border p-2 rounded w-full">
        </div>

        <!-- Cidade -->
        <div>
          <label for="Cidade" class="block text-sm font-semibold mb-1">Cidade</label>
          <input type="text" id="Cidade" name="cidade" class="border p-2 rounded w-full">
        </div>

        <!-- Bairro -->
        <div>
          <label for="Bairro" class="block text-sm font-semibold mb-1">Bairro</label>
          <input type="text" id="Bairro" name="Bairro" class="border p-2 rounded w-full">
        </div>
        <!-- Rua -->
        <div>
          <label for="Rua" class="block text-sm font-semibold mb-1">Rua</label>
          <input type="text" id="Rua" name="Rua" class="border p-2 rounded w-full">
        </div>

        <!-- Número -->
        <div>
          <label for="Número" class="block text-sm font-semibold mb-1">Número</label>
          <input type="text" id="Número" name="Número" class="border p-2 rounded w-full">
        </div>
        <!-- Cep -->
        <div>
          <label for="Cep" class="block text-sm font-semibold mb-1">Cep</label>
          <input type="text" id="Cep" name="Cep" class="border p-2 rounded w-full">
        </div>

        <!-- Estado -->
        <div>
          <label for="Estado" class="block text-sm font-semibold mb-1">Estado</label>
          <input type="text" id="Estado" name="Estado" class="border p-2 rounded w-full">
        </div>

        <!-- Ponto de referência -->
        <div class="md:col-span-2">
          <label for="Ponto de referência" class="block text-sm font-semibold mb-1">Ponto de referência</label>
          <input type="text" id="Ponto de referência" name="Ponto de referência" class="border p-2 rounded w-full">
        </div>

      </div>

      <button type="button"
              onclick="enviarWhatsApp()"
              class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded">
        Enviar para o WhatsApp
      </button>
    </form>
  </div>

  <!-- ░░░ SCRIPT DE ENVIO ░░░ -->
  <script>
    function enviarWhatsApp() {
      const email = document.getElementById("email").value;
      const confirmEmail = document.getElementById("email_confirm").value;

      if (email !== confirmEmail) {
        alert("Os e-mails não coincidem. Verifique e tente novamente.");
        return;
      }

      const dados = new FormData(document.getElementById("formulario"));
      let mensagem = "*Formulário de Cadastro:*\n\n";

      dados.forEach((valor, chave) => {
        mensagem += `*${chave.replaceAll("_", " ")}:* ${valor}\n`;
      });

      const numero = "5581999117929"; // Seu número com DDI e DDD
      const link = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;
      window.open(link, "_blank");
    }

    function compartilharWhatsApp() {
      const url = window.location.href;
      const mensagem = encodeURIComponent("Acabei de te enviar Formulário de Consórcio: " + url);
      const link = "https://wa.me/?text=" + mensagem;
      window.open(link, "_blank");
    }
  </script>

  <!-- 🔴 RODAPÉ -->
  <footer class="w-full bg-red-600 text-white text-center py-6">
    <p class="text-sm sm:text-base font-medium">
      © Todos os direitos reservados<br>
      <strong>Leandro Silva</strong>
    </p>
  </footer>

</body>
</html>
