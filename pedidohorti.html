    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #e9ecef;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding-bottom: 100px;
        }

        header {
            background-color: var(--surface);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .brand h1 {
            font-size: 1.4rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 500px;
        }

        .search-container .material-icons-round {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--background);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 992px) {
            main {
                grid-template-columns: 260px 1fr;
            }
        }

        /* Categorias Lateral / Scroll Mobile */
        .categories-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            position: sticky;
            top: 140px;
            height: max-content;
        }

        @media (min-width: 992px) {
            .categories-nav {
                flex-direction: column;
                overflow-x: visible;
                top: 100px;
            }
        }

        .category-btn {
            white-space: nowrap;
            padding: 0.6rem 1rem;
            border: none;
            background-color: var(--surface);
            color: var(--text-muted);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary);
            color: var(--surface);
        }

        /* Seções e Listagem de Itens */
        .products-section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.15rem;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .product-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border);
        }

        .product-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .product-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Controles de Quantidade */
        .quantity-control {
            display: flex;
            align-items: center;
            background-color: var(--background);
            border-radius: 20px;
            padding: 2px;
            border: 1px solid var(--border);
        }

        .qty-btn {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--primary);
            border-radius: 50%;
        }

        .qty-btn:hover {
            background-color: var(--primary-light);
        }

        .qty-value {
            width: 32px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Barra Inferior Fixa */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--surface);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            padding: 1rem;
            z-index: 20;
        }

        .cart-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-view-cart {
            background-color: var(--primary);
            color: var(--surface);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        /* Modal / Gaveta Lateral da Lista de Separados */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: var(--surface);
            box-shadow: var(--shadow-lg);
            z-index: 30;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-close-cart {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cart-modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background-color: var(--background);
        }

        .btn-submit-order {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 25;
            display: none;
        }

        .modal-overlay.open {
            display: block;
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            margin: auto;
        }
    </style>
</head>

            // Sopas Prontas
            { id: "23",   nome: "Sopa Brejeira 400G", und: "UN", categoria: "sopas" },
            { id: "25",   nome: "Sopa Canja de Galinha 400G", und: "UN", categoria: "sopas" },
            { id: "28",   nome: "Sopa de Caldo Verde 400G", und: "UN", categoria: "sopas" },
            { id: "31",   nome: "Sopa de Carne 400G", und: "UN", categoria: "sopas" },
            { id: "33",   nome: "Sopa Verdão Brejeira e Caldo", und: "CX", categoria: "sopas" },
            { id: "36",   nome: "Sopa Verdão Canja/Carne", und: "CX", categoria: "sopas" }
        ];

        const CATEGORIAS_NOMES = {
            hidroponicos: "Hidropônicos",
            frutas: "Frutas",
            verduras: "Verduras e Legumes",
            mercearia: "Massas e Gomas",
            sopas: "Sopas Prontas"
        };

        let carrinho = {};

        // Mapeamento dos elementos DOM
        const catalogContainer = document.getElementById('catalogContainer');
        const searchInput = document.getElementById('searchInput');
        const categoriesNav = document.getElementById('categoriesNav');
        const barQty = document.getElementById('barQty');
        const cartModal = document.getElementById('cartModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnViewCart = document.getElementById('btnViewCart');
        const btnCloseCart = document.getElementById('btnCloseCart');
        const cartItemsList = document.getElementById('cartItemsList');
        const btnSubmitOrder = document.getElementById('btnSubmitOrder');

        // Renderiza o catálogo de itens
        function renderCatalog(filterText = "", filterCategory = "all") {
            catalogContainer.innerHTML = "";
            const categoriasParaRenderizar = filterCategory === "all" ? Object.keys(CATEGORIAS_NOMES) : [filterCategory];

            categoriasParaRenderizar.forEach(catKey => {
                const produtosDaCategoria = PRODUTOS_DATA.filter(p => {
                    const matchCategory = p.categoria === catKey;
                    const matchSearch = p.nome.toLowerCase().includes(filterText.toLowerCase()) || p.id.includes(filterText);
                    return matchCategory && matchSearch;
                });

                if (produtosDaCategoria.length > 0) {
                    const section = document.createElement('section');
                    section.className = 'products-section';

                    const title = document.createElement('h2');
                    title.className = 'section-title';
                    title.innerHTML = `${CATEGORIAS_NOMES[catKey]} <span style='font-size:0.85rem; color:var(--text-muted); font-weight:normal;'>(${produtosDaCategoria.length})</span>`;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'products-grid';

                    produtosDaCategoria.forEach(prod => {
                        const qtdNoCarrinho = carrinho[prod.id] ? carrinho[prod.id].qtd : 0;
                        
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-info">
                                <h3>${prod.nome}</h3>
                                <div class="product-meta">Cód: ${prod.id} • ${prod.und}</div>
                            </div>
                            <div class="quantity-control">
                                <button class="qty-btn" onclick="alterarQuantidade('${prod.id}', -1)">
                                    <span class="material-icons-round">remove</span>
                                </button>
                                <span class="qty-value" id="qty-catalog-${prod.id}">${qtdNoCarrinho}</span>
                                <button class="qty-btn" onclick="alterarQuantidade('${prod.id}', 1)">
                                    <span class="material-icons-round">add</span>
                                </button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    catalogContainer.appendChild(section);
                }
            });

            if(catalogContainer.innerHTML === "") {
                catalogContainer.innerHTML = "<p class='empty-cart-msg'>Nenhum produto encontrado.</p>";
            }
        }

        // Altera quantidades ou remove se desistir (chegar a 0)
        window.alterarQuantidade = function(id, delta) {
            const produto = PRODUTOS_DATA.find(p => p.id === id);
            if (!produto) return;

            if (!carrinho[id]) {
                if (delta > 0) {
                    carrinho[id] = { ...produto, qtd: delta };
                }
            } else {
                carrinho[id].qtd += delta;
                if (carrinho[id].qtd <= 0) {
                    delete carrinho[id];
                }
            }

            // Sincroniza o número na tela principal
            const elCatalog = document.getElementById(`qty-catalog-${id}`);
            if (elCatalog) elCatalog.innerText = carrinho[id] ? carrinho[id].qtd : 0;

            atualizarContadorBarra();
            renderCarrinhoModal();
        }

        function atualizarContadorBarra() {
            let totalItens = 0;
            Object.values(carrinho).forEach(item => {
                totalItens += item.qtd;
            });
            barQty.innerText = totalItens;
        }

        // Renderiza itens na gaveta lateral
        function renderCarrinhoModal() {
            cartItemsList.innerHTML = "";
            const itens = Object.values(carrinho);

            if (itens.length === 0) {
                cartItemsList.innerHTML = "<p class='empty-cart-msg'><span class='material-icons-round' style='font-size:2.5rem; display:block; margin-bottom:0.5rem;'>playlist_add</span>Sua lista está vazia.</p>";
                return;
            }

            itens.forEach(item => {
                const itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <div class="cart-item-details">
                        <h4>${item.nome}</h4>
                        <div style="font-size:0.8rem; color:var(--text-muted)">Cód: ${item.id}</div>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="alterarQuantidade('${item.id}', -1)">
                            <span class="material-icons-round">remove</span>
                        </button>
                        <span class="qty-value">${item.qtd}</span>
                        <button class="qty-btn" onclick="alterarQuantidade('${item.id}', 1)">
                            <span class="material-icons-round">add</span>
                        </button>
                    </div>
                `;
                cartItemsList.appendChild(itemRow);
            });
        }

        function alternarModal(abrir) {
            if (abrir) {
                cartModal.classList.add('open');
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            } else {
                cartModal.classList.remove('open');
                modalOverlay.classList.remove('open');
                document.body.style.overflow = 'auto';
            }
        }

        // Monitoramento de filtros por Categoria
        categoriesNav.addEventListener('click', (e) => {
            const btn = e.target.closest('.category-btn');
            if (!btn) return;

            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderCatalog(searchInput.value, btn.dataset.category);
        });

        // Monitoramento da caixa de busca
        searchInput.addEventListener('input', (e) => {
            const categoriaAtiva = document.querySelector('.category-btn.active').dataset.category;
            renderCatalog(e.target.value, categoriaAtiva);
        });

        btnViewCart.addEventListener('click', () => alternarModal(true));
        btnCloseCart.addEventListener('click', () => alternarModal(false));
        modalOverlay.addEventListener('click', () => alternarModal(false));

        // Envio limpo e formatado para o WhatsApp
        btnSubmitOrder.addEventListener('click', () => {
            const itens = Object.values(carrinho);
            if (itens.length === 0) return alert("Sua lista está vazia! Adicione itens primeiro.");

            let textoPedido = `*📋 LISTA DE SEPARAÇÃO - VERDÃO DISTRIBUIDORA*\n`;
            textoPedido += `----------------------------------------------\n\n`;

            itens.forEach(item => {
                textoPedido += `▪️ *${item.qtd}x* ${item.nome}  _(Cód: ${item.id} - ${item.und})_\n`;
            });

            textoPedido += `\n----------------------------------------------\n`;
            textoPedido += `_Por favor, verifique a disponibilidade destes itens._`;

            const urlFinal = `https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=${encodeURIComponent(textoPedido)}`;
            window.open(urlFinal, '_blank');
        });

        // Início automático do catálogo
        renderCatalog();
    </script>
