<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --secondary: #ff9800;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #e9ecef;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding-bottom: 100px;
        }

        header {
            background-color: var(--surface);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 1rem;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .header-container {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .brand h1 {
            font-size: 1.5rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 500px;
        }

        .search-container .material-icons-round {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background-color: var(--background);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 992px) {
            main {
                grid-template-columns: 240px 1fr;
            }
        }

        /* Categorias Lateral (PC) / Scroll (Mobile) */
        .categories-nav {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            position: sticky;
            top: 140px;
            height: max-content;
        }

        @media (min-width: 992px) {
            .categories-nav {
                flex-direction: column;
                overflow-x: visible;
                top: 100px;
            }
        }

        .category-btn {
            white-space: nowrap;
            padding: 0.6rem 1rem;
            border: none;
            background-color: var(--surface);
            color: var(--text-muted);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .category-btn.active, .category-btn:hover {
            background-color: var(--primary);
            color: var(--surface);
        }

        /* Seções de Produtos */
        .products-section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .product-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-light);
        }

        .product-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .product-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .product-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
        }

        .product-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* Controles de Quantidade */
        .quantity-control {
            display: flex;
            align-items: center;
            background-color: var(--background);
            border-radius: 20px;
            padding: 2px;
        }

        .qty-btn {
            background: none;
            border: none;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--primary);
            border-radius: 50%;
        }

        .qty-btn:hover {
            background-color: var(--primary-light);
        }

        .qty-value {
            width: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Barra de Resumo Fixa / Carrinho */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--surface);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.08);
            padding: 1rem;
            z-index: 20;
        }

        .cart-bar-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-view-cart {
            background-color: var(--primary);
            color: var(--surface);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        /* Modal do Carrinho Estilo Gaveta */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 450px;
            height: 100%;
            background-color: var(--surface);
            box-shadow: var(--shadow-lg);
            z-index: 30;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-close-cart {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .cart-items-list {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-details h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cart-modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background-color: var(--background);
        }

        .cart-total-row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .btn-submit-order {
            width: 100%;
            background-color: #25d366;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 25;
            display: none;
        }

        .modal-overlay.open {
            display: block;
        }

        .empty-cart-msg {
            text-align: center;
            color: var(--text-muted);
            margin: auto;
        }
    </style>
</head>

            { id: "36",   nome: "Sopa Verdão Canja/Carne", preco: 8.50, und: "CX", categoria: "sopas" }
        ];

        // Mapeamento das Categorias por extenso
        const CATEGORIAS_NOMES = {
            hidroponicos: "Hidropônicos",
            frutas: "Frutas",
            verduras: "Verduras e Legumes",
            mercearia: "Massas e Gomas",
            sopas: "Sopas Prontas"
        };

        // Estado da aplicação (Carrinho de compras)
        let carrinho = {};

        // Elementos DOM
        const catalogContainer = document.getElementById('catalogContainer');
        const searchInput = document.getElementById('searchInput');
        const categoriesNav = document.getElementById('categoriesNav');
        const barTotal = document.getElementById('barTotal');
        const barQty = document.getElementById('barQty');
        const cartModal = document.getElementById('cartModal');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnViewCart = document.getElementById('btnViewCart');
        const btnCloseCart = document.getElementById('btnCloseCart');
        const cartItemsList = document.getElementById('cartItemsList');
        const modalTotal = document.getElementById('modalTotal');
        const btnSubmitOrder = document.getElementById('btnSubmitOrder');

        // Inicialização do Catálogo
        function renderCatalog(filterText = "", filterCategory = "all") {
            catalogContainer.innerHTML = "";

            // Agrupa os itens por categorias para renderizar por seções
            const categoriasParaRenderizar = filterCategory === "all" ? Object.keys(CATEGORIAS_NOMES) : [filterCategory];

            categoriasParaRenderizar.forEach(catKey => {
                const produtosDaCategoria = PRODUTOS_DATA.filter(p => {
                    const matchCategory = p.categoria === catKey;
                    const matchSearch = p.nome.toLowerCase().includes(filterText.toLowerCase()) || p.id.includes(filterText);
                    return matchCategory && matchSearch;
                });

                if (produtosDaCategoria.length > 0) {
                    const section = document.createElement('section');
                    section.className = 'products-section';

                    const title = document.createElement('h2');
                    title.className = 'section-title';
                    title.innerHTML = `${CATEGORIAS_NOMES[catKey]} <span style='font-size:0.9rem; color:var(--text-muted); font-weight:normal;'>(${produtosDaCategoria.length})</span>`;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'products-grid';

                    produtosDaCategoria.forEach(prod => {
                        const qtdNoCarrinho = carrinho[prod.id] ? carrinho[prod.id].qtd : 0;
                        
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div class="product-info">
                                <h3>${prod.nome}</h3>
                                <div class="product-meta">Cód: ${prod.id} • Unidade: ${prod.und}</div>
                            </div>
                            <div class="product-actions">
                                <span class="product-price">R$ ${prod.preco.toFixed(2).replace('.',',')}</span>
                                <div class="quantity-control">
                                    <button class="qty-btn" onclick="alterarQuantidade('${prod.id}', -1)">
                                        <span class="material-icons-round">remove</span>
                                    </button>
                                    <span class="qty-value" id="qty-catalog-${prod.id}">${qtdNoCarrinho}</span>
                                    <button class="qty-btn" onclick="alterarQuantidade('${prod.id}', 1)">
                                        <span class="material-icons-round">add</span>
                                    </button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    catalogContainer.appendChild(section);
                }
            });

            if(catalogContainer.innerHTML === "") {
                catalogContainer.innerHTML = "<p class='empty-cart-msg'>Nenhum produto encontrado.</p>";
            }
        }

        // Altera a quantidade de itens no carrinho
        window.alterarQuantidade = function(id, delta) {
            const produto = PRODUTOS_DATA.find(p => p.id === id);
            if (!produto) return;

            if (!carrinho[id]) {
                if (delta > 0) {
                    carrinho[id] = { ...produto, qtd: delta };
                }
            } else {
                carrinho[id].qtd += delta;
                if (carrinho[id].qtd <= 0) {
                    delete carrinho[id];
                }
            }

            // Atualiza os inputs do catálogo se estiverem visíveis
            const elCatalog = document.getElementById(`qty-catalog-${id}`);
            if (elCatalog) elCatalog.innerText = carrinho[id] ? carrinho[id].qtd : 0;

            atualizarResumoBarra();
            renderCarrinhoModal();
        }

        // Atualiza os totais e indicadores da barra flutuante inferior
        function atualizarResumoBarra() {
            let total = 0;
            let totalItens = 0;

            Object.values(carrinho).forEach(item => {
                total += item.preco * item.qtd;
                totalItens += item.qtd;
            });

            barTotal.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            modalTotal.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
            barQty.innerText = totalItens;
        }

        // Renderiza os itens dentro do modal/gaveta do carrinho
        function renderCarrinhoModal() {
            cartItemsList.innerHTML = "";
            const itens = Object.values(carrinho);

            if (itens.length === 0) {
                cartItemsList.innerHTML = "<p class='empty-cart-msg'><span class='material-icons-round' style='font-size:3rem; display:block; margin-bottom:0.5rem;'>shopping_cart_checkout</span>Seu carrinho está vazio.</p>";
                return;
            }

            itens.forEach(item => {
                const itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <div class="cart-item-details">
                        <h4>${item.nome}</h4>
                        <span class="cart-item-price">R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn" onclick="alterarQuantidade('${item.id}', -1)">
                            <span class="material-icons-round">remove</span>
                        </button>
                        <span class="qty-value">${item.qtd}</span>
                        <button class="qty-btn" onclick="alterarQuantidade('${item.id}', 1)">
                            <span class="material-icons-round">add</span>
                        </button>
                    </div>
                `;
                cartItemsList.appendChild(itemRow);
            });
        }

        // Controle do Modal
        function alternarModal(abrir) {
            if (abrir) {
                cartModal.classList.add('open');
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden'; // trava scroll da página de fundo
            } else {
                cartModal.classList.remove('open');
                modalOverlay.classList.remove('open');
                document.body.style.overflow = 'auto';
            }
        }

        // Eventos e Filtros de Categorias
        categoriesNav.addEventListener('click', (e) => {
            const btn = e.target.closest('.category-btn');
            if (!btn) return;

            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderCatalog(searchInput.value, btn.dataset.category);
        });

        // Busca em Tempo Real
        searchInput.addEventListener('input', (e) => {
            const categoriaAtiva = document.querySelector('.category-btn.active').dataset.category;
            renderCatalog(e.target.value, categoriaAtiva);
        });

        // Eventos do Modal
        btnViewCart.addEventListener('click', () => alternarModal(true));
        btnCloseCart.addEventListener('click', () => alternarModal(false));
        modalOverlay.addEventListener('click', () => alternarModal(false));

        // Formatação profissional para envio via WhatsApp
        btnSubmitOrder.addEventListener('click', () => {
            const itens = Object.values(carrinho);
            if (itens.length === 0) return alert("Adicione produtos antes de enviar!");

            let textoPedido = `*🛒 NOVO PEDIDO - VERDÃO DISTRIBUIDORA*\n`;
            textoPedido += `----------------------------------------------\n\n`;

            let totalGeral = 0;
            itens.forEach(item => {
                const subtotal = item.preco * item.qtd;
                totalGeral += subtotal;
                textoPedido += `▪️ *${item.qtd}x* ${item.nome}\n`;
                textoPedido += `   _Cód: ${item.id} | Subtotal: R$ ${subtotal.toFixed(2).replace('.', ',')}_\n\n`;
            });

            textoPedido += `----------------------------------------------\n`;
            textoPedido += `*Total do Pedido: R$ ${totalGeral.toFixed(2).replace('.', ',')}*\n\n`;
            textoPedido += `_Por favor, confirme as informações e informe o endereço de entrega._`;

            // Codifica o texto para formato URL padrão do WhatsApp
            const urlFinal = `https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=${encodeURIComponent(textoPedido)}`;
            
            // Abre nova aba redirecionando para o app ou web do WhatsApp
            window.open(urlFinal, '_blank');
        });

        // Inicialização Padrão
        renderCatalog();
    </script>
