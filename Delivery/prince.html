<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Banca - 90 Dias</title>
    <style>
        :root {
            --primary-color: #2ecc71;
            --secondary-color: #27ae60;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            background: #eefaf3;
            padding: 20px;
            border-radius: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item span {
            display: block;
            font-size: 0.9em;
            color: #666;
        }

        .stat-item strong {
            font-size: 1.2em;
            color: var(--secondary-color);
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        thead {
            position: sticky;
            top: 0;
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .currency {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        .highlight-row {
            background-color: #d1f2eb !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerenciamento de Banca</h1>

    <div class="stats-summary" id="summary">
        <div class="stat-item">
            <span>Banca Inicial</span>
            <strong id="start-val">R$ 60,00</strong>
        </div>
        <div class="stat-item">
            <span>Meta Diária</span>
            <strong>13%</strong>
        </div>
        <div class="stat-item">
            <span>Período</span>
            <strong>90 Dias</strong>
        </div>
        <div class="stat-item">
            <span>Saldo Final Estimado</span>
            <strong id="end-val">Calculando...</strong>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Dia</th>
                    <th>Saldo Inicial (R$)</th>
                    <th>Meta (13%)</th>
                    <th>Saldo Final (R$)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const bancaInicial = 60.00;
    const taxaDiaria = 0.13; // 13%
    const totalDias = 90;
    const tableBody = document.getElementById('table-body');

    function formatCurrency(value) {
        return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    let saldoAtual = bancaInicial;

    for (let dia = 1; dia <= totalDias; dia++) {
        let metaDoDia = saldoAtual * taxaDiaria;
        let saldoFinal = saldoAtual + metaDoDia;

        let row = document.createElement('tr');
        
        // Destacar meses fechados (30, 60, 90)
        if (dia % 30 === 0) {
            row.classList.add('highlight-row');
        }

        row.innerHTML = `
            <td>Dia ${dia}</td>
            <td class="currency">${formatCurrency(saldoAtual)}</td>
            <td class="currency">${formatCurrency(metaDoDia)}</td>
            <td class="currency">${formatCurrency(saldoFinal)}</td>
        `;

        tableBody.appendChild(row);

        // Atualiza saldo para o dia seguinte
        saldoAtual = saldoFinal;

        // Atualiza o resumo final no cabeçalho
        if (dia === totalDias) {
            document.getElementById('end-val').innerText = formatCurrency(saldoFinal);
        }
    }
</script>

</body>
</html>
