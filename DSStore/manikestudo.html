<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: row; 
            height: 100vh; 
            background: var(--bg); 
            color: var(--text); 
            overflow: hidden; 
        }

        /* Sidebar */
        aside { 
            width: 280px; 
            min-width: 280px;
            background: var(--dark); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            border-right: 1px solid var(--card-border); 
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; }
        
        .user-rank { background: linear-gradient(45deg, #1e293b, #334155); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--accent); }
        .rank-medal { font-size: 2rem; display: block; margin-bottom: 5px; }
        
        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }
        
        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        /* Main Content */
        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; width: 100%; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .card-stat { background: var(--white); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--card-border); text-align: center;}
        .card-stat h2 { margin: 5px 0 0 0; font-size: 1.5rem; }

        .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-bottom: 20px; }

        .card { background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--card-border); }

        .btn { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        .hidden { display: none !important; }

        /* Ajustes Mobile */
        #menu-toggle { display: none; position: fixed; top: 15px; right: 15px; z-index: 1000; width: 50px; height: 50px; border-radius: 12px; }

        @media (max-width: 850px) {
            body { flex-direction: column; }
            aside { position: fixed; left: -280px; height: 100%; transition: 0.3s; }
            aside.active { left: 0; }
            main { padding: 15px; padding-top: 75px; }
            .grid-2 { grid-template-columns: 1fr; }
            #menu-toggle { display: flex; }
        }

        /* ESTILOS DE QUESTÕES OTIMIZADOS PARA CELULAR */
        .alt-btn { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 18px; 
            margin: 12px 0; 
            border: 2px solid var(--card-border); 
            border-radius: 10px; 
            background: var(--white); 
            cursor: pointer; 
            color: var(--text); 
            font-size: 1rem; 
            transition: 0.2s;
            touch-action: manipulation; /* Remove delay de toque no mobile */
            -webkit-tap-highlight-color: transparent;
        }
        .alt-btn:active { background: rgba(0,0,0,0.05); }
        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.15) !important; font-weight: bold; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<button id="menu-toggle" class="btn btn-primary" onclick="document.querySelector('aside').classList.toggle('active')">☰</button>

<aside>
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>

    <div class="user-rank">
        <span class="rank-medal" id="rank-icon">🛡️</span>
        <small style="color:var(--accent); font-weight:bold">PATENTE ATUAL</small>
        <div id="rank-name" style="font-weight: bold; font-size: 1.1rem;">Recruta</div>
    </div>
    
    <div class="timer-box">
        <small>⏱️ FOCO</small>
        <div class="timer-display" id="display-timer">00:00:00</div>
        <div style="display:flex; gap:5px; justify-content:center">
            <button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem" onclick="toggleTimer()" id="btn-timer-toggle">Iniciar</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem" onclick="resetTimer()">Zerar</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" onclick="navegar('dashboard')">🏠 Dashboard</button>
        <div id="lista-materias-menu"></div>
    </div>
    
    <button class="btn btn-primary" onclick="novaMateria()" style="margin-bottom:10px">+ Nova Matéria</button>
    <button class="btn btn-accent" style="font-size: 0.75rem;" onclick="exportarDados()">📥 Backup</button>
</aside>

<main onclick="document.querySelector('aside').classList.remove('active')">
    <div id="secao-dashboard">
        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Média</small><h2 id="total-pct">0%</h2></div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>📈 Evolução</h3>
                <canvas id="graficoEvolucao" height="180"></canvas>
            </div>
            <div class="card" style="border-left: 5px solid var(--danger);">
                <strong>🎯 Revisão de Erros</strong>
                <p style="font-size:0.85rem; opacity:0.8">Pratique o que você errou.</p>
                <button class="btn btn-danger" style="width:100%" onclick="irSimuladoErros()">Praticar Erros</button>
            </div>
        </div>
    </div>

    <div id="secao-materia" class="hidden">
        <h1 id="materia-nome-txt">Disciplina</h1>
        <div class="card">
            <div class="table-container">
                <table>
                    <thead><tr><th>Visto</th><th>Tópico</th><th>%</th><th>Ações</th></tr></thead>
                    <tbody id="tabela-assuntos"></tbody>
                </table>
            </div>
            <button class="btn btn-primary" onclick="novoAssunto()" style="margin-top:15px; width:100%">+ Novo Tópico</button>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width: 800px; margin: auto;">
            <div id="sim-status" style="font-weight:bold; color:var(--primary); margin-bottom:15px; border-bottom:1px solid var(--card-border); padding-bottom:10px;"></div>
            <p id="sim-txt" style="font-size: 1.1rem; line-height: 1.5; font-weight: 500;"></p>
            <div id="sim-opcs"></div>
            
            <div id="sim-feedback" class="card hidden" style="margin-top:15px; background:rgba(37, 99, 235, 0.1); border-left:5px solid var(--primary)">
                <strong>💡 Comentário:</strong> <p id="sim-coment-txt" style="margin:5px 0 0 0"></p>
            </div>
            
            <button class="btn btn-primary hidden" id="sim-next" style="margin-top:20px; width:100%" onclick="proximaQ()">Próxima Questão</button>
        </div>
    </div>

    <div id="secao-cadastro" class="hidden">
        <div class="card">
            <h2>Nova Questão</h2>
            <textarea id="q-enun" rows="4" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="Enunciado..."></textarea>
            <input type="text" id="q-a" placeholder="Opção A" style="width:100%; padding:10px; margin-bottom:5px;">
            <input type="text" id="q-b" placeholder="Opção B" style="width:100%; padding:10px; margin-bottom:5px;">
            <input type="text" id="q-c" placeholder="Opção C" style="width:100%; padding:10px; margin-bottom:5px;">
            <input type="text" id="q-d" placeholder="Opção D" style="width:100%; padding:10px; margin-bottom:10px;">
            <select id="q-gab" style="width:100%; padding:10px; margin-bottom:10px;"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
            <button class="btn btn-success" style="width:100%" onclick="salvarQuestao()">Salvar Questão</button>
        </div>
    </div>
</main>

<script>
    let db = JSON.parse(localStorage.getItem('sge_u_db')) || [];
    let histAcertos = JSON.parse(localStorage.getItem('sge_u_hist')) || [0,0,0,0,0,0,0];
    let isDarkMode = localStorage.getItem('sge_u_dark') === 'true';
    let matAtiva = null; let assAtivo = null; let qIndex = 0;
    let timerInterval; let seconds = 0;
    let questoesSessao = [];

    function navegar(id) {
        document.querySelector('aside').classList.remove('active');
        mostrarSecao(id);
    }

    function mostrarSecao(id) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    // --- LÓGICA DE QUESTÕES OTIMIZADA PARA CELULAR ---
    function irSimulado(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes.length) return alert("Adicione questões primeiro!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5);
        qIndex = 0;
        mostrarSecao('simulado');
        renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerText = `Questão ${qIndex+1} de ${questoesSessao.length}`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        
        const container = document.getElementById('sim-opcs');
        container.innerHTML = ['A','B','C','D'].map(l => 
            `<button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>`
        ).join('');
        
        window.scrollTo(0,0);
    }

    function validar(l) {
        const q = questoesSessao[qIndex];
        const botoes = document.querySelectorAll('.alt-btn');
        
        // Desabilita cliques repetidos
        botoes.forEach(b => b.disabled = true);

        if(l === q.r) {
            document.getElementById('btn-'+l).classList.add('correta');
            assAtivo.a++;
            histAcertos[new Date().getDay()]++;
        } else {
            document.getElementById('btn-'+l).classList.add('errada');
            document.getElementById('btn-'+q.r).classList.add('correta');
            assAtivo.e++;
        }

        if(q.coment) {
            document.getElementById('sim-coment-txt').innerText = q.coment;
            document.getElementById('sim-feedback').classList.remove('hidden');
        }
        
        const btnNext = document.getElementById('sim-next');
        btnNext.classList.remove('hidden');
        
        // Scroll suave para o botão de próxima no mobile
        setTimeout(() => {
            btnNext.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);

        salvar();
    }

    function proximaQ() {
        qIndex++;
        if(qIndex < questoesSessao.length) renderQ();
        else { alert("Simulado concluído!"); navegar('dashboard'); }
    }

    // --- FUNÇÕES DE APOIO ---
    function salvar() {
        localStorage.setItem('sge_u_db', JSON.stringify(db));
        localStorage.setItem('sge_u_hist', JSON.stringify(histAcertos));
        renderMenu();
    }

    function novaMateria() {
        const n = prompt("Nome da Matéria (ex: Dir. Constitucional):");
        if(n) { db.push({id: Date.now(), nome: n, assuntos: []}); salvar(); }
    }

    function novoAssunto() {
        const n = prompt("Nome do Tópico (ex: Direitos Fundamentais):");
        if(n && matAtiva) {
            matAtiva.assuntos.push({id: Date.now(), nome: n, a: 0, e: 0, questoes: []});
            salvar(); abrirMateria(matAtiva.id);
        }
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id);
        navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        const tbody = document.getElementById('tabela-assuntos');
        tbody.innerHTML = matAtiva.assuntos.map(a => {
            const pct = (a.a+a.e)>0 ? ((a.a/(a.a+a.e))*100).toFixed(0) : 0;
            return `<tr>
                <td><input type="checkbox"></td>
                <td><b>${a.nome}</b></td>
                <td style="color:${pct>=70?'green':'red'}">${pct}%</td>
                <td>
                    <button class="btn btn-success" onclick="irSimulado(${a.id})">📝</button>
                    <button class="btn btn-primary" onclick="irCad(${a.id})">➕</button>
                </td>
            </tr>`;
        }).join('');
    }

    function irCad(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); navegar('cadastro'); }

    function salvarQuestao() {
        assAtivo.questoes.push({
            p: document.getElementById('q-enun').value,
            a: document.getElementById('q-a').value,
            b: document.getElementById('q-b').value,
            c: document.getElementById('q-c').value,
            d: document.getElementById('q-d').value,
            r: document.getElementById('q-gab').value,
            coment: ""
        });
        alert("Questão salva!");
        document.getElementById('q-enun').value = "";
        salvar();
    }

    function renderDashboard() {
        let tA=0, tE=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tE+=a.e; }));
        document.getElementById('total-q').innerText = tA+tE;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-pct').innerText = (tA+tE)>0?((tA/(tA+tE))*100).toFixed(1)+'%':'0%';
        renderGrafico();
    }

    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: ['D','S','T','Q','Q','S','S'], datasets: [{ label: 'Acertos', data: histAcertos, borderColor: '#2563eb', tension: 0.3, fill: true, backgroundColor: 'rgba(37,99,235,0.1)' }] },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">📚 ${m.nome}</button>`
        ).join('');
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('sge_u_dark', isDarkMode);
    }

    function exportarDados() {
        const data = JSON.stringify(db);
        const blob = new Blob([data], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mike_backup.json';
        a.click();
    }

    // Inicialização
    if(isDarkMode) document.body.classList.add('dark-mode');
    renderMenu();
    renderDashboard();
</script>

</body>
</html>
