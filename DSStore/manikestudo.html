<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Sidebar Responsiva */
        aside { 
            width: 280px; min-width: 280px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100; transition: transform 0.3s ease;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; }

        .user-rank { background: linear-gradient(45deg, #1e293b, #334155); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--accent); }
        .rank-medal { font-size: 2rem; display: block; margin-bottom: 5px; }

        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }
        
        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        /* Main */
        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; width: 100%; }
        .header-page { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card-stat { background: var(--white); padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); border-top: 4px solid var(--primary); }
        .card-stat h2 { margin: 10px 0 0 0; font-size: 1.8rem; }

        .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-bottom: 20px; }

        .card { background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px; font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid var(--card-border); font-size: 0.9rem; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        .hidden { display: none !important; }

        /* Simulado Estilos */
        .alt-btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 2px solid var(--card-border); border-radius: 8px; background: var(--white); cursor: pointer; color: var(--text); font-size: 1rem; }
        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.15) !important; font-weight: bold; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }

        #menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); justify-content: center; align-items: center; font-size: 1.5rem; }

        /* Responsividade */
        @media (max-width: 850px) {
            aside { position: fixed; left: -280px; height: 100%; }
            aside.active { left: 0; }
            main { padding: 15px; padding-top: 60px; }
            .grid-2 { grid-template-columns: 1fr; }
            #menu-toggle { display: flex; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<button id="menu-toggle" class="btn btn-primary" onclick="document.querySelector('aside').classList.toggle('active')">☰</button>

<aside id="sidebar">
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>

    <div class="user-rank">
        <span class="rank-medal" id="rank-icon">🛡️</span>
        <div id="rank-name" style="font-weight: bold;">Recruta</div>
    </div>
    
    <div class="timer-box">
        <div class="timer-display" id="display-timer">00:00:00</div>
        <div style="display:flex; gap:5px; justify-content:center">
            <button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem" onclick="toggleTimer()" id="btn-timer-toggle">Iniciar</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem" onclick="resetTimer()">Zerar</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" id="btn-dash" onclick="navegar('dashboard')">🏠 Dashboard</button>
        <div id="lista-materias-menu"></div>
    </div>
    
    <button class="btn btn-primary" onclick="novaMateria()">+ Nova Matéria</button>
</aside>

<main onclick="document.getElementById('sidebar').classList.remove('active')">
    <div id="secao-dashboard">
        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Aproveitamento</small><h2 id="total-pct">0%</h2></div>
            <div class="card-stat"><small>Vistos</small><h2 id="total-vistos">0</h2></div>
        </div>

        <div class="grid-2">
            <div class="card"><h3>📈 Evolução</h3><canvas id="graficoEvolucao" height="180"></canvas></div>
            <div class="card">
                <h3>🗓️ Atividade</h3>
                <div class="calendar-grid" id="cal-grid"></div>
            </div>
        </div>
    </div>

    <div id="secao-materia" class="hidden">
        <div class="header-page">
            <h1 id="materia-nome-txt">Disciplina</h1>
            <div style="display:flex; gap:10px">
                <button class="btn btn-primary" onclick="novoAssunto()">+ Tópico</button>
                <button class="btn btn-danger" onclick="removerMateriaAtiva()">Excluir</button>
            </div>
        </div>
        <div class="card">
            <div class="table-container">
                <table>
                    <thead><tr><th>Visto</th><th>Tópico</th><th>Estudo</th><th>%</th><th>Ações</th></tr></thead>
                    <tbody id="tabela-assuntos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="secao-cadastro" class="hidden">
        <div class="card">
            <h2>Nova Questão</h2>
            <textarea id="q-enun" rows="4" style="width:100%; margin-bottom:10px;" placeholder="Enunciado..."></textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="q-a" placeholder="Letra A">
                <input type="text" id="q-b" placeholder="Letra B">
                <input type="text" id="q-c" placeholder="Letra C">
                <input type="text" id="q-d" placeholder="Letra D">
            </div>
            <div style="margin: 15px 0;">
                Gabarito: 
                <select id="q-gab"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
            </div>
            <textarea id="q-coment" rows="2" style="width:100%;" placeholder="Explicação..."></textarea>
            <div style="margin-top:15px;">
                <button class="btn btn-success" onclick="salvarQuestao()">Salvar</button>
                <button class="btn" onclick="mostrarSecao('materia')">Voltar</button>
            </div>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width:800px; margin:auto;">
            <div id="sim-status" style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold; border-bottom:1px solid var(--card-border); padding-bottom:10px;"></div>
            <p id="sim-txt" style="font-size:1.1rem; line-height:1.6;"></p>
            <div id="sim-opcs"></div>
            
            <div id="sim-feedback" class="card hidden" style="background:rgba(37, 99, 235, 0.05); border-left:5px solid var(--primary); margin-top:15px;">
                <strong>💡 Comentário:</strong> <p id="sim-coment-txt"></p>
            </div>
            
            <button id="sim-next" class="btn btn-primary hidden" style="width:100%; margin-top:15px; justify-content:center;" onclick="proximaQ()">Próxima Questão</button>
        </div>
    </div>

    <div id="modal-json" class="modal hidden">
        <div class="modal-content">
            <h3>Importar via JSON</h3>
            <textarea id="json-input" rows="8" style="width:100%;" placeholder='{"questoes": [...]}'></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
                <button class="btn" onclick="fecharModalJson()">Cancelar</button>
                <button class="btn btn-accent" onclick="processarJsonInjetado()">Importar</button>
            </div>
        </div>
    </div>
</main>

<script>
    let db = JSON.parse(localStorage.getItem('sge_u_db')) || [];
    let histAcertos = JSON.parse(localStorage.getItem('sge_u_hist')) || [0,0,0,0,0,0,0];
    let logsEstudo = JSON.parse(localStorage.getItem('sge_u_logs')) || {};
    let isDarkMode = localStorage.getItem('sge_u_dark') === 'true';
    let matAtiva = null, assAtivo = null, qIndex = 0, questoesSessao = [];
    let timerInterval, seconds = 0;

    function navegar(id) {
        document.getElementById('sidebar').classList.remove('active');
        mostrarSecao(id);
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('sge_u_dark', isDarkMode);
        document.getElementById('btn-theme').innerText = isDarkMode ? "☀️ Modo Claro" : "🌙 Modo Noturno";
    }
    if(isDarkMode) document.body.classList.add('dark-mode');

    function toggleTimer() {
        if (timerInterval) {
            clearInterval(timerInterval); timerInterval = null;
            document.getElementById('btn-timer-toggle').innerText = "Iniciar";
        } else {
            timerInterval = setInterval(() => {
                seconds++;
                const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                document.getElementById('display-timer').innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
            document.getElementById('btn-timer-toggle').innerText = "Pausar";
        }
    }
    function resetTimer() { seconds = 0; document.getElementById('display-timer').innerText = "00:00:00"; }

    function salvar() {
        localStorage.setItem('sge_u_db', JSON.stringify(db));
        localStorage.setItem('sge_u_hist', JSON.stringify(histAcertos));
        localStorage.setItem('sge_u_logs', JSON.stringify(logsEstudo));
        renderMenu();
    }

    function mostrarSecao(id) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    function novaMateria() {
        const n = prompt("Nome da Matéria:");
        if(n) { db.push({id: Date.now(), nome: n, assuntos: []}); salvar(); }
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id);
        navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        const tbody = document.getElementById('tabela-assuntos');
        tbody.innerHTML = matAtiva.assuntos.map(a => {
            const pct = (a.a+a.e)>0?((a.a/(a.a+a.e))*100).toFixed(0):0;
            return `<tr>
                <td><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td><b>${a.nome}</b></td>
                <td>${a.dataEstudo ? new Date(a.dataEstudo).toLocaleDateString() : '--'}</td>
                <td><b style="color:${pct>=70?'var(--success)':'var(--danger)'}">${pct}%</b></td>
                <td>
                    <button class="btn btn-primary" style="padding:5px" onclick="irCad(${a.id})">✏️</button>
                    <button class="btn btn-accent" style="padding:5px" onclick="abrirModalJson(${a.id})">{}</button>
                    <button class="btn btn-success" style="padding:5px" onclick="irSimulado(${a.id})">📝</button>
                </td></tr>`;
        }).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check;
        a.dataEstudo = a.check ? new Date().toISOString() : null;
        salvar(); abrirMateria(matAtiva.id);
    }

    function irCad(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); mostrarSecao('cadastro'); }
    function abrirModalJson(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); document.getElementById('modal-json').classList.remove('hidden'); }
    function fecharModalJson() { document.getElementById('modal-json').classList.add('hidden'); }

    function salvarQuestao() {
        assAtivo.questoes.push({
            p: document.getElementById('q-enun').value, 
            a: document.getElementById('q-a').value, b: document.getElementById('q-b').value,
            c: document.getElementById('q-c').value, d: document.getElementById('q-d').value,
            r: document.getElementById('q-gab').value, coment: document.getElementById('q-coment').value
        });
        salvar(); abrirMateria(matAtiva.id);
    }

    // --- LÓGICA DO SIMULADO CORRIGIDA ---
    function irSimulado(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes || assAtivo.questoes.length === 0) return alert("Adicione questões primeiro!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5); 
        qIndex = 0; 
        mostrarSecao('simulado'); 
        renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerHTML = `<span>Tópico: ${assAtivo.nome}</span> <span>${qIndex+1}/${questoesSessao.length}</span>`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        
        const container = document.getElementById('sim-opcs');
        container.innerHTML = '';
        
        ['A','B','C','D'].forEach(l => {
            if(q[l.toLowerCase()]) {
                const btn = document.createElement('button');
                btn.className = 'alt-btn';
                btn.id = 'btn-' + l;
                btn.innerHTML = `<b>${l})</b> ${q[l.toLowerCase()]}`;
                btn.onclick = () => validarResposta(l);
                container.appendChild(btn);
            }
        });
    }

    function validarResposta(escolha) {
        const q = questoesSessao[qIndex];
        const todosBtns = document.querySelectorAll('.alt-btn');
        todosBtns.forEach(b => b.disabled = true); // Desativa todos para não clicar de novo

        if(escolha === q.r) {
            document.getElementById('btn-' + escolha).classList.add('correta');
            assAtivo.a++; // Incrementa acerto
            histAcertos[new Date().getDay()]++;
        } else {
            document.getElementById('btn-' + escolha).classList.add('errada');
            document.getElementById('btn-' + q.r).classList.add('correta');
            assAtivo.e++; // Incrementa erro
        }

        if(q.coment) {
            document.getElementById('sim-coment-txt').innerText = q.coment;
            document.getElementById('sim-feedback').classList.remove('hidden');
        }

        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() {
        qIndex++;
        if(qIndex < questoesSessao.length) {
            renderQ();
        } else {
            alert("Simulado finalizado!");
            navegar('dashboard');
        }
    }

    function renderDashboard() {
        let tA=0, tE=0, tV=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tE+=a.e; if(a.check) tV++; }));
        document.getElementById('total-q').innerText = tA+tE;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-pct').innerText = (tA+tE)>0?((tA/(tA+tE))*100).toFixed(1)+'%':'0%';
        document.getElementById('total-vistos').innerText = tV;
        renderGrafico();
    }

    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: ['D','S','T','Q','Q','S','S'], datasets: [{ label: 'Acertos', data: histAcertos, borderColor: '#2563eb', tension: 0.4 }] }
        });
    }

    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">📚 ${m.nome}</button>`
        ).join('');
    }

    renderMenu(); renderDashboard();
</script>
</body>
</html>
