<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        
        /* Ajuste de Layout Base */
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; flex-direction: row; }

        /* Sidebar Responsiva */
        aside { 
            width: 280px; min-width: 280px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100; transition: transform 0.3s ease;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; border: 1px solid #475569; }

        .user-rank { background: linear-gradient(45deg, #1e293b, #334155); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--accent); }
        .rank-medal { font-size: 2rem; display: block; margin-bottom: 5px; }

        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }
        
        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        /* Main Content */
        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; width: 100%; }
        
        /* Ajustes Mobile */
        #menu-mobile { display: none; position: fixed; top: 10px; left: 10px; z-index: 1000; padding: 10px; border-radius: 5px; }

        @media (max-width: 850px) {
            aside { position: fixed; left: -280px; height: 100%; }
            aside.open { transform: translateX(280px); }
            main { padding: 15px; padding-top: 60px; }
            #menu-mobile { display: block; }
            .stats-grid { grid-template-columns: 1fr 1fr !important; }
            .grid-2 { grid-template-columns: 1fr !important; }
            .header-page { flex-direction: column; align-items: flex-start; gap: 10px; }
        }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .card-stat { background: var(--white); padding: 15px; border-radius: 12px; border: 1px solid var(--card-border); border-top: 4px solid var(--primary); }
        .card-stat h2 { margin: 5px 0 0 0; font-size: 1.4rem; }

        .card { background: var(--white); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); overflow-x: auto; }
        
        /* Tabelas Responsivas */
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { text-align: left; padding: 10px; font-size: 0.7rem; color: #64748b; }
        td { padding: 10px; border-bottom: 1px solid var(--card-border); font-size: 0.85rem; }

        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        .hidden { display: none !important; }

        /* Simulado Estilo Reforçado para Touch */
        .alt-btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 12px 0; border: 2px solid var(--card-border); border-radius: 10px; background: var(--white); cursor: pointer; color: var(--text); font-size: 1rem; -webkit-tap-highlight-color: transparent; }
        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.1) !important; font-weight: bold; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.1) !important; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
        .cal-day { padding: 8px; border-radius: 5px; background: rgba(100,100,100,0.1); font-size: 0.7rem; text-align: center; }
        .cal-has-data { background: var(--success) !important; color: white; }
    </style>
</head>
<body>

<button id="menu-mobile" class="btn btn-primary" onclick="toggleSidebar()">☰ Menu</button>

<aside id="sidebar">
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>

    <div class="user-rank">
        <span class="rank-medal" id="rank-icon">🛡️</span>
        <div id="rank-name" style="font-weight: bold;">Recruta</div>
    </div>
    
    <div class="timer-box">
        <div class="timer-display" id="display-timer">00:00:00</div>
        <div style="display:flex; gap:5px; justify-content:center">
            <button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem" onclick="toggleTimer()" id="btn-timer-toggle">Iniciar</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem" onclick="resetTimer()">Zerar</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" id="btn-dash" onclick="mudarSecao('dashboard')">🏠 Dashboard</button>
        <div id="lista-materias-menu"></div>
    </div>
    
    <button class="btn btn-primary" onclick="novaMateria()" style="width:100%">+ Disciplina</button>
</aside>

<main onclick="closeSidebar()">
    <div id="secao-dashboard">
        <div id="alerta-box" class="card hidden" style="background: var(--warning); color:white;">🔔 Você tem revisões hoje!</div>

        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Aproveitamento</small><h2 id="total-pct">0%</h2></div>
            <div class="card-stat"><small>Vistos</small><h2 id="total-vistos">0</h2></div>
        </div>

        <div class="grid-2" style="display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px;">
            <div class="card">
                <h3>📈 Evolução</h3>
                <canvas id="graficoEvolucao" height="180"></canvas>
            </div>
            <div class="card">
                <h3>🗓️ Atividade</h3>
                <div class="calendar-grid" id="cal-grid"></div>
            </div>
        </div>
    </div>

    <div id="secao-materia" class="hidden">
        <div class="header-page">
            <h1 id="materia-nome-txt">Disciplina</h1>
            <div style="display:flex; gap:5px">
                <button class="btn btn-primary" onclick="novoAssunto()">+ Tópico</button>
                <button class="btn btn-danger" onclick="removerMateriaAtiva()">Excluir</button>
            </div>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Visto</th><th>Tópico</th><th>Data</th><th>Revisão</th><th>%</th><th>Ações</th></tr></thead>
                <tbody id="tabela-assuntos"></tbody>
            </table>
        </div>
    </div>

    <div id="secao-cadastro" class="hidden">
        <div class="card">
            <h2>Nova Questão</h2>
            <textarea id="q-enun" rows="4" style="width:100%; border-radius:8px; padding:10px;" placeholder="Pergunta..."></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
                <input type="text" id="q-a" placeholder="A" style="padding:10px;">
                <input type="text" id="q-b" placeholder="B" style="padding:10px;">
                <input type="text" id="q-c" placeholder="C" style="padding:10px;">
                <input type="text" id="q-d" placeholder="D" style="padding:10px;">
            </div>
            <div style="margin-top:15px">
                Gabarito: <select id="q-gab"><option>A</option><option>B</option><option>C</option><option>D</option></select>
            </div>
            <textarea id="q-coment" rows="2" style="width:100%; margin-top:10px;" placeholder="Comentário..."></textarea>
            <div style="margin-top:15px">
                <button class="btn btn-success" onclick="salvarQuestao()">Salvar</button>
                <button class="btn" onclick="mostrarSecao('materia')">Voltar</button>
            </div>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width: 800px; margin: auto;">
            <div id="sim-status" style="font-weight:bold; margin-bottom:15px; display:flex; justify-content:space-between;"></div>
            <p id="sim-txt" style="font-size: 1.1rem; font-weight: 500;"></p>
            <div id="sim-opcs"></div>
            <div id="sim-feedback" class="card hidden" style="margin-top:15px; border-left:5px solid var(--primary); background: rgba(0,0,0,0.05);">
                <strong>💡 Gabarito Comentado:</strong> <p id="sim-coment-txt"></p>
            </div>
            <button class="btn btn-primary hidden" id="sim-next" style="width:100%; margin-top:15px; justify-content:center" onclick="proximaQ()">Próxima Questão</button>
        </div>
    </div>

    <div id="modal-json" class="modal hidden">
        <div class="modal-content">
            <h3>Importar JSON</h3>
            <textarea id="json-input" rows="8" style="width:100%; font-family:monospace;"></textarea>
            <div style="margin-top:15px; display:flex; gap:10px; justify-content:flex-end">
                <button class="btn" onclick="fecharModalJson()">Sair</button>
                <button class="btn btn-accent" onclick="processarJsonInjetado()">Importar</button>
            </div>
        </div>
    </div>
</main>

<script>
    // Lógica Original Preservada
    let db = JSON.parse(localStorage.getItem('sge_u_db')) || [];
    let histAcertos = JSON.parse(localStorage.getItem('sge_u_hist')) || [0,0,0,0,0,0,0];
    let logsEstudo = JSON.parse(localStorage.getItem('sge_u_logs')) || {};
    let isDarkMode = localStorage.getItem('sge_u_dark') === 'true';

    let matAtiva = null; let assAtivo = null; let qIndex = 0;
    let timerInterval; let seconds = 0;
    let questoesSessao = [];

    // Funções de Interface Corrigidas para Mobile
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
    
    function mudarSecao(id) { 
        closeSidebar(); 
        mostrarSecao(id); 
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('sge_u_dark', isDarkMode);
        document.getElementById('btn-theme').innerText = isDarkMode ? "☀️ Modo Claro" : "🌙 Modo Noturno";
    }
    if(isDarkMode) { document.body.classList.add('dark-mode'); document.getElementById('btn-theme').innerText = "☀️ Modo Claro"; }

    function toggleTimer() {
        const btn = document.getElementById('btn-timer-toggle');
        if (timerInterval) {
            clearInterval(timerInterval); timerInterval = null;
            btn.innerText = "Iniciar";
        } else {
            timerInterval = setInterval(() => {
                seconds++;
                const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const secs = String(seconds % 60).padStart(2, '0');
                document.getElementById('display-timer').innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
            btn.innerText = "Pausar";
        }
    }
    function resetTimer() { seconds = 0; document.getElementById('display-timer').innerText = "00:00:00"; }

    function salvar() { 
        localStorage.setItem('sge_u_db', JSON.stringify(db)); 
        localStorage.setItem('sge_u_hist', JSON.stringify(histAcertos));
        localStorage.setItem('sge_u_logs', JSON.stringify(logsEstudo));
        renderMenu(); 
    }

    function mostrarSecao(id) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    function novaMateria() {
        const n = prompt("Nome da Disciplina:");
        if(n) { db.push({id: Date.now(), nome: n, assuntos: []}); salvar(); }
    }

    function removerMateriaAtiva() {
        if(confirm("Excluir matéria?")) {
            db = db.filter(m => m.id !== matAtiva.id);
            salvar(); mostrarSecao('dashboard');
        }
    }

    function novoAssunto() {
        const n = prompt("Nome do Tópico:");
        if(n && matAtiva) {
            matAtiva.assuntos.push({id: Date.now(), nome: n, check: false, dataEstudo: null, a: 0, e: 0, questoes: []});
            salvar(); abrirMateria(matAtiva.id);
        }
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id);
        mostrarSecao('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        const tbody = document.getElementById('tabela-assuntos');
        tbody.innerHTML = matAtiva.assuntos.map(a => {
            const diff = a.dataEstudo ? Math.floor((new Date() - new Date(a.dataEstudo)) / (1000*60*60*24)) : -1;
            const pct = (a.a+a.e)>0?((a.a/(a.a+a.e))*100).toFixed(0):0;
            return `<tr>
                <td><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td><b>${a.nome}</b></td>
                <td>${a.dataEstudo ? new Date(a.dataEstudo).toLocaleDateString() : '--'}</td>
                <td>${diff === -1 ? 'Pendente' : diff+'d'}</td>
                <td><b style="color:${pct>=70?'var(--success)':'var(--danger)'}">${pct}%</b></td>
                <td>
                    <button class="btn btn-primary" onclick="irCad(${a.id})">✏️</button>
                    <button class="btn btn-accent" onclick="abrirModalJson(${a.id})">{}</button>
                    <button class="btn btn-success" onclick="irSimulado(${a.id})">📝</button>
                </td></tr>`;
        }).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check;
        a.dataEstudo = a.check ? new Date().toISOString() : null;
        salvar(); abrirMateria(matAtiva.id);
    }

    function irCad(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); mostrarSecao('cadastro'); }
    function abrirModalJson(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); document.getElementById('modal-json').classList.remove('hidden'); }
    function fecharModalJson() { document.getElementById('modal-json').classList.add('hidden'); }

    function processarJsonInjetado() {
        try {
            const data = JSON.parse(document.getElementById('json-input').value);
            const lista = data.questoes || data;
            lista.forEach(q => {
                assAtivo.questoes.push({
                    p: q.p || q.pergunta, a: q.a, b: q.b, c: q.c, d: q.d, r: q.r, coment: q.coment || ""
                });
            });
            salvar(); fecharModalJson(); abrirMateria(matAtiva.id);
        } catch(e) { alert("Erro no JSON"); }
    }

    function salvarQuestao() {
        assAtivo.questoes.push({
            p: document.getElementById('q-enun').value, a: document.getElementById('q-a').value, 
            b: document.getElementById('q-b').value, c: document.getElementById('q-c').value, 
            d: document.getElementById('q-d').value, r: document.getElementById('q-gab').value, 
            coment: document.getElementById('q-coment').value
        });
        salvar(); abrirMateria(matAtiva.id);
    }

    function irSimulado(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(assAtivo.questoes.length === 0) return alert("Sem questões!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5); 
        qIndex = 0; mostrarSecao('simulado'); renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerHTML = `<span>${assAtivo.nome}</span> <span>${qIndex+1}/${questoesSessao.length}</span>`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        const container = document.getElementById('sim-opcs');
        container.innerHTML = ['A','B','C','D'].map(l => 
            `<button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>`
        ).join('');
    }

    function validar(l) {
        const q = questoesSessao[qIndex];
        document.querySelectorAll('.alt-btn').forEach(b => b.disabled = true);
        if(l === q.r) { 
            assAtivo.a++; document.getElementById('btn-'+l).classList.add('correta');
            histAcertos[new Date().getDay()]++;
        } else { 
            assAtivo.e++; document.getElementById('btn-'+l).classList.add('errada');
            document.getElementById('btn-'+q.r).classList.add('correta');
        }
        if(q.coment) {
            document.getElementById('sim-coment-txt').innerText = q.coment;
            document.getElementById('sim-feedback').classList.remove('hidden');
        }
        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() {
        qIndex++;
        if(qIndex < questoesSessao.length) renderQ();
        else { alert("Fim!"); mostrarSecao('dashboard'); }
    }

    function renderDashboard() {
        let tA=0, tE=0, tV=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tE+=a.e; if(a.check) tV++; }));
        document.getElementById('total-q').innerText = tA+tE;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-pct').innerText = (tA+tE)>0?((tA/(tA+tE))*100).toFixed(1)+'%':'0%';
        document.getElementById('total-vistos').innerText = tV;
        renderCalendario(); renderGrafico();
    }

    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        grid.innerHTML = ['D','S','T','Q','Q','S','S'].map(d => `<div style="font-weight:bold; font-size:0.7rem">${d}</div>`).join('');
        for(let d=1; d<=31; d++) grid.innerHTML += `<div class="cal-day">${d}</div>`;
    }

    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: ['D','S','T','Q','Q','S','S'], datasets: [{ label: 'Acertos', data: histAcertos, borderColor: '#2563eb', fill: true, backgroundColor: 'rgba(37, 99, 235, 0.1)', tension: 0.4 }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function renderMenu() { 
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">📚 ${m.nome}</button>`
        ).join(''); 
    }

    renderMenu(); renderDashboard();
</script>
</body>
</html>
