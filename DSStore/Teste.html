<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; display: flex; flex-direction: row; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

        /* PADRÃO SIDEBAR */
        aside { 
            width: 280px; min-width: 280px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; border: 1px solid #475569; }
        
        .user-rank { background: linear-gradient(45deg, #1e293b, #334155); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--accent); }
        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }

        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        /* CONTEÚDO PRINCIPAL */
        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card-stat { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid var(--primary); border: 1px solid var(--card-border); }
        .card-stat h2 { margin: 10px 0 0 0; font-size: 1.8rem; }

        .card { background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--card-border); }
        
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        /* SISTEMA DE ELIMINAÇÃO */
        .option-container { display: flex; align-items: stretch; gap: 10px; margin: 12px 0; }
        .btn-x-eliminar { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-x-eliminar:hover { background: #ef4444; color: white; }
        
        .alt-btn { flex: 1; text-align: left; padding: 15px; border: 2px solid var(--card-border); border-radius: 8px; background: var(--white); cursor: pointer; color: var(--text); font-size: 1rem; position: relative; }
        
        .eliminada .alt-btn { opacity: 0.3; text-decoration: line-through; pointer-events: none; background: #f1f5f9; }
        .eliminada .btn-x-eliminar { background: #64748b; color: white; border-color: #475569; }

        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.15) !important; font-weight: bold; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }

        .hidden { display: none !important; }
        mark { background: #fef08a; color: black; border-radius: 2px; }
        .highlight-tool { position: absolute; background: var(--dark); color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; z-index: 500; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; }

        .revision-tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: var(--warning); color: white; margin-right: 4px; }
    </style>
</head>
<body>

<aside>
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>

    <div class="user-rank">🛡️ <span id="rank-name" style="font-weight:bold">Recruta</span></div>
    
    <div class="timer-box">
        <div class="timer-display" id="display-timer">00:00:00</div>
        <button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem; width:100%" onclick="toggleTimer()" id="btn-timer-toggle">Iniciar Cronômetro</button>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" onclick="navegar('dashboard')">🏠 Dashboard</button>
        <div id="lista-materias-menu"></div>
    </div>
    
    <button class="btn btn-primary" onclick="novaMateria()">+ Nova Disciplina</button>
</aside>

<main>
    <div id="secao-dashboard">
        <div class="stats-grid">
            <div class="card-stat"><small>Questões Realizadas</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos Totais</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Tópicos Concluídos</small><h2 id="total-v">0</h2></div>
        </div>

        <div id="revisoes-alerta"></div>

        <div class="card">
            <h3>📈 Evolução de Desempenho</h3>
            <canvas id="graficoEvolucao" height="100"></canvas>
        </div>

        <button class="btn btn-danger" style="width:100%; padding:20px; font-size:1rem" onclick="irSimuladoErros()">🎯 PRATICAR APENAS ERROS</button>
    </div>

    <div id="secao-materia" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px">
            <h1 id="materia-nome-txt">Disciplina</h1>
            <button class="btn btn-primary" onclick="novoAssunto()">+ Adicionar Tópico</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Status</th><th>Tópico</th><th>Ciclo de Revisão</th><th>Ações</th></tr></thead>
                <tbody id="tabela-assuntos"></tbody>
            </table>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width: 850px; margin: auto;">
            <div id="sim-status" style="font-weight:bold; color:var(--primary); margin-bottom:15px"></div>
            <div id="sim-txt" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; position: relative;"></div>
            <div id="sim-opcs"></div>
            <div id="sim-feedback" class="card hidden" style="margin-top:15px; background:rgba(37, 99, 235, 0.05); border-left:5px solid var(--primary)">
                <strong>💡 Comentário:</strong> <p id="sim-coment-txt" style="margin:5px 0 0 0"></p>
            </div>
            <button class="btn btn-primary hidden" id="sim-next" style="margin-top:20px; width:100%; justify-content:center" onclick="proximaQ()">Próxima Questão</button>
        </div>
    </div>

    <div id="modal-json" class="modal hidden">
        <div class="modal-content">
            <h2>Importar JSON de Questões</h2>
            <textarea id="json-input" rows="10" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--card-border); font-family:monospace" placeholder='[{"p":"pergunta", "a":"opc1", "b":"opc2", "c":"opc3", "d":"opc4", "r":"A"}]'></textarea>
            <div style="margin-top:15px; display:flex; gap:10px; justify-content:flex-end">
                <button class="btn" onclick="fecharModalJson()">Cancelar</button>
                <button class="btn btn-accent" onclick="processarJsonInjetado()">Importar Agora</button>
            </div>
        </div>
    </div>
</main>

<script>
    let db = JSON.parse(localStorage.getItem('mike_db')) || [];
    let hist = JSON.parse(localStorage.getItem('mike_hist')) || [0,0,0,0,0,0,0];
    let isDarkMode = localStorage.getItem('mike_dark') === 'true';
    let matAtiva, assAtivo, qIndex, timerInterval, seconds = 0, questoesSessao = [];

    // --- REVISÃO ---
    function calcRevisoes(data) {
        if(!data) return [];
        return [1, 7, 30].map(d => {
            let dt = new Date(data); dt.setDate(dt.getDate() + d);
            return dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
        });
    }

    // --- SISTEMA ---
    function salvar() { 
        localStorage.setItem('mike_db', JSON.stringify(db)); 
        localStorage.setItem('mike_hist', JSON.stringify(hist)); 
        renderMenu(); 
    }

    function navegar(id) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDash();
    }

    function toggleDarkMode() {
        isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('mike_dark', isDarkMode);
    }
    if(isDarkMode) document.body.classList.add('dark-mode');

    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMat(${m.id})">📚 ${m.nome}</button>`).join('');
    }

    function novaMateria() { const n = prompt("Nome da Disciplina:"); if(n) { db.push({id: Date.now(), nome: n, assuntos: []}); salvar(); } }
    function novoAssunto() { const n = prompt("Nome do Tópico:"); if(n) { matAtiva.assuntos.push({id: Date.now(), nome: n, check: false, data: null, a: 0, e: 0, questoes: []}); salvar(); abrirMat(matAtiva.id); } }

    function abrirMat(id) {
        matAtiva = db.find(m => m.id === id); navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        document.getElementById('tabela-assuntos').innerHTML = matAtiva.assuntos.map(a => `
            <tr>
                <td><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td><b>${a.nome}</b></td>
                <td>${a.data ? calcRevisoes(a.data).map(r => `<span class="revision-tag">${r}</span>`).join('') : '--'}</td>
                <td>
                    <button class="btn btn-accent" onclick="abrirModalJson(${a.id})">{}</button>
                    <button class="btn btn-success" onclick="irSim(${a.id})">📝</button>
                </td>
            </tr>`).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check; a.data = a.check ? new Date().toISOString().split('T')[0] : null;
        salvar(); abrirMat(matAtiva.id);
    }

    // --- JSON ---
    function abrirModalJson(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); document.getElementById('modal-json').classList.remove('hidden'); }
    function fecharModalJson() { document.getElementById('modal-json').classList.add('hidden'); }
    function processarJsonInjetado() {
        try {
            const data = JSON.parse(document.getElementById('json-input').value);
            (data.questoes || data).forEach(q => {
                assAtivo.questoes.push({ p: q.p, a: q.a, b: q.b, c: q.c, d: q.d, r: q.r, coment: q.coment||"", erro: false });
            });
            salvar(); fecharModalJson(); abrirMat(matAtiva.id);
        } catch(e) { alert("Erro no JSON!"); }
    }

    // --- SIMULADO E ELIMINAR ---
    function irSim(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes.length) return alert("Sem questões!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5);
        qIndex = 0; navegar('simulado'); renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerText = `Questão ${qIndex+1}/${questoesSessao.length}`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        document.getElementById('sim-opcs').innerHTML = ['A','B','C','D'].map(l => `
            <div class="option-container" id="cont-${l}">
                <button class="btn-x-eliminar" onclick="eliminar('${l}')">X</button>
                <button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>
            </div>`).join('');
    }

    function eliminar(l) { document.getElementById('cont-'+l).classList.toggle('eliminada'); }

    function validar(l) {
        const q = questoesSessao[qIndex];
        document.querySelectorAll('.alt-btn, .btn-x-eliminar').forEach(b => b.disabled = true);
        if(l === q.r) {
            document.getElementById('btn-'+l).classList.add('correta');
            assAtivo.a++; hist[new Date().getDay()]++; q.erro = false;
        } else {
            document.getElementById('btn-'+l).classList.add('errada');
            document.getElementById('btn-'+q.r).classList.add('correta');
            assAtivo.e++; q.erro = true;
        }
        if(q.coment) { document.getElementById('sim-coment-txt').innerText = q.coment; document.getElementById('sim-feedback').classList.remove('hidden'); }
        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() { qIndex++; if(qIndex < questoesSessao.length) renderQ(); else navegar('dashboard'); }

    // --- DASH E TIMER ---
    function renderDash() {
        let tA=0, tQ=0, tV=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tQ+=(a.a+a.e); if(a.check) tV++; }));
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-q').innerText = tQ;
        document.getElementById('total-v').innerText = tV;
        
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myC) window.myC.destroy();
        window.myC = new Chart(ctx, { type:'line', data:{ labels:['D','S','T','Q','Q','S','S'], datasets:[{label:'Acertos', data:hist, borderColor:'#2563eb', tension:0.4}] } });
    }

    function toggleTimer() {
        const btn = document.getElementById('btn-timer-toggle');
        if(timerInterval) { clearInterval(timerInterval); timerInterval=null; btn.innerText="Iniciar Cronômetro"; }
        else { timerInterval = setInterval(() => { seconds++; let h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60; document.getElementById('display-timer').innerText=`${String(h).padStart(2,0)}:${String(m).padStart(2,0)}:${String(s).padStart(2,0)}`; }, 1000); btn.innerText="Pausar Cronômetro"; }
    }

    function irSimuladoErros() {
        questoesSessao = [];
        db.forEach(m => m.assuntos.forEach(a => { 
            questoesSessao = questoesSessao.concat(a.questoes.filter(q => q.erro === true)); 
        }));
        if(!questoesSessao.length) return alert("Nenhum erro registrado!");
        qIndex = 0; navegar('simulado'); renderQ();
    }

    // GRIFAR
    document.addEventListener('mouseup', () => {
        const s = window.getSelection();
        if(s.toString() && document.getElementById('sim-txt').contains(s.anchorNode)) {
            const r = s.getRangeAt(0).getBoundingClientRect();
            const b = document.createElement('button');
            b.className='highlight-tool'; b.innerText='Grifar';
            b.style.top=(window.scrollY+r.top-35)+'px'; b.style.left=r.left+'px';
            b.onclick=()=>{ const m=document.createElement('mark'); s.getRangeAt(0).surroundContents(m); b.remove(); };
            document.body.appendChild(b);
            setTimeout(()=>b.remove(), 2500);
        }
    });

    renderMenu(); renderDash();
</script>
</body>
</html>
