<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; display: flex; flex-direction: row; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

        aside { 
            width: 280px; min-width: 280px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100; transition: transform 0.3s ease;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; border: 1px solid #475569; }
        .user-rank { background: linear-gradient(45deg, #1e293b, #334155); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--accent); }
        .rank-medal { font-size: 2rem; display: block; margin-bottom: 5px; }
        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }
        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; width: 100%; }
        .header-page { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card-stat { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid var(--primary); border: 1px solid var(--card-border); }
        .card-stat h2 { margin: 10px 0 0 0; font-size: 1.8rem; }

        .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-bottom: 20px; }
        .card { background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); overflow-x: auto; }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--card-border); text-align: left; }

        /* UPGRADE: ALERTAS VISUAIS */
        .alert-revisao { background: #fffbeb; border-left: 5px solid var(--warning); padding: 15px; border-radius: 12px; margin-bottom: 20px; color: #92400e; display: flex; align-items: center; gap: 15px; border: 1px solid #fde68a; }
        .rev-tag { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; background: var(--warning); color: white; margin-right: 3px; white-space: nowrap; font-weight: bold; }
        .rev-hoje { background: var(--danger) !important; animation: blink 1.2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; margin-top: 10px; }
        .cal-day { padding: 10px; border-radius: 8px; background: rgba(100,100,100,0.1); font-size: 0.75rem; cursor: pointer; }
        .cal-day.active-day { background: var(--success); color: white; font-weight: bold; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        .option-container { display: flex; align-items: stretch; gap: 10px; margin: 10px 0; }
        .btn-eliminar { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .alt-btn { flex: 1; text-align: left; padding: 15px; border: 2px solid var(--card-border); border-radius: 8px; background: var(--white); cursor: pointer; color: var(--text); font-size: 1rem; }
        .eliminada .alt-btn { opacity: 0.3; text-decoration: line-through; pointer-events: none; background: #f1f5f9; }
        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.15) !important; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }

        mark { background: #fef08a; color: black; }
        .highlight-tool { position: absolute; background: var(--dark); color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; z-index: 500; border: 1px solid var(--primary); }

        .hidden { display: none !important; }
        #menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); justify-content: center; align-items: center; font-size: 1.5rem; }

        @media (max-width: 850px) {
            aside { position: fixed; left: -280px; height: 100%; }
            aside.active { left: 0; }
            #menu-toggle { display: flex; }
        }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

<button id="menu-toggle" class="btn btn-primary" onclick="document.querySelector('aside').classList.toggle('active')">☰</button>

<aside>
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>
    <div class="user-rank"><span class="rank-medal">🛡️</span><div id="rank-name" style="font-weight: bold;">Recruta</div></div>
    
    <div class="timer-box">
        <div class="timer-display" id="display-timer">00:00:00</div>
        <div style="display:flex; gap:5px; justify-content:center">
            <button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem" onclick="toggleTimer()" id="btn-timer-toggle">Iniciar</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem" onclick="resetTimer()">Zerar</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" onclick="navegar('dashboard')">🏠 Dashboard</button>
        <div id="lista-materias-menu"></div>
    </div>
    <button class="btn btn-primary" onclick="novaMateria()" style="margin-bottom:10px">+ Nova Disciplina</button>

    <div style="border-top: 1px solid #334155; padding-top: 10px;">
        <button class="nav-btn" style="font-size: 0.75rem;" onclick="exportarDados()">📥 Salvar Backup</button>
        <input type="file" id="file-import" class="hidden" onchange="importarDados(event)">
        <button class="nav-btn" style="font-size: 0.75rem;" onclick="document.getElementById('file-import').click()">📤 Carregar Backup</button>
    </div>
</aside>

<main>
    <div id="secao-dashboard">
        <div id="alerta-revisao-container"></div>

        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Aproveitamento</small><h2 id="total-pct">0%</h2></div>
            <div class="card-stat"><small>Tópicos Vistos</small><h2 id="total-vistos">0</h2></div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>📈 Evolução</h3>
                <canvas id="graficoEvolucao" height="160"></canvas>
            </div>
            <div class="card">
                <h3>🗓️ Histórico</h3>
                <div class="calendar-grid" id="cal-grid"></div>
                <div id="cal-detalhes" style="margin-top:15px; font-size:0.8rem; color:var(--primary); font-weight:bold;"></div>
            </div>
        </div>
        <button class="btn btn-danger" style="width:100%; padding:15px" onclick="irSimuladoErros()">🎯 PRATICAR ERROS</button>
    </div>

    <div id="secao-materia" class="hidden">
        <div class="header-page">
            <h1 id="materia-nome-txt">Disciplina</h1>
            <button class="btn btn-primary" onclick="novoAssunto()">+ Tópico</button>
        </div>
        <div class="card">
            <div class="table-container">
                <table>
                    <thead><tr><th>Visto</th><th>Tópico</th><th>Ciclo de Revisão</th><th>%</th><th>Ações</th></tr></thead>
                    <tbody id="tabela-assuntos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width: 800px; margin: auto;">
            <div id="sim-status" style="font-weight:bold; color:var(--primary); margin-bottom:10px"></div>
            <p id="sim-txt" style="font-size: 1.1rem; line-height: 1.5;"></p>
            <div id="sim-opcs"></div>
            <button class="btn btn-primary hidden" id="sim-next" style="width:100%; margin-top:20px" onclick="proximaQ()">Próxima Questão</button>
        </div>
    </div>

    <div id="modal-json" class="modal hidden">
        <div class="modal-content">
            <h3>Importar JSON</h3>
            <textarea id="json-input" rows="10" style="width:100%; margin-bottom:10px"></textarea>
            <button class="btn btn-accent" onclick="processarJsonInjetado()">Importar</button>
            <button class="btn" onclick="fecharModalJson()">Fechar</button>
        </div>
    </div>
</main>

<script>
    let db = JSON.parse(localStorage.getItem('sge_u_db')) || [];
    let histAcertos = JSON.parse(localStorage.getItem('sge_u_hist')) || [0,0,0,0,0,0,0];
    let logsEstudo = JSON.parse(localStorage.getItem('sge_u_logs')) || {};
    let isDarkMode = localStorage.getItem('sge_u_dark') === 'true';
    let matAtiva, assAtivo, qIndex, timerInterval, seconds = 0, questoesSessao = [];

    // --- LÓGICA DE REVISÃO (1, 3, 7, 15, 30) ---
    function calcRevisoes(dataBase) {
        if(!dataBase) return [];
        const hoje = new Date().toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
        return [1, 3, 7, 15, 30].map(d => {
            let dt = new Date(dataBase);
            dt.setDate(dt.getDate() + d);
            const dataF = dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
            return { data: dataF, hoje: dataF === hoje };
        });
    }

    function verificarRevisoesGeral() {
        let pendentes = [];
        db.forEach(m => m.assuntos.forEach(a => {
            if(a.dataEstudo && calcRevisoes(a.dataEstudo).some(r => r.hoje)) pendentes.push(a.nome);
        }));
        const container = document.getElementById('alerta-revisao-container');
        container.innerHTML = pendentes.length > 0 ? `<div class="alert-revisao">⚠️ <strong>Revisão pendente hoje:</strong> ${pendentes.join(', ')}</div>` : '';
    }

    // --- CORE ---
    function salvar() { 
        localStorage.setItem('sge_u_db', JSON.stringify(db)); 
        localStorage.setItem('sge_u_hist', JSON.stringify(histAcertos));
        localStorage.setItem('sge_u_logs', JSON.stringify(logsEstudo));
        renderMenu(); 
    }
    
    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">📚 ${m.nome}</button>`).join('');
    }

    function navegar(id) { 
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id); navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        document.getElementById('tabela-assuntos').innerHTML = matAtiva.assuntos.map(a => {
            const pct = (a.a+a.e)>0?((a.a/(a.a+a.e))*100).toFixed(0):0;
            const revs = calcRevisoes(a.dataEstudo);
            const htmlRevs = revs.map(r => `<span class="rev-tag ${r.hoje?'rev-hoje':''}">${r.data}</span>`).join('');
            return `<tr>
                <td><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td><b>${a.nome}</b></td>
                <td>${a.dataEstudo ? htmlRevs : '--'}</td>
                <td><b style="color:${pct>=70?'var(--success)':'var(--danger)'}">${pct}%</b></td>
                <td>
                    <button class="btn btn-accent" onclick="abrirModalJson(${a.id})">{}</button>
                    <button class="btn btn-success" onclick="irSimulado(${a.id})">📝</button>
                </td></tr>`;
        }).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check;
        const hoje = new Date().toISOString().split('T')[0];
        a.dataEstudo = a.check ? hoje : null;
        if(a.check) {
            if(!logsEstudo[hoje]) logsEstudo[hoje] = [];
            if(!logsEstudo[hoje].includes(matAtiva.nome)) logsEstudo[hoje].push(matAtiva.nome);
        }
        salvar(); abrirMateria(matAtiva.id);
    }

    // --- DASHBOARD & HISTÓRICO ---
    function renderDashboard() {
        verificarRevisoesGeral();
        let tA=0, tE=0, tV=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tE+=a.e; if(a.check) tV++; }));
        document.getElementById('total-q').innerText = tA+tE;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-pct').innerText = (tA+tE)>0?((tA/(tA+tE))*100).toFixed(1)+'%':'0%';
        document.getElementById('total-vistos').innerText = tV;
        renderCalendario(); renderGrafico();
    }

    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        const hoje = new Date();
        const diasMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
        grid.innerHTML = ['D','S','T','Q','Q','S','S'].map(d => `<small>${d}</small>`).join('');
        for(let i=1; i<=diasMes; i++) {
            const dStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            grid.innerHTML += `<div class="cal-day ${logsEstudo[dStr]?'active-day':''}" onclick="verLog('${dStr}')">${i}</div>`;
        }
    }
    function verLog(d) { document.getElementById('cal-detalhes').innerText = logsEstudo[d] ? `Estudado: ${logsEstudo[d].join(', ')}` : "Sem registros."; }

    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.mC) window.mC.destroy();
        window.mC = new Chart(ctx, { type:'line', data:{ labels:['D','S','T','Q','Q','S','S'], datasets:[{label:'Acertos', data:histAcertos, borderColor:'#2563eb', tension:0.4}] } });
    }

    // --- BACKUP ---
    function exportarDados() { 
        const blob = new Blob([JSON.stringify({db, hist:histAcertos, logs:logsEstudo})], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Backup_Mike.json'; a.click(); 
    }
    function importarDados(e) { 
        const reader = new FileReader();
        reader.onload = (ev) => {
            const data = JSON.parse(ev.target.result);
            db = data.db || []; histAcertos = data.hist || [0,0,0,0,0,0,0]; logsEstudo = data.logs || {};
            salvar(); location.reload();
        };
        reader.readAsText(e.target.files[0]);
    }

    // --- SIMULADO & GRIFADOR ---
    function irSimulado(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes.length) return alert("Sem questões!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5);
        qIndex = 0; navegar('simulado'); renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerText = `Questão ${qIndex+1}/${questoesSessao.length}`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-opcs').innerHTML = ['A','B','C','D'].map(l => `
            <div class="option-container" id="cont-${l}">
                <button class="btn-eliminar" onclick="document.getElementById('cont-${l}').classList.toggle('eliminada')">X</button>
                <button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>
            </div>`).join('');
    }

    function validar(l) {
        const q = questoesSessao[qIndex];
        if(l === q.r) { document.getElementById('btn-'+l).classList.add('correta'); assAtivo.a++; histAcertos[new Date().getDay()]++; q.erro = false; }
        else { document.getElementById('btn-'+l).classList.add('errada'); document.getElementById('btn-'+q.r).classList.add('correta'); assAtivo.e++; q.erro = true; }
        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() { qIndex++; if(qIndex < questoesSessao.length) renderQ(); else navegar('dashboard'); }

    // --- TIMER ---
    function toggleTimer() {
        const btn = document.getElementById('btn-timer-toggle');
        if(timerInterval) { clearInterval(timerInterval); timerInterval=null; btn.innerText="Iniciar"; }
        else { timerInterval = setInterval(() => { seconds++; let h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60; document.getElementById('display-timer').innerText=`${String(h).padStart(2,0)}:${String(m).padStart(2,0)}:${String(s).padStart(2,0)}`; }, 1000); btn.innerText="Pausar"; }
    }
    function resetTimer() { seconds=0; document.getElementById('display-timer').innerText="00:00:00"; }

    // --- OUTROS ---
    function toggleDarkMode() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode); localStorage.setItem('sge_u_dark', isDarkMode); }
    if(isDarkMode) document.body.classList.add('dark-mode');
    function novaMateria() { const n = prompt("Matéria:"); if(n) { db.push({id:Date.now(), nome:n, assuntos:[]}); salvar(); } }
    function novoAssunto() { const n = prompt("Tópico:"); if(n) { matAtiva.assuntos.push({id:Date.now(), nome:n, check:false, a:0, e:0, questoes:[]}); salvar(); abrirMateria(matAtiva.id); } }
    function abrirModalJson(id) { assAtivo = matAtiva.assuntos.find(a => a.id === id); document.getElementById('modal-json').classList.remove('hidden'); }
    function fecharModalJson() { document.getElementById('modal-json').classList.add('hidden'); }
    function processarJsonInjetado() {
        try {
            const d = JSON.parse(document.getElementById('json-input').value);
            (d.questoes || d).forEach(q => assAtivo.questoes.push({p:q.p, a:q.a, b:q.b, c:q.c, d:q.d, r:q.r, erro:false}));
            salvar(); fecharModalJson(); alert("Importado!");
        } catch(e) { alert("Erro JSON"); }
    }

    renderMenu(); renderDashboard();
</script>
</body>
</html>
