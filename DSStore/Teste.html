<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
            --hl-yellow: #fef08a;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000; --hl-yellow: #854d0e;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

        /* Menu Lateral */
        aside { 
            width: 260px; min-width: 260px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100; transition: transform 0.3s ease;
        }

        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; font-weight: 500; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        main { flex: 1; padding: 25px; overflow-y: auto; position: relative; }
        
        .card { background: var(--white); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        /* Ferramentas de Prova */
        .prova-toolbar {
            display: flex; gap: 10px; margin-bottom: 15px; padding: 10px;
            background: rgba(37, 99, 235, 0.05); border-radius: 8px; border: 1px dashed var(--primary);
        }

        .tool-btn {
            padding: 5px 12px; border-radius: 5px; border: 1px solid var(--card-border);
            background: var(--white); cursor: pointer; font-size: 0.8rem; font-weight: bold;
        }
        .tool-btn.active { background: var(--warning); border-color: #b45309; }

        /* Estilo da Questão */
        #sim-txt { 
            font-size: 1.2rem; line-height: 1.7; padding: 20px; border-left: 4px solid var(--primary);
            background: var(--bg); border-radius: 0 8px 8px 0; margin-bottom: 20px;
            user-select: text;
        }

        /* O Pulo do Gato: Grifado */
        .grifado { background-color: var(--hl-yellow); border-radius: 3px; }

        .opcao-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
        }

        .alt-btn { 
            flex: 1; text-align: left; padding: 15px; border: 2px solid var(--card-border); 
            border-radius: 8px; background: var(--white); cursor: pointer; color: var(--text); 
            font-size: 1rem; transition: all 0.2s;
        }

        .alt-btn.riscada { 
            opacity: 0.5; text-decoration: line-through; transform: scale(0.98);
            background: #f1f5f9 !important; border-style: dashed;
        }

        .btn-riscar { 
            background: #fee2e2; color: #ef4444; border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1.2rem;
        }

        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.1) !important; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.1) !important; }

        /* Dashboard e Outros */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-stat { background: var(--white); padding: 15px; border-radius: 10px; border-top: 3px solid var(--primary); text-align: center; }
        
        .hidden { display: none !important; }
        #menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; }

        @media (max-width: 850px) {
            aside { position: fixed; left: -260px; height: 100%; }
            aside.active { left: 0; }
            #menu-toggle { display: flex; }
        }
    </style>
</head>
<body>

<button id="menu-toggle" onclick="document.querySelector('aside').classList.toggle('active')">☰</button>

<aside>
    <div style="font-size: 1.5rem; font-weight: 900; color: var(--success); margin-bottom: 20px;">FUTURO MIKE 👮</div>
    
    <button class="nav-btn active" id="btn-dash" onclick="navegar('dashboard')">🏠 Dashboard</button>
    <div id="lista-materias-menu" style="overflow-y: auto; flex: 1;"></div>
    
    <button class="nav-btn" onclick="novaMateria()" style="color: var(--success)">+ Nova Matéria</button>
    
    <div style="padding: 10px; background: #1e293b; border-radius: 10px; text-align: center;">
        <div id="display-timer" style="font-family: monospace; font-size: 1.2rem; color: var(--primary);">00:00:00</div>
        <button onclick="toggleTimer()" id="btn-timer-toggle" style="background:none; border:none; color:white; cursor:pointer; font-size:0.8rem">▶ Iniciar Foco</button>
    </div>
</aside>

<main>
    <div id="secao-dashboard">
        <div id="alerta-revisao" class="card hidden" style="border-left: 5px solid var(--accent);">
            <h3 style="margin-top:0">⏰ Revisões do Dia</h3>
            <div id="lista-revisoes-hoje"></div>
        </div>

        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Tópicos</small><h2 id="total-vistos">0</h2></div>
        </div>

        <div class="card">
            <canvas id="graficoEvolucao" height="100"></canvas>
        </div>

        <button onclick="irSimuladoErros()" class="card" style="width:100%; cursor:pointer; background: var(--danger); color: white; font-weight: bold; border:none">
            🚀 PRATICAR ERROS ANTERIORES
        </button>
    </div>

    <div id="secao-materia" class="hidden">
        <h1 id="materia-nome-txt">Disciplina</h1>
        <div class="card">
            <button onclick="novoAssunto()" class="tool-btn" style="margin-bottom:15px">+ Novo Tópico</button>
            <table style="width:100%; border-collapse: collapse;">
                <tbody id="tabela-assuntos"></tbody>
            </table>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width: 850px; margin: auto;">
            <div class="prova-toolbar">
                <span style="font-weight:bold; color:var(--primary)" id="sim-status">Questão 1</span>
                <button class="tool-btn" id="mode-grifar" onclick="toggleGrifo()">🖋️ Modo Griftexto: <span id="status-grifo">OFF</span></button>
                <button class="tool-btn" onclick="limparGrifos()">🧹 Limpar Grifos</button>
            </div>

            <div id="sim-txt" onmouseup="executarGrifo()"></div>
            
            <div id="sim-opcs"></div>
            
            <div id="sim-feedback" class="card hidden" style="background: #f0f9ff; border-left: 4px solid var(--primary);">
                <strong>💡 Bizu do Professor:</strong>
                <p id="sim-coment-txt" style="margin-top:10px"></p>
            </div>
            
            <button class="nav-btn active" id="sim-next" style="margin-top:20px; text-align:center" onclick="proximaQ()" class="hidden">PRÓXIMA QUESTÃO</button>
        </div>
    </div>

    <div id="secao-cadastro" class="hidden">
        <div class="card">
            <h3>Novo Cadastro</h3>
            <textarea id="q-enun" rows="4" style="width:100%; margin-bottom:10px" placeholder="Enunciado da questão..."></textarea>
            <input type="text" id="q-a" placeholder="Alternativa A" style="width:100%; margin-bottom:5px">
            <input type="text" id="q-b" placeholder="Alternativa B" style="width:100%; margin-bottom:5px">
            <input type="text" id="q-c" placeholder="Alternativa C" style="width:100%; margin-bottom:5px">
            <input type="text" id="q-d" placeholder="Alternativa D" style="width:100%; margin-bottom:10px">
            <label>Gabarito:</label>
            <select id="q-gab"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
            <button onclick="salvarQuestaoManual()" style="display:block; margin-top:20px" class="nav-btn active">SALVAR QUESTÃO</button>
        </div>
    </div>
</main>

<script>
    let db = JSON.parse(localStorage.getItem('mike_db_2026')) || [];
    let histAcertos = JSON.parse(localStorage.getItem('mike_hist')) || [0,0,0,0,0,0,0];
    let matAtiva = null, assAtivo = null, qIndex = 0, timerInterval, seconds = 0, questoesSessao = [], modoErro = false;
    let grifoAtivo = false;

    // --- FUNCIONALIDADE: GRIFAR ---
    function toggleGrifo() {
        grifoAtivo = !grifoAtivo;
        const btn = document.getElementById('mode-grifar');
        btn.classList.toggle('active', grifoAtivo);
        document.getElementById('status-grifo').innerText = grifoAtivo ? "ON" : "OFF";
    }

    function executarGrifo() {
        if (!grifoAtivo) return;
        const sel = window.getSelection();
        if (!sel.rangeCount || sel.toString().length < 2) return;

        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.className = 'grifado';
        
        try {
            range.surroundContents(span);
        } catch(e) {
            console.log("Seleção muito complexa para grifar");
        }
        sel.removeAllRanges();
    }

    function limparGrifos() {
        const txtBox = document.getElementById('sim-txt');
        txtBox.innerHTML = txtBox.innerText;
    }

    // --- FUNCIONALIDADE: RISCAR ---
    function riscarOpcao(letra) {
        const btn = document.getElementById('btn-' + letra);
        btn.classList.toggle('riscada');
        event.stopPropagation();
    }

    // --- SISTEMA ---
    function navegar(id) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    function salvar() {
        localStorage.setItem('mike_db_2026', JSON.stringify(db));
        localStorage.setItem('mike_hist', JSON.stringify(histAcertos));
        renderMenu();
    }

    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">▪️ ${m.nome}</button>`
        ).join('');
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id);
        navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        document.getElementById('tabela-assuntos').innerHTML = matAtiva.assuntos.map(a => `
            <tr style="border-bottom: 1px solid var(--card-border)">
                <td style="padding:15px"><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td><b>${a.nome}</b><br><small>${a.revisoes ? a.revisoes.filter(r=>r.concluida).length : 0}/5 revisões</small></td>
                <td style="text-align:right">
                    <button class="tool-btn" onclick="assAtivo=matAtiva.assuntos.find(x=>x.id===${a.id});navegar('cadastro')">✏️</button>
                    <button class="tool-btn" style="background:var(--success); color:white" onclick="irSimulado(${a.id})">📝</button>
                </td>
            </tr>
        `).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check;
        if(a.check) {
            const hoje = new Date();
            a.revisoes = [1, 3, 7, 15, 30].map(d => {
                let dt = new Date(); dt.setDate(hoje.getDate() + d);
                return { data: dt.toISOString().split('T')[0], concluida: false };
            });
        }
        salvar(); abrirMateria(matAtiva.id);
    }

    // --- QUESTÕES ---
    function irSimulado(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes.length) return alert("Cadastre questões primeiro!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5);
        qIndex = 0; modoErro = false;
        navegar('simulado'); renderQ();
    }

    function irSimuladoErros() {
        questoesSessao = [];
        db.forEach(m => m.assuntos.forEach(a => {
            questoesSessao = questoesSessao.concat(a.questoes.filter(q => q.erro));
        }));
        if(!questoesSessao.length) return alert("Tudo limpo! Nenhum erro registrado.");
        qIndex = 0; modoErro = true;
        navegar('simulado'); renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerText = `Questão ${qIndex+1}/${questoesSessao.length}`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        
        let html = "";
        ['A','B','C','D'].forEach(l => {
            html += `
            <div class="opcao-item">
                <button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>
                <button class="btn-riscar" onclick="riscarOpcao('${l}')">×</button>
            </div>`;
        });
        document.getElementById('sim-opcs').innerHTML = html;
    }

    function validar(l) {
        const q = questoesSessao[qIndex];
        document.querySelectorAll('.alt-btn').forEach(b => b.onclick = null);
        
        if(l === q.r) {
            document.getElementById('btn-'+l).classList.add('correta');
            if(!modoErro) assAtivo.a++;
            q.erro = false;
            histAcertos[new Date().getDay()]++;
        } else {
            document.getElementById('btn-'+l).classList.add('errada');
            document.getElementById('btn-'+q.r).classList.add('correta');
            if(!modoErro) assAtivo.e++;
            q.erro = true;
        }
        
        if(q.coment) {
            document.getElementById('sim-coment-txt').innerText = q.coment;
            document.getElementById('sim-feedback').classList.remove('hidden');
        }
        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() {
        qIndex++;
        if(qIndex < questoesSessao.length) renderQ();
        else { alert("Sessão finalizada!"); navegar('dashboard'); }
    }

    // --- DASHBOARD ---
    function renderDashboard() {
        let tQ=0, tA=0, tV=0, revs = [];
        const hoje = new Date().toISOString().split('T')[0];

        db.forEach(m => m.assuntos.forEach(a => {
            tQ += (a.a + a.e); tA += a.a; if(a.check) tV++;
            if(a.revisoes) a.revisoes.forEach((r, i) => {
                if(r.data === hoje && !r.concluida) revs.push({ mId: m.id, aId: a.id, txt: `${m.nome} > ${a.nome} (${i+1}ª)`, idx: i });
            });
        }));

        document.getElementById('total-q').innerText = tQ;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-vistos').innerText = tV;

        const alerta = document.getElementById('alerta-revisao');
        if(revs.length) {
            alerta.classList.remove('hidden');
            document.getElementById('lista-revisoes-hoje').innerHTML = revs.map(r => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
                    <small><b>${r.txt}</b></small>
                    <button class="tool-btn" onclick="checkRev(${r.mId}, ${r.aId}, ${r.idx})">Concluir</button>
                </div>
            `).join('');
        } else alerta.classList.add('hidden');

        renderGrafico();
    }

    function checkRev(mid, aid, idx) {
        db.find(m=>m.id===mid).assuntos.find(a=>a.id===aid).revisoes[idx].concluida = true;
        salvar(); renderDashboard();
    }

    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['D','S','T','Q','Q','S','S'],
                datasets: [{ label: 'Acertos', data: histAcertos, borderColor: '#2563eb', tension: 0.4 }]
            },
            options: { plugins: { legend: { display: false } } }
        });
    }

    // --- OUTROS ---
    function novaMateria() { let n = prompt("Matéria:"); if(n) { db.push({id:Date.now(), nome:n, assuntos:[]}); salvar(); } }
    function novoAssunto() { let n = prompt("Tópico:"); if(n) { matAtiva.assuntos.push({id:Date.now(), nome:n, check:false, a:0, e:0, questoes:[]}); salvar(); abrirMateria(matAtiva.id); } }
    function salvarQuestaoManual() {
        assAtivo.questoes.push({
            p: document.getElementById('q-enun').value,
            a: document.getElementById('q-a').value,
            b: document.getElementById('q-b').value,
            c: document.getElementById('q-c').value,
            d: document.getElementById('q-d').value,
            r: document.getElementById('q-gab').value,
            coment: document.getElementById('q-coment').value,
            erro: false
        });
        salvar(); alert("Questão salva!"); navegar('materia');
    }
    function toggleTimer() {
        if(timerInterval) { clearInterval(timerInterval); timerInterval = null; document.getElementById('btn-timer-toggle').innerText = "▶ Iniciar Foco"; }
        else { timerInterval = setInterval(() => { seconds++; let h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60; document.getElementById('display-timer').innerText = [h,m,s].map(v=>String(v).padStart(2,'0')).join(':'); }, 1000); document.getElementById('btn-timer-toggle').innerText = "⏸ Pausar"; }
    }

    renderMenu();
    renderDashboard();
</script>
</body>
</html>
