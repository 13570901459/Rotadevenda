<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        
        body { margin: 0; display: flex; flex-direction: row; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

        aside { 
            width: 280px; min-width: 280px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100; transition: transform 0.3s ease;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; }
        .user-rank { background: linear-gradient(45deg, #1e293b, #334155); padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--accent); }
        .rank-medal { font-size: 2rem; display: block; margin-bottom: 5px; }
        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }
        
        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; width: 100%; }
        .header-page { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card-stat { background: var(--white); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid var(--primary); border: 1px solid var(--card-border); }
        .card-stat h2 { margin: 10px 0 0 0; font-size: 1.8rem; }

        .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-bottom: 20px; }
        .card { background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--card-border); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; margin-top: 10px; }
        .cal-day { padding: 10px; border-radius: 8px; background: rgba(100,100,100,0.1); font-size: 0.75rem; position: relative; }
        .has-log { background: var(--success) !important; color: white; font-weight: bold; cursor: help; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        .hidden { display: none !important; }

        #menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); justify-content: center; align-items: center; font-size: 1.5rem; }

        @media (max-width: 850px) {
            aside { position: fixed; left: -280px; height: 100%; }
            aside.active { left: 0; }
            main { padding: 15px; padding-top: 20px; }
            .grid-2 { grid-template-columns: 1fr; }
            #menu-toggle { display: flex; }
        }

        .alt-btn { display: block; width: 100%; text-align: left; padding: 15px; margin: 10px 0; border: 2px solid var(--card-border); border-radius: 8px; background: var(--white); cursor: pointer; color: var(--text); font-size: 1rem; }
        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.15) !important; font-weight: bold; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<button id="menu-toggle" class="btn btn-primary" onclick="document.querySelector('aside').classList.toggle('active')">☰</button>

<aside>
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>

    <div class="user-rank">
        <span class="rank-medal" id="rank-icon">🛡️</span>
        <div id="rank-name" style="font-weight: bold; font-size: 1.1rem;">Recruta</div>
    </div>
    
    <div class="timer-box">
        <div class="timer-display" id="display-timer">00:00:00</div>
        <div style="display:flex; gap:5px; justify-content:center">
            <button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem" onclick="toggleTimer()" id="btn-timer-toggle">Iniciar</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem" onclick="resetTimer()">Zerar</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" id="btn-dash" onclick="navegar('dashboard')">🏠 Dashboard Inicial</button>
        <div id="lista-materias-menu"></div>
    </div>
    
    <button class="btn btn-primary" onclick="novaMateria()">+ Nova Disciplina</button>
</aside>

<main onclick="document.querySelector('aside').classList.remove('active')">
    <div id="secao-dashboard">
        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Aproveitamento</small><h2 id="total-pct">0%</h2></div>
            <div class="card-stat"><small>Tópicos Vistos</small><h2 id="total-vistos">0</h2></div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>📈 Evolução (Últimos 7 dias)</h3>
                <canvas id="graficoEvolucao" height="160"></canvas>
            </div>
            <div class="card">
                <h3>🗓️ Histórico de Estudo</h3>
                <div class="calendar-grid" id="cal-grid"></div>
                <div id="cal-detalhes" style="margin-top:15px; font-size:0.8rem; color:var(--primary); font-weight:bold;"></div>
            </div>
        </div>

        <div class="card" style="border-left: 5px solid var(--danger); display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong>🎯 Recuperação de Erros</strong>
                <p style="margin:5px 0 0 0; font-size:0.85rem; opacity:0.8">Refazer apenas as questões que você errou.</p>
            </div>
            <button class="btn btn-danger" onclick="irSimuladoErros()">Praticar Erros</button>
        </div>
    </div>

    <div id="secao-materia" class="hidden">
        <div class="header-page">
            <h1 id="materia-nome-txt">Disciplina</h1>
            <div style="display:flex; gap:10px">
                <button class="btn btn-primary" onclick="novoAssunto()">+ Tópico</button>
                <button class="btn btn-danger" onclick="removerMateriaAtiva()">Excluir</button>
            </div>
        </div>
        <div class="card">
            <div class="table-container">
                <table>
                    <thead><tr><th>Visto</th><th>Tópico</th><th>Estudo</th><th>%</th><th>Ações</th></tr></thead>
                    <tbody id="tabela-assuntos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <div class="card" style="max-width: 800px; margin: auto;">
            <div id="sim-status" style="font-weight:bold; color:var(--primary); margin-bottom:15px; border-bottom:1px solid var(--card-border); padding-bottom:10px;"></div>
            <p id="sim-txt" style="font-size: 1.1rem; line-height: 1.5;"></p>
            <div id="sim-opcs"></div>
            <div id="sim-feedback" class="card hidden" style="margin-top:15px; background:rgba(37, 99, 235, 0.1); border-left:5px solid var(--primary)">
                <strong>💡 Explicação:</strong> <p id="sim-coment-txt" style="margin:5px 0 0 0"></p>
            </div>
            <button class="btn btn-primary hidden" id="sim-next" style="margin-top:20px; width:100%; justify-content:center" onclick="proximaQ()">Próxima Questão</button>
        </div>
    </div>
</main>

<script>
    // BANCO DE DADOS E ESTADO
    let db = JSON.parse(localStorage.getItem('sge_u_db')) || [];
    let logsEstudo = JSON.parse(localStorage.getItem('sge_u_logs')) || {};
    let histAcertos = JSON.parse(localStorage.getItem('sge_u_hist')) || [0,0,0,0,0,0,0];
    let isDarkMode = localStorage.getItem('sge_u_dark') === 'true';

    let matAtiva = null; let assAtivo = null; let qIndex = 0;
    let timerInterval; let seconds = 0; let questoesSessao = [];
    let modoErro = false;

    // INICIALIZAÇÃO
    if(isDarkMode) { document.body.classList.add('dark-mode'); document.getElementById('btn-theme').innerText = "☀️ Modo Claro"; }

    function salvar() {
        localStorage.setItem('sge_u_db', JSON.stringify(db));
        localStorage.setItem('sge_u_logs', JSON.stringify(logsEstudo));
        localStorage.setItem('sge_u_hist', JSON.stringify(histAcertos));
        renderMenu();
    }

    function navegar(id) {
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    // GESTÃO DE DISCIPLINAS
    function novaMateria() {
        const n = prompt("Nome da Disciplina:");
        if(n) { db.push({id: Date.now(), nome: n, assuntos: []}); salvar(); }
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id);
        navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        renderAssuntos();
    }

    function novoAssunto() {
        const n = prompt("Nome do Tópico:");
        if(n) {
            matAtiva.assuntos.push({id: Date.now(), nome: n, check: false, dataEstudo: null, a: 0, e: 0, questoes: []});
            salvar(); renderAssuntos();
        }
    }

    function renderAssuntos() {
        const tbody = document.getElementById('tabela-assuntos');
        tbody.innerHTML = matAtiva.assuntos.map(a => {
            const pct = (a.a+a.e)>0?((a.a/(a.a+a.e))*100).toFixed(0):0;
            return `<tr>
                <td><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td><b>${a.nome}</b></td>
                <td>${a.dataEstudo ? new Date(a.dataEstudo).toLocaleDateString() : '--'}</td>
                <td><b style="color:${pct>=70?'var(--success)':'var(--danger)'}">${pct}%</b></td>
                <td>
                    <button class="btn btn-success" onclick="irSimulado(${a.id})">📝 Iniciar</button>
                    <button class="btn btn-primary" onclick="importarQuestoes(${a.id})">📥 +Q</button>
                </td>
            </tr>`;
        }).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check;
        const hoje = new Date().toISOString().split('T')[0];
        a.dataEstudo = a.check ? hoje : null;

        if(a.check) {
            if(!logsEstudo[hoje]) logsEstudo[hoje] = [];
            if(!logsEstudo[hoje].includes(matAtiva.nome)) logsEstudo[hoje].push(matAtiva.nome);
        }
        salvar(); renderAssuntos();
    }

    // GESTÃO DE QUESTÕES
    function importarQuestoes(id) {
        const json = prompt("Cole o JSON das questões:");
        if(json) {
            try {
                const q = JSON.parse(json);
                const a = matAtiva.assuntos.find(x => x.id === id);
                a.questoes = a.questoes.concat(q);
                salvar(); alert("Adicionadas!");
            } catch(e) { alert("JSON Inválido!"); }
        }
    }

    // LÓGICA DO SIMULADO (CORRIGIDA)
    function irSimulado(id) {
        modoErro = false;
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes.length) return alert("Adicione questões primeiro!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5);
        qIndex = 0; navegar('simulado'); renderQ();
    }

    function irSimuladoErros() {
        modoErro = true;
        questoesSessao = [];
        db.forEach(m => m.assuntos.forEach(a => {
            const erradas = a.questoes.filter(q => q.errouAntes === true);
            questoesSessao = questoesSessao.concat(erradas);
        }));
        
        if(!questoesSessao.length) return alert("Você não tem questões erradas para praticar!");
        qIndex = 0; navegar('simulado'); renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerText = `Questão ${qIndex+1}/${questoesSessao.length}`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        const container = document.getElementById('sim-opcs');
        container.innerHTML = ['A','B','C','D'].map(l => 
            `<button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>`
        ).join('');
    }

    function validar(l) {
        const q = questoesSessao[qIndex];
        document.querySelectorAll('.alt-btn').forEach(b => b.disabled = true);
        
        const diaSemana = new Date().getDay();

        if(l === q.r) {
            document.getElementById('btn-'+l).classList.add('correta');
            if(!modoErro) assAtivo.a++;
            q.errouAntes = false; // Limpa status de erro se acertou
            histAcertos[diaSemana]++;
        } else {
            document.getElementById('btn-'+l).classList.add('errada');
            document.getElementById('btn-'+q.r).classList.add('correta');
            if(!modoErro) assAtivo.e++;
            q.errouAntes = true; // Marca para recuperação
        }
        
        if(q.coment) {
            document.getElementById('sim-coment-txt').innerText = q.coment;
            document.getElementById('sim-feedback').classList.remove('hidden');
        }
        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() {
        qIndex++;
        if(qIndex < questoesSessao.length) renderQ();
        else { alert("Fim da sessão!"); navegar('dashboard'); }
    }

    // DASHBOARD E HISTÓRICO (CORRIGIDO)
    function renderDashboard() {
        let tA=0, tE=0, tV=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tE+=a.e; if(a.check) tV++; }));
        document.getElementById('total-q').innerText = tA+tE;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-pct').innerText = (tA+tE)>0?((tA/(tA+tE))*100).toFixed(1)+'%':'0%';
        document.getElementById('total-vistos').innerText = tV;
        
        renderCalendario();
        renderGrafico();
    }

    function renderCalendario() {
        const grid = document.getElementById('cal-grid');
        const hoje = new Date();
        const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
        
        grid.innerHTML = ['D','S','T','Q','Q','S','S'].map(d => `<small>${d}</small>`).join('');
        
        for(let i=1; i<=diasNoMes; i++) {
            const dataStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
            const temLog = logsEstudo[dataStr];
            grid.innerHTML += `<div class="cal-day ${temLog?'has-log':''}" title="${temLog?temLog.join(', '):''}" onclick="verLog('${dataStr}')">${i}</div>`;
        }
    }

    function verLog(data) {
        const log = logsEstudo[data];
        document.getElementById('cal-detalhes').innerText = log ? `Nesse dia você estudou: ${log.join(', ')}` : "Nenhum estudo registrado.";
    }

    // GRÁFICO
    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'], 
                datasets: [{ label: 'Acertos Diários', data: histAcertos, borderColor: '#2563eb', tension: 0.3, fill: true, backgroundColor: 'rgba(37, 99, 235, 0.1)' }] 
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">📚 ${m.nome}</button>`
        ).join('');
    }

    function toggleTimer() {
        const btn = document.getElementById('btn-timer-toggle');
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; btn.innerText = "Iniciar"; }
        else {
            timerInterval = setInterval(() => {
                seconds++;
                const hrs = String(Math.floor(seconds/3600)).padStart(2,'0');
                const mins = String(Math.floor((seconds%3600)/60)).padStart(2,'0');
                const secs = String(seconds%60).padStart(2,'0');
                document.getElementById('display-timer').innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
            btn.innerText = "Pausar";
        }
    }
    function resetTimer() { seconds = 0; document.getElementById('display-timer').innerText = "00:00:00"; }
    function toggleDarkMode() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        localStorage.setItem('sge_u_dark', isDarkMode);
        document.getElementById('btn-theme').innerText = isDarkMode ? "☀️ Modo Claro" : "🌙 Modo Noturno";
    }

    renderMenu(); renderDashboard();
</script>
</body>
</html>
