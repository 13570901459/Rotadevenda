<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUTURO MIKE - PM PE 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --success: #10b981; --danger: #ef4444; 
            --warning: #f59e0b; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; 
            --accent: #8b5cf6; --text: #1e293b; --card-border: #e2e8f0;
            --hl-yellow: #fef08a;
        }

        body.dark-mode {
            --bg: #020617; --white: #1e293b; --text: #f1f5f9;
            --card-border: #334155; --dark: #000000; --hl-yellow: #854d0e;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; display: flex; flex-direction: row; height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

        aside { 
            width: 280px; min-width: 280px; background: var(--dark); color: white; 
            display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--card-border); 
            z-index: 100; transition: transform 0.3s ease;
        }

        .logo { font-size: 1.4rem; font-weight: 800; color: var(--success); margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .theme-toggle { background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-size: 0.8rem; width: 100%; font-weight: bold; border: 1px solid #475569; }
        .timer-box { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; border: 1px solid var(--primary); }
        .timer-display { font-size: 1.5rem; font-family: monospace; color: var(--primary); font-weight: bold; margin: 5px 0; }
        
        .nav-group { overflow-y: auto; flex: 1; margin-bottom: 10px; }
        .nav-btn { width: 100%; background: transparent; border: none; color: #94a3b8; text-align: left; padding: 12px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; transition: 0.2s; font-weight: 500; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: white; }

        main { flex: 1; padding: 30px; overflow-y: auto; scroll-behavior: smooth; position: relative; width: 100%; }
        
        .card { background: var(--white); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; border: 1px solid var(--card-border); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card-stat { background: var(--white); padding: 20px; border-radius: 12px; border-top: 4px solid var(--primary); border: 1px solid var(--card-border); }

        /* --- ESTILOS DE PROVA --- */
        #sim-txt { 
            font-size: 1.15rem; line-height: 1.6; padding: 15px; background: rgba(100,100,100,0.05); 
            border-radius: 8px; user-select: text; margin-bottom: 20px;
        }
        .grifado { background-color: var(--hl-yellow); border-radius: 2px; }
        
        .opcoes-container { display: flex; flex-direction: column; gap: 10px; }
        .opcao-row { display: flex; align-items: stretch; gap: 10px; }
        
        .alt-btn { 
            flex: 1; text-align: left; padding: 15px; border: 2px solid var(--card-border); 
            border-radius: 8px; background: var(--white); cursor: pointer; color: var(--text); 
            font-size: 1rem; transition: 0.2s;
        }
        .alt-btn.eliminada { opacity: 0.3; text-decoration: line-through; filter: grayscale(1); border-style: dashed; }
        
        .btn-eliminar { 
            width: 45px; background: #fee2e2; color: #ef4444; border: 2px solid #fecaca; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.2rem;
        }

        /* Botão Flutuante de Grifar */
        #btn-grifar-float {
            position: absolute; display: none; background: var(--warning); color: black;
            border: none; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem;
            cursor: pointer; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000;
        }

        .correta { border-color: var(--success) !important; background: rgba(16, 185, 129, 0.15) !important; }
        .errada { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }

        .hidden { display: none !important; }
        #menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 60px; height: 60px; border-radius: 50%; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--card-border); }
        
        @media (max-width: 850px) {
            aside { position: fixed; left: -280px; height: 100%; }
            aside.active { left: 0; }
            #menu-toggle { display: flex; }
        }
    </style>
</head>
<body>

<button id="menu-toggle" class="btn-primary" onclick="document.querySelector('aside').classList.toggle('active')">☰</button>

<aside>
    <div class="logo">FUTURO MIKE</div>
    <button class="theme-toggle" onclick="toggleDarkMode()" id="btn-theme">🌙 Modo Noturno</button>

    <div class="timer-box">
        <div class="timer-display" id="display-timer">00:00:00</div>
        <div style="display:flex; gap:5px; justify-content:center">
            <button onclick="toggleTimer()" id="btn-timer-toggle" style="cursor:pointer">Iniciar</button>
            <button onclick="resetTimer()" style="cursor:pointer">Zerar</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn active" id="btn-dash" onclick="navegar('dashboard')">🏠 Dashboard Inicial</button>
        <div id="lista-materias-menu"></div>
    </div>
    
    <button class="nav-btn" onclick="novaMateria()" style="color:var(--success)">+ Nova Disciplina</button>
</aside>

<main>
    <div id="secao-dashboard">
        <div class="stats-grid">
            <div class="card-stat"><small>Questões</small><h2 id="total-q">0</h2></div>
            <div class="card-stat"><small>Acertos</small><h2 id="total-a" style="color:var(--success)">0</h2></div>
            <div class="card-stat"><small>Vistos</small><h2 id="total-vistos">0</h2></div>
        </div>
        <div class="card">
            <h3>Evolução</h3>
            <canvas id="graficoEvolucao" height="100"></canvas>
        </div>
    </div>

    <div id="secao-materia" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <h1 id="materia-nome-txt">Disciplina</h1>
            <button onclick="novoAssunto()">+ Tópico</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Visto</th><th>Tópico</th><th>%</th><th>Ações</th></tr></thead>
                <tbody id="tabela-assuntos"></tbody>
            </table>
        </div>
    </div>

    <div id="secao-simulado" class="hidden">
        <button id="btn-grifar-float" onclick="aplicarGrifo()">🖋️ GRIFAR</button>
        
        <div class="card" style="max-width: 850px; margin: auto;">
            <div id="sim-status" style="font-weight:bold; color:var(--primary); margin-bottom:15px"></div>
            
            <div id="sim-txt" onmouseup="mostrarBotaoGrifo(event)" ontouchend="mostrarBotaoGrifo(event)"></div>
            
            <div class="opcoes-container" id="sim-opcs"></div>
            
            <div id="sim-feedback" class="card hidden" style="margin-top:15px; background:rgba(37, 99, 235, 0.1);">
                <strong>💡 Comentário:</strong> <p id="sim-coment-txt"></p>
            </div>
            
            <button class="nav-btn active" id="sim-next" style="margin-top:20px; text-align:center" onclick="proximaQ()" class="hidden">PRÓXIMA QUESTÃO</button>
        </div>
    </div>

    <div id="secao-cadastro" class="hidden">
        <div class="card">
            <h2>Cadastrar Questão</h2>
            <textarea id="q-enun" rows="4" style="width:100%; margin-bottom:10px"></textarea>
            <input type="text" id="q-a" placeholder="Opção A" style="width:100%; margin-bottom:5px">
            <input type="text" id="q-b" placeholder="Opção B" style="width:100%; margin-bottom:5px">
            <input type="text" id="q-c" placeholder="Opção C" style="width:100%; margin-bottom:5px">
            <input type="text" id="q-d" placeholder="Opção D" style="width:100%; margin-bottom:10px">
            <select id="q-gab"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
            <button onclick="salvarQuestaoManual()">Salvar</button>
        </div>
    </div>
</main>

<script>
    let db = JSON.parse(localStorage.getItem('mike_db')) || [];
    let histAcertos = JSON.parse(localStorage.getItem('mike_hist')) || [0,0,0,0,0,0,0];
    let matAtiva = null, assAtivo = null, qIndex = 0, timerInterval, seconds = 0, questoesSessao = [];

    // --- LOGICA DE GRIFAR ---
    function mostrarBotaoGrifo(e) {
        const sel = window.getSelection();
        const btn = document.getElementById('btn-grifar-float');
        if (sel.toString().length > 2) {
            const range = sel.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            btn.style.display = 'block';
            btn.style.top = (rect.top + window.scrollY - 35) + 'px';
            btn.style.left = rect.left + 'px';
        } else {
            btn.style.display = 'none';
        }
    }

    function aplicarGrifo() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.className = 'grifado';
        range.surroundContents(span);
        sel.removeAllRanges();
        document.getElementById('btn-grifar-float').style.display = 'none';
    }

    // --- LOGICA DE ELIMINAR ---
    function eliminarAlternativa(letra) {
        document.getElementById('btn-' + letra).classList.toggle('eliminada');
    }

    // --- CORE ---
    function navegar(id) { 
        document.querySelectorAll('main > div').forEach(d => d.classList.add('hidden'));
        document.getElementById('secao-' + id).classList.remove('hidden');
        if(id === 'dashboard') renderDashboard();
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('mike_dark', document.body.classList.contains('dark-mode'));
    }

    function salvar() { localStorage.setItem('mike_db', JSON.stringify(db)); renderMenu(); }

    function renderMenu() {
        document.getElementById('lista-materias-menu').innerHTML = db.map(m => 
            `<button class="nav-btn" onclick="abrirMateria(${m.id})">📚 ${m.nome}</button>`
        ).join('');
    }

    function abrirMateria(id) {
        matAtiva = db.find(m => m.id === id); navegar('materia');
        document.getElementById('materia-nome-txt').innerText = matAtiva.nome;
        document.getElementById('tabela-assuntos').innerHTML = matAtiva.assuntos.map(a => `
            <tr>
                <td><input type="checkbox" ${a.check?'checked':''} onchange="marcarVisto(${a.id})"></td>
                <td>${a.nome}</td>
                <td>${(a.a+a.e)>0?((a.a/(a.a+a.e))*100).toFixed(0):0}%</td>
                <td>
                    <button onclick="assAtivo=matAtiva.assuntos.find(x=>x.id===${a.id});navegar('cadastro')">✏️</button>
                    <button onclick="irSimulado(${a.id})" style="background:var(--success); color:white">📝</button>
                </td>
            </tr>
        `).join('');
    }

    function marcarVisto(id) {
        const a = matAtiva.assuntos.find(x => x.id === id);
        a.check = !a.check; salvar(); abrirMateria(matAtiva.id);
    }

    function irSimulado(id) {
        assAtivo = matAtiva.assuntos.find(a => a.id === id);
        if(!assAtivo.questoes.length) return alert("Sem questões!");
        questoesSessao = [...assAtivo.questoes].sort(() => Math.random() - 0.5);
        qIndex = 0; navegar('simulado'); renderQ();
    }

    function renderQ() {
        const q = questoesSessao[qIndex];
        document.getElementById('sim-status').innerText = `Questão ${qIndex+1}/${questoesSessao.length}`;
        document.getElementById('sim-txt').innerText = q.p;
        document.getElementById('sim-next').classList.add('hidden');
        document.getElementById('sim-feedback').classList.add('hidden');
        
        let html = "";
        ['A','B','C','D'].forEach(l => {
            html += `
            <div class="opcao-row">
                <button class="alt-btn" id="btn-${l}" onclick="validar('${l}')"><b>${l})</b> ${q[l.toLowerCase()]}</button>
                <button class="btn-eliminar" onclick="eliminarAlternativa('${l}')">×</button>
            </div>`;
        });
        document.getElementById('sim-opcs').innerHTML = html;
    }

    function validar(l) {
        const q = questoesSessao[qIndex];
        if (document.getElementById('btn-'+l).classList.contains('eliminada')) return;

        if(l === q.r) {
            document.getElementById('btn-'+l).classList.add('correta');
            assAtivo.a++;
            histAcertos[new Date().getDay()]++;
        } else {
            document.getElementById('btn-'+l).classList.add('errada');
            document.getElementById('btn-'+q.r).classList.add('correta');
            assAtivo.e++;
        }
        if(q.coment) { document.getElementById('sim-coment-txt').innerText = q.coment; document.getElementById('sim-feedback').classList.remove('hidden'); }
        document.getElementById('sim-next').classList.remove('hidden');
        salvar();
    }

    function proximaQ() {
        qIndex++;
        if(qIndex < questoesSessao.length) renderQ();
        else { alert("Fim!"); navegar('dashboard'); }
    }

    function renderDashboard() {
        let tA=0, tE=0, tV=0;
        db.forEach(m => m.assuntos.forEach(a => { tA+=a.a; tE+=a.e; if(a.check) tV++; }));
        document.getElementById('total-q').innerText = tA+tE;
        document.getElementById('total-a').innerText = tA;
        document.getElementById('total-vistos').innerText = tV;
        renderGrafico();
    }

    function renderGrafico() {
        const ctx = document.getElementById('graficoEvolucao').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, { type: 'line', data: { labels: ['D','S','T','Q','Q','S','S'], datasets: [{ label: 'Acertos', data: histAcertos, borderColor: '#2563eb', fill: true }] } });
    }

    function novaMateria() { let n = prompt("Nome:"); if(n) { db.push({id:Date.now(), nome:n, assuntos:[]}); salvar(); } }
    function novoAssunto() { let n = prompt("Tópico:"); if(n) { matAtiva.assuntos.push({id:Date.now(), nome:n, check:false, a:0, e:0, questoes:[]}); salvar(); abrirMateria(matAtiva.id); } }
    function salvarQuestaoManual() {
        assAtivo.questoes.push({ p: document.getElementById('q-enun').value, a: document.getElementById('q-a').value, b: document.getElementById('q-b').value, c: document.getElementById('q-c').value, d: document.getElementById('q-d').value, r: document.getElementById('q-gab').value, coment: '', erro: false });
        salvar(); navegar('materia');
    }

    function toggleTimer() {
        if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        else { timerInterval = setInterval(() => { seconds++; let h=Math.floor(seconds/3600), m=Math.floor((seconds%3600)/60), s=seconds%60; document.getElementById('display-timer').innerText = [h,m,s].map(v=>String(v).padStart(2,'0')).join(':'); }, 1000); }
    }
    function resetTimer() { seconds = 0; document.getElementById('display-timer').innerText = "00:00:00"; }

    renderMenu(); renderDashboard();
</script>
</body>
</html>
