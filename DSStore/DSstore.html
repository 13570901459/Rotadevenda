<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Store | Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #bc00ff;
            --bg: #0a0a0a;
            --card-bg: #151515;
            --text: #ffffff;
            --whatsapp: #25d366;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* LOGO DINAMICO */
        .logo {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            background: linear-gradient(45deg, #bc00ff, #7000ff, #00d4ff, #bc00ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-flow 5s ease infinite;
            filter: drop-shadow(0 0 8px rgba(188, 0, 255, 0.3));
        }

        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* HEADER & BUSCA */
        header {
            padding: 15px 5%;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0; z-index: 1000;
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .search-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 12px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 50px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        #search-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(188, 0, 255, 0.2); }

        /* CARRINHO MODERNO (GLASS) */
        .modern-cart {
            cursor: pointer;
            transition: 0.3s;
        }

        .cart-glass {
            background: rgba(188, 0, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(188, 0, 255, 0.5);
            padding: 10px 15px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        #cart-count {
            background: var(--primary);
            color: white;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 14px;
        }

        /* CATEGORIAS */
        .categories-nav {
            display: flex; gap: 10px; overflow-x: auto; padding: 15px 5%; background: #000; scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: #1a1a1a; border: 1px solid #333; color: #888; padding: 10px 20px;
            border-radius: 50px; white-space: nowrap; cursor: pointer; font-size: 12px; font-weight: 700;
        }
        .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* GRID PRODUTOS */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;
        }
        .product-card {
            background: var(--card-bg); border: 1px solid #222; border-radius: 15px; overflow: hidden;
            display: flex; flex-direction: column; transition: 0.3s;
        }
        .product-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .product-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #222; }
        .product-info { padding: 15px; }
        .product-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; height: 35px; overflow: hidden; }
        .price-new { color: var(--primary); font-size: 22px; font-weight: 900; margin-bottom: 12px; }
        .add-btn {
            width: 100%; background: var(--primary); color: white; border: none;
            padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer;
        }

        /* SIDEBAR CARRINHO */
        #cart-sidebar {
            position: fixed; right: -100%; top: 0; width: 100%; max-width: 380px;
            height: 100%; background: #0f0f0f; z-index: 2000; padding: 30px;
            transition: 0.4s; border-left: 1px solid #222;
        }
        #cart-sidebar.active { right: 0; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #222; }
        .remove-item { background: none; border: none; color: #ff4d4d; cursor: pointer; font-size: 18px; }
        .checkout-btn { width: 100%; background: var(--whatsapp); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px; }
        .clear-cart-btn { width: 100%; background: transparent; color: #666; border: 1px solid #333; padding: 10px; border-radius: 10px; margin-top: 10px; cursor: pointer; }

        /* WHATSAPP FLOAT */
        .whatsapp-float {
            position: fixed; width: 60px; height: 60px; bottom: 20px; right: 20px;
            background: #25d366; border-radius: 50px; display: flex; align-items: center;
            justify-content: center; z-index: 3000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .whatsapp-float img { width: 35px; }

        @media (max-width: 600px) {
            .product-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .logo { font-size: 20px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="logo">DS STORE</div>
        <div class="modern-cart" onclick="toggleCart()">
            <div class="cart-glass">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span id="cart-count">0</span>
            </div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Pesquisar produto..." onkeyup="filterProducts()">
    </div>
</header>

<div class="categories-nav">
    <button class="cat-btn active" onclick="filterCategory('TODOS', this)">TODOS</button>
    <button class="cat-btn" onclick="filterCategory('JOGOS E CHEATS', this)">JOGOS E CHEATS</button>
    <button class="cat-btn" onclick="filterCategory('PROGRAMAS WIN/MAC', this)">PROGRAMAS WIN/MAC</button>
    <button class="cat-btn" onclick="filterCategory('MARKETING DIGITAL', this)">MARKETING DIGITAL</button>
    <button class="cat-btn" onclick="filterCategory('CONTAS STREAMING', this)">CONTAS STREAMING</button>
    <button class="cat-btn" onclick="filterCategory('DESIGN E EDIÇÃO', this)">DESIGN E EDIÇÃO</button>
    <button class="cat-btn" onclick="filterCategory('CURSOS PREMIUM', this)">CURSOS PREMIUM</button>
</div>

<div class="container">
    <div class="product-grid" id="product-list"></div>
</div>

<div id="cart-sidebar">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h3>Meu Carrinho</h3>
        <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:30px; cursor:pointer;">&times;</button>
    </div>
    <div id="cart-items-list"></div>
    <div style="margin-top: 30px; border-top: 1px solid #222; padding-top: 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 900;">
            <span>Total:</span>
            <span style="color: var(--primary);">R$ <span id="cart-total">0,00</span></span>
        </div>
        <button class="checkout-btn" onclick="sendWhatsApp()">FINALIZAR PEDIDO</button>
        <button class="clear-cart-btn" onclick="clearCart()">Limpar tudo</button>
    </div>
</div>

<a href="https://wa.me/5511999999999" class="whatsapp-float" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
</a>

<script>
    const products = [
        { name: "Cheat Warzone VIP", price: 49.90, cat: "JOGOS E CHEATS", img: "https://via.placeholder.com/300?text=Warzone" },
        { name: "Adobe Pack 2024", price: 29.90, cat: "PROGRAMAS WIN/MAC", img: "https://via.placeholder.com/300?text=Adobe" },
        { name: "Netflix 4K Ultra", price: 15.90, cat: "CONTAS STREAMING", img: "https://via.placeholder.com/300?text=Netflix" },
        { name: "Curso Tráfego Pago", price: 39.90, cat: "MARKETING DIGITAL", img: "https://via.placeholder.com/300?text=Marketing" },
        { name: "Pack Canva Pro VIP", price: 19.90, cat: "DESIGN E EDIÇÃO", img: "https://via.placeholder.com/300?text=Canva" },
        { name: "Curso Python do Zero", price: 59.90, cat: "CURSOS PREMIUM", img: "https://via.placeholder.com/300?text=Python" },
        { name: "Youtube Premium", price: 14.90, cat: "CONTAS STREAMING", img: "https://via.placeholder.com/300?text=Youtube" },
        { name: "Disney+ & Star+", price: 19.90, cat: "CONTAS STREAMING", img: "https://via.placeholder.com/300?text=Disney" },
    ];

    let cart = [];
    let currentCategory = "TODOS";

    // Formata número para Moeda Brasileira (Vírgula)
    function formatMoney(value) {
        return value.toLocaleString('pt-br', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderProducts(data) {
        const list = document.getElementById('product-list');
        list.innerHTML = data.map(p => `
            <div class="product-card">
                <img src="${p.img}" class="product-img">
                <div class="product-info">
                    <div class="product-title">${p.name}</div>
                    <div class="price-new">R$ ${formatMoney(p.price)}</div>
                    <button class="add-btn" onclick="addToCart('${p.name}', ${p.price})">ADICIONAR</button>
                </div>
            </div>
        `).join('');
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterProducts();
    }

    function filterProducts() {
        const term = document.getElementById('search-input').value.toLowerCase();
        const filtered = products.filter(p => {
            const matchCat = currentCategory === "TODOS" || p.cat === currentCategory;
            const matchSearch = p.name.toLowerCase().includes(term);
            return matchCat && matchSearch;
        });
        renderProducts(filtered);
    }

    function addToCart(name, price) {
        cart.push({name, price});
        updateCart();
        document.getElementById('cart-sidebar').classList.add('active');
    }

    function updateCart() {
        const list = document.getElementById('cart-items-list');
        const count = document.getElementById('cart-count');
        const totalDisp = document.getElementById('cart-total');
        
        let total = 0;
        if (cart.length === 0) {
            list.innerHTML = "<p style='color:#666; text-align:center;'>Vazio</p>";
        } else {
            list.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div>
                            <p style="font-weight:700;">${item.name}</p>
                            <p style="color:var(--primary);">R$ ${formatMoney(item.price)}</p>
                        </div>
                        <button class="remove-item" onclick="removeItem(${index})">🗑️</button>
                    </div>
                `;
            }).join('');
        }
        count.innerText = cart.length;
        totalDisp.innerText = formatMoney(total);
    }

    function removeItem(index) {
        cart.splice(index, 1);
        updateCart();
    }

    function clearCart() {
        if (confirm("Limpar carrinho?")) { cart = []; updateCart(); }
    }

    function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }

    function sendWhatsApp() {
        if(cart.length === 0) return alert("Carrinho vazio!");
        const total = document.getElementById('cart-total').innerText;
        let msg = "*PEDIDO - DS STORE*%0A%0A" + cart.map(i => `• ${i.name} (R$ ${formatMoney(i.price)})`).join('%0A');
        msg += `%0A%0A*TOTAL: R$ ${total}*`;
        window.open(`https://wa.me/5511999999999?text=${msg}`);
    }

    renderProducts(products);
</script>
</body>
</html>
