<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estudos - Revisão Espaçada</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--light); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-back { background: #64748b; color: white; margin-bottom: 10px; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #fff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; text-align: center; cursor: pointer; position: relative; }
        .card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .delete-icon { position: absolute; top: 5px; right: 5px; color: var(--danger); font-size: 12px; }

        .quiz-container { display: none; }
        .option { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 6px; text-align: left; background: white; cursor: pointer; }
        .option.correct { background: #dcfce7; border-color: var(--success); }
        .option.wrong { background: #fee2e2; border-color: var(--danger); }
        .option.eliminated { text-decoration: line-through; opacity: 0.5; }

        #commentary { margin-top: 15px; padding: 15px; background: #f1f5f9; border-radius: 6px; display: none; }
        .hidden { display: none; }
        
        .input-group { margin-bottom: 20px; display: flex; gap: 10px; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">
    <div id="view-disciplines">
        <header>
            <h1>Minhas Disciplinas</h1>
            <button class="btn btn-primary" onclick="addDiscipline()">+ Disciplina</button>
        </header>
        <div class="card-grid" id="discipline-list"></div>
    </div>

    <div id="view-subjects" class="hidden">
        <button class="btn btn-back" onclick="showView('disciplines')">← Voltar</button>
        <header>
            <h1 id="current-discipline-name">Assuntos</h1>
            <button class="btn btn-primary" onclick="addSubject()">+ Assunto</button>
        </header>
        <div class="card-grid" id="subject-list"></div>
    </div>

    <div id="view-add-question" class="hidden">
        <button class="btn btn-back" onclick="showView('subjects')">← Voltar</button>
        <h2>Cadastrar Questão (JSON)</h2>
        <textarea id="json-input" rows="10" placeholder='Cole o JSON aqui...' style="width: 100%;"></textarea>
        <p><small>Formato esperado: {"q": "Pergunta", "a": "Opção A", "b": "Opção B", "c": "Opção C", "d": "Opção D", "e": "Opção E", "correct": "a", "comment": "Explicação"}</small></p>
        <button class="btn btn-primary" onclick="saveQuestion()">Salvar Questão</button>
        <button class="btn btn-success" style="background:var(--success); color:white" onclick="startQuiz()">Iniciar Quiz</button>
        
        <div id="revisions-info" style="margin-top: 20px;">
            <h3>Próximas Revisões</h3>
            <ul id="revision-dates"></ul>
        </div>
    </div>

    <div id="view-quiz" class="hidden">
        <div id="quiz-content">
            <h3 id="q-text"></h3>
            <div id="options-container"></div>
            <div id="commentary"></div>
            <br>
            <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none">Próxima Questão</button>
        </div>
        <div id="quiz-result" class="hidden">
            <h2>Resultado</h2>
            <p id="score-text"></p>
            <button class="btn btn-primary" onclick="showView('subjects')">Finalizar</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('studyDB')) || { disciplines: [] };
    let currentDiscIndex = null;
    let currentSubjIndex = null;
    let currentQuestionIndex = 0;
    let score = 0;

    function saveDB() {
        localStorage.setItem('studyDB', JSON.stringify(db));
        renderDisciplines();
    }

    function showView(view) {
        document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
        document.getElementById(`view-${view}`).classList.remove('hidden');
    }

    // --- DISCIPLINAS ---
    function addDiscipline() {
        const name = prompt("Nome da Disciplina:");
        if (name) {
            db.disciplines.push({ name, subjects: [] });
            saveDB();
        }
    }

    function deleteDiscipline(e, index) {
        e.stopPropagation();
        if(confirm("Excluir disciplina e tudo dentro dela?")) {
            db.disciplines.splice(index, 1);
            saveDB();
        }
    }

    function renderDisciplines() {
        const list = document.getElementById('discipline-list');
        list.innerHTML = '';
        db.disciplines.forEach((d, i) => {
            list.innerHTML += `
                <div class="card" onclick="openDiscipline(${i})">
                    <span class="delete-icon" onclick="deleteDiscipline(event, ${i})">✖</span>
                    <h3>${d.name}</h3>
                </div>`;
        });
    }

    function openDiscipline(index) {
        currentDiscIndex = index;
        document.getElementById('current-discipline-name').innerText = db.disciplines[index].name;
        renderSubjects();
        showView('subjects');
    }

    // --- ASSUNTOS ---
    function addSubject() {
        const name = prompt("Nome do Assunto:");
        if (name) {
            db.disciplines[currentDiscIndex].subjects.push({ 
                name, 
                questions: [],
                lastStudy: null 
            });
            saveDB();
            renderSubjects();
        }
    }

    function renderSubjects() {
        const list = document.getElementById('subject-list');
        list.innerHTML = '';
        db.disciplines[currentDiscIndex].subjects.forEach((s, i) => {
            list.innerHTML += `<div class="card" onclick="openSubject(${i})"><h3>${s.name}</h3></div>`;
        });
    }

    function openSubject(index) {
        currentSubjIndex = index;
        calculateRevisions();
        showView('add-question');
    }

    // --- QUESTÕES (JSON) & REVISÃO ---
    function saveQuestion() {
        const input = document.getElementById('json-input');
        try {
            const qData = JSON.parse(input.value);
            db.disciplines[currentDiscIndex].subjects[currentSubjIndex].questions.push(qData);
            db.disciplines[currentDiscIndex].subjects[currentSubjIndex].lastStudy = new Date().toISOString();
            saveDB();
            input.value = '';
            alert("Questão salva!");
            calculateRevisions();
        } catch (e) {
            alert("Erro no formato JSON!");
        }
    }

    function calculateRevisions() {
        const subject = db.disciplines[currentDiscIndex].subjects[currentSubjIndex];
        const list = document.getElementById('revision-dates');
        list.innerHTML = '';
        
        if (!subject.lastStudy) return;

        const baseDate = new Date(subject.lastStudy);
        const intervals = [1, 3, 7, 15, 30];
        
        intervals.forEach(days => {
            let revDate = new Date(baseDate);
            revDate.setDate(revDate.getDate() + days);
            list.innerHTML += `<li>Revisão ${days}d: <strong>${revDate.toLocaleDateString()}</strong></li>`;
        });
    }

    // --- QUIZ LOGIC ---
    function startQuiz() {
        const questions = db.disciplines[currentDiscIndex].subjects[currentSubjIndex].questions;
        if (questions.length === 0) return alert("Adicione questões primeiro!");
        
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('quiz-result').classList.add('hidden');
        document.getElementById('quiz-content').classList.remove('hidden');
        showView('quiz');
        renderQuestion();
    }

    function renderQuestion() {
        const q = db.disciplines[currentDiscIndex].subjects[currentSubjIndex].questions[currentQuestionIndex];
        document.getElementById('q-text').innerText = q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        document.getElementById('commentary').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        ['a', 'b', 'c', 'd', 'e'].forEach(letter => {
            if (q[letter]) {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerText = `${letter.toUpperCase()}) ${q[letter]}`;
                btn.oncontextmenu = (e) => { e.preventDefault(); btn.classList.toggle('eliminated'); };
                btn.onclick = () => checkAnswer(letter, btn);
                container.appendChild(btn);
            }
        });
    }

    function checkAnswer(letter, element) {
        const q = db.disciplines[currentDiscIndex].subjects[currentSubjIndex].questions[currentQuestionIndex];
        const options = document.querySelectorAll('.option');
        
        options.forEach(opt => opt.onclick = null); // Trava cliques

        if (letter === q.correct) {
            element.classList.add('correct');
            score++;
        } else {
            element.classList.add('wrong');
            options.forEach(opt => {
                if (opt.innerText.startsWith(q.correct.toUpperCase())) opt.classList.add('correct');
            });
        }

        const comm = document.getElementById('commentary');
        comm.innerHTML = `<strong>Gabarito: ${q.correct.toUpperCase()}</strong><br>${q.comment}`;
        comm.style.display = 'block';
        document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        const questions = db.disciplines[currentDiscIndex].subjects[currentSubjIndex].questions;
        
        if (currentQuestionIndex < questions.length) {
            renderQuestion();
        } else {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('quiz-result').classList.remove('hidden');
            document.getElementById('score-text').innerText = `Você acertou ${score} de ${questions.length} questões!`;
        }
    }

    // Inicialização
    renderDisciplines();
</script>

</body>
</html>
